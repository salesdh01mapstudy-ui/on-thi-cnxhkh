ê tín dị đoan, không được ép buộc người dân theo đạo.",150]],[6,2,"Điền từ thích hợp vào chỗ trống: Xu hướng thứ hai, các dân tộc trong từng quốc gia, thậm chí các dân tộc ở nhiều quốc gia muốn ____ lại với nhau.","liên hiệp","lãnh thổ","tộc người","bộ tộc",["2. CN Mác - Lênin về vấn đề dân tộc","Xu hướng thứ hai, các dân tộc trong từng quốc gia, thậm chí các dân tộc ở nhiều quốc gia muốn liên hiệp lại với nhau.",131]],[6,2,"Điền từ thích hợp vào chỗ trống: Đảng ta khẳng định, ____, tôn giáo sẽ tồn tại lâu dài cùng dân tộc trong quá trình xây dựng chủ nghĩa xã hội.","tín ngưỡng","thiểu số","tộc người","thần linh",["5. Tôn giáo ở Việt Nam, chính sách của Đảng và Nhà nước","Đảng ta khẳng định, tín ngưỡng, tôn giáo sẽ tồn tại lâu dài cùng dân tộc trong quá trình xây dựng chủ nghĩa xã hội.",148]],[6,3,"Điền từ thích hợp vào chỗ trống: Đặc điểm này một mặt tạo điều kiện thuận lợi để các ____ tăng cường hiểu biết, mở rộng giao lưu, giúp đỡ nhau cùng phát triển, tạo nên một nền văn hóa thống nhất trong đa dạng.","dân tộc","gia đình","giai cấp","nhà nước",["3. Dân tộc và quan hệ dân tộc ở Việt Nam","Đặc điểm này một mặt tạo điều kiện thuận lợi để các dân tộc tăng cường hiểu biết, mở rộng giao lưu, giúp đỡ nhau cùng phát triển, tạo nên một nền văn hóa thống nhất trong đa dạng.",135]],[6,2,"Điền từ thích hợp vào chỗ trống: Những vấn đề liên quan đến dân tộc, ____ nếu không được giải quyết một cách thỏa đáng sẽ dẫn tới nguy cơ gây mất ổn định chính trị, xã hội, dễ tạo cớ cho các thế lực thù địch bên ngoài can thiệp vào công việc nội bộ của đất nước.","tôn giáo","đồng bào","tộc người","chia rẽ",["7. Định hướng giải quyết quan hệ dân tộc, tôn giáo","Những vấn đề liên quan đến dân tộc, tôn giáo nếu không được giải quyết một cách thỏa đáng sẽ dẫn tới nguy cơ gây mất ổn định chính trị, xã hội, dễ tạo cớ cho các thế lực thù địch bên ngoài can thiệp vào công việc nội bộ của đất nước.",154]],[6,2,"Điền từ thích hợp vào chỗ trống: Về xã hội: Thực hiện chính sách xã hội, đảm bảo an sinh xã hội trong vùng đồng bào ____ thiểu số.","dân tộc","giai cấp","tôn giáo","tín ngưỡng",["3. Dân tộc và quan hệ dân tộc ở Việt Nam","Về xã hội: Thực hiện chính sách xã hội, đảm bảo an sinh xã hội trong vùng đồng bào dân tộc thiểu số.",139]],[6,2,"Điền từ thích hợp vào chỗ trống: Tính thống nhất trong ngôn ngữ ____ được thể hiện trước hết ở sự thống nhất về cấu trúc ngữ pháp và kho từ vựng cơ bản.","dân tộc","nhà nước","giai cấp","tôn giáo",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Tính thống nhất trong ngôn ngữ dân tộc được thể hiện trước hết ở sự thống nhất về cấu trúc ngữ pháp và kho từ vựng cơ bản.",129]],[6,2,"Điền từ thích hợp vào chỗ trống: Khái niệm, đặc trưng cơ bản của dân tộc Theo quan điểm của chủ nghĩa Mác - Lênin, dân tộc là quá trình phát triển lâu dài của xã hội loài người, trải qua các hình thức cộng đồng từ thấp đến cao, bao gồm: ____, bộ lạc, bộ tộc, dân tộc.","thị tộc","thiểu số","tín ngưỡng","miền núi",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Khái niệm, đặc trưng cơ bản của dân tộc Theo quan điểm của chủ nghĩa Mác - Lênin, dân tộc là quá trình phát triển lâu dài của xã hội loài người, trải qua các hình thức cộng đồng từ thấp đến cao, bao gồm: thị tộc, bộ lạc, bộ tộc, dân tộc.",127]],[6,3,"Điền từ thích hợp vào chỗ trống: Để thực hiện được quyền ____ dân tộc, trước hết phải thủ tiêu tình trạng áp bức giai cấp, trên cơ sở đó xoá bỏ tình trạng áp bức dân tộc; phải đấu tranh chống chủ nghĩa phân biệt chủng tộc, chủ nghĩa dân tộc cực đoan.","bình đẳng","bộ tộc","quốc gia","tộc người",["2. CN Mác - Lênin về vấn đề dân tộc","Để thực hiện được quyền bình đẳng dân tộc, trước hết phải thủ tiêu tình trạng áp bức giai cấp, trên cơ sở đó xoá bỏ tình trạng áp bức dân tộc; phải đấu tranh chống chủ nghĩa phân biệt chủng tộc, chủ nghĩa dân tộc cực đoan.",133]],[6,1,"Điền từ thích hợp vào chỗ trống: Trong xã hội công xã nguyên thủy, ____, tôn giáo chỉ biểu hiện thuần tuý về tư tưởng.","tín ngưỡng","ngôn ngữ","thị tộc","giáo hội",["4. Quan điểm CN Mác - Lênin về tôn giáo","Trong xã hội công xã nguyên thủy, tín ngưỡng, tôn giáo chỉ biểu hiện thuần tuý về tư tưởng.",145]],[6,1,"Điền từ thích hợp vào chỗ trống: ____ công nhân các dân tộc phản ánh sự thống nhất giữa giải phóng dân tộc và giải phóng giai cấp; phản ánh sự gắn bó chặt chẽ giữa tinh thần của chủ nghĩa yêu nước và chủ nghĩa quốc tế chân chính.","Liên hiệp","ngôn ngữ","lãnh thổ","giáo hội",["2. CN Mác - Lênin về vấn đề dân tộc","Liên hiệp công nhân các dân tộc phản ánh sự thống nhất giữa giải phóng dân tộc và giải phóng giai cấp; phản ánh sự gắn bó chặt chẽ giữa tinh thần của chủ nghĩa yêu nước và chủ nghĩa quốc tế chân chính.",134]],[6,1,"Điền từ thích hợp vào chỗ trống: Công tác tôn giáo không chỉ liên quan đến quần chúng tín đồ, chức sắc các tôn giáo, mà còn gắn liền với công tác đấu tranh, với âm mưu, hoạt động lợi dụng tôn giáo gây phương hại đến lợi ích Tổ quốc, ____.","dân tộc","bình đẳng","miền núi","lãnh thổ",["5. Tôn giáo ở Việt Nam, chính sách của Đảng và Nhà nước","Công tác tôn giáo không chỉ liên quan đến quần chúng tín đồ, chức sắc các tôn giáo, mà còn gắn liền với công tác đấu tranh, với âm mưu, hoạt động lợi dụng tôn giáo gây phương hại đến lợi ích Tổ quốc, dân tộc.",149]],[6,2,"Điền từ thích hợp vào chỗ trống: Tôn giáo và ____ không đồng nhất, nhưng có giao thoa nhất định.","tín ngưỡng","nhà nước","dân tộc","giai cấp",["4. Quan điểm CN Mác - Lênin về tôn giáo","Tôn giáo và tín ngưỡng không đồng nhất, nhưng có giao thoa nhất định.",141]],[6,2,"Điền từ thích hợp vào chỗ trống: Cộng đồng này xuất hiện sau bộ lạc, bộ tộc, kế thừa và phát triển cao hơn những nhân tố ____ của các cộng đồng đó.","tộc người","quốc gia","bình đẳng","tín ngưỡng",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Cộng đồng này xuất hiện sau bộ lạc, bộ tộc, kế thừa và phát triển cao hơn những nhân tố tộc người của các cộng đồng đó.",130]],[6,3,"Điền từ thích hợp vào chỗ trống: Mặt chính trị phản ánh mối quan hệ giữa tiến bộ với phản tiến bộ, phản ánh mâu thuẫn đối kháng về lợi ích kinh tế, chính trị giữa các giai cấp, mâu thuẫn giữa những thế lực lợi dụng ____ chống lại sự nghiệp cách mạng với lợi ích của nhân dân lao động.","tôn giáo","dân tộc","miền núi","tộc người",["4. Quan điểm CN Mác - Lênin về tôn giáo","Mặt chính trị phản ánh mối quan hệ giữa tiến bộ với phản tiến bộ, phản ánh mâu thuẫn đối kháng về lợi ích kinh tế, chính trị giữa các giai cấp, mâu thuẫn giữa những thế lực lợi dụng tôn giáo chống lại sự nghiệp cách mạng với lợi ích của nhân dân lao động.",145]],[6,3,"Điền từ thích hợp vào chỗ trống: Theo nghĩa hẹp, ____ (Ethnie) là khái niệm dùng để chỉ một cộng đồng tộc người được hình thành trong lịch sử, có mối liên hệ chặt chẽ và bền vững, có chung ý thức tự giác tộc người, ngôn ngữ và văn hóa.","dân tộc","giai cấp","nhà nước","tín ngưỡng",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Theo nghĩa hẹp, dân tộc (Ethnie) là khái niệm dùng để chỉ một cộng đồng tộc người được hình thành trong lịch sử, có mối liên hệ chặt chẽ và bền vững, có chung ý thức tự giác tộc người, ngôn ngữ và văn hóa.",130]],[6,2,"Điền từ thích hợp vào chỗ trống: Xây dựng quy chế phối hợp giữa lực lượng công an, quân đội với các đoàn thể trong công tác dân tộc, ____ để nắm chắc tình hình, quản lý chặt đối tượng, sẵn sàng các phương án chủ động đấu tranh ngăn chặn các hoạt động phá hoại của các thế lực thù địch.","tôn giáo","tộc người","quốc gia","thị tộc",["7. Định hướng giải quyết quan hệ dân tộc, tôn giáo","Xây dựng quy chế phối hợp giữa lực lượng công an, quân đội với các đoàn thể trong công tác dân tộc, tôn giáo để nắm chắc tình hình, quản lý chặt đối tượng, sẵn sàng các phương án chủ động đấu tranh ngăn chặn các hoạt động phá hoại của các thế lực thù địch.",155]],[6,2,"Điền từ thích hợp vào chỗ trống: Mọi công dân Việt Nam không phân biệt dân tộc, ____ và tôn giáo nhìn chung đều đoàn kết ý thức rõ về cội nguồn, về một quốc gia - dân tộc thống nhất cùng chung sức xây dựng và bảo vệ Tổ quốc.","tín ngưỡng","miền núi","lãnh thổ","bộ tộc",["6. Đặc điểm quan hệ dân tộc và tôn giáo ở Việt Nam","Mọi công dân Việt Nam không phân biệt dân tộc, tín ngưỡng và tôn giáo nhìn chung đều đoàn kết ý thức rõ về cội nguồn, về một quốc gia - dân tộc thống nhất cùng chung sức xây dựng và bảo vệ Tổ quốc.",150]],[6,2,"Điền từ thích hợp vào chỗ trống: Con người sáng tạo ra ____ vì mục đích, lợi ích của họ, phản ánh những ước mơ, nguyện vọng, suy nghĩ của họ.","tôn giáo","nhà nước","tín ngưỡng","giai cấp",["4. Quan điểm CN Mác - Lênin về tôn giáo","Con người sáng tạo ra tôn giáo vì mục đích, lợi ích của họ, phản ánh những ước mơ, nguyện vọng, suy nghĩ của họ.",140]],[6,3,"Điền từ thích hợp vào chỗ trống: Xu hướng thứ hai thể hiện ở sự xuất hiện những động lực thúc đẩy các ____ trong một cộng đồng quốc gia xích lại gần nhau hơn, hòa hợp với nhau ở mức độ cao hơn trên mọi lĩnh vực của đời sống xã hội.","dân tộc","tôn giáo","nhà nước","gia đình",["2. CN Mác - Lênin về vấn đề dân tộc","Xu hướng thứ hai thể hiện ở sự xuất hiện những động lực thúc đẩy các dân tộc trong một cộng đồng quốc gia xích lại gần nhau hơn, hòa hợp với nhau ở mức độ cao hơn trên mọi lĩnh vực của đời sống xã hội.",132]],[6,2,"Điền từ thích hợp vào chỗ trống: Công tác ____ có liên quan đến nhiều lĩnh vực của đời sống xã hội, các cấp, các ngành, các địa bàn, liên quan đến chính sách đối nội và đối ngoại của Đảng, Nhà nước.","tôn giáo","dân tộc","giai cấp","gia đình",["5. Tôn giáo ở Việt Nam, chính sách của Đảng và Nhà nước","Công tác tôn giáo có liên quan đến nhiều lĩnh vực của đời sống xã hội, các cấp, các ngành, các địa bàn, liên quan đến chính sách đối nội và đối ngoại của Đảng, Nhà nước.",149]],[6,2,"Điền từ thích hợp vào chỗ trống: Về phương diện xã hội, trình độ tổ chức đời sống, quan hệ xã hội của các ____ thiểu số không giống nhau.","dân tộc","giai cấp","nhà nước","tín ngưỡng",["3. Dân tộc và quan hệ dân tộc ở Việt Nam","Về phương diện xã hội, trình độ tổ chức đời sống, quan hệ xã hội của các dân tộc thiểu số không giống nhau.",135]],[6,2,"Điền từ thích hợp vào chỗ trống: Hai xu hướng khách quan của sự phát triển ____ có sự thống nhất biện chứng với nhau trong tiến trình phát triển của mỗi quốc gia và của toàn nhân loại.","dân tộc","gia đình","giai cấp","tín ngưỡng",["2. CN Mác - Lênin về vấn đề dân tộc","Hai xu hướng khách quan của sự phát triển dân tộc có sự thống nhất biện chứng với nhau trong tiến trình phát triển của mỗi quốc gia và của toàn nhân loại.",132]],[6,3,"Điền từ thích hợp vào chỗ trống: Trong những điều kiện cụ thể của xã hội, những người cộng sản và những người có ____ tôn giáo có thể cùng nhau xây dựng một xã hội tốt đẹp hơn ở thế giới hiện thực.","tín ngưỡng","liên hiệp","bộ lạc","bộ tộc",["4. Quan điểm CN Mác - Lênin về tôn giáo","Trong những điều kiện cụ thể của xã hội, những người cộng sản và những người có tín ngưỡng tôn giáo có thể cùng nhau xây dựng một xã hội tốt đẹp hơn ở thế giới hiện thực.",141]],[6,2,"Điền từ thích hợp vào chỗ trống: Các ____ ở nước ta còn có sự chênh lệch khá lớn về trình độ phát triển kinh tế, văn hóa, xã hội.","dân tộc","nhà nước","tôn giáo","tín ngưỡng",["3. Dân tộc và quan hệ dân tộc ở Việt Nam","Các dân tộc ở nước ta còn có sự chênh lệch khá lớn về trình độ phát triển kinh tế, văn hóa, xã hội.",135]],[6,2,"Điền từ thích hợp vào chỗ trống: Về phương diện thế giới quan, các ____ mang thế giới quan duy tâm, có sự khác biệt với thế giới quan duy vật biện chứng, khoa học của chủ nghĩa Mác - Lênin.","tôn giáo","giai cấp","tín ngưỡng","nhà nước",["4. Quan điểm CN Mác - Lênin về tôn giáo","Về phương diện thế giới quan, các tôn giáo mang thế giới quan duy tâm, có sự khác biệt với thế giới quan duy vật biện chứng, khoa học của chủ nghĩa Mác - Lênin.",141]],[6,2,"Điền từ thích hợp vào chỗ trống: Nếu thiếu tính cộng đồng chặt chẽ, bền vững về kinh tế thì cộng đồng người chưa thể trở thành ____.","dân tộc","nhà nước","giai cấp","gia đình",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Nếu thiếu tính cộng đồng chặt chẽ, bền vững về kinh tế thì cộng đồng người chưa thể trở thành dân tộc.",129]],[6,2,"Điền từ thích hợp vào chỗ trống: Độc lập ____ chính là mục tiêu chính trị chủ yếu của mọi quốc gia trong thời đại ngày nay.","dân tộc","tôn giáo","giai cấp","tín ngưỡng",["2. CN Mác - Lênin về vấn đề dân tộc","Độc lập dân tộc chính là mục tiêu chính trị chủ yếu của mọi quốc gia trong thời đại ngày nay.",132]],[6,3,"Điền từ thích hợp vào chỗ trống: Các tôn giáo và hoạt động tôn giáo bình thường, các cơ sở thờ tự, các phương tiện phục vụ nhằm thoả mãn nhu cầu tín ngưỡng của người dân được nhà nước ____ tôn trọng và bảo hộ.","xã hội chủ nghĩa","phong kiến","chiếm hữu nô lệ","tư bản chủ nghĩa",["4. Quan điểm CN Mác - Lênin về tôn giáo","Các tôn giáo và hoạt động tôn giáo bình thường, các cơ sở thờ tự, các phương tiện phục vụ nhằm thoả mãn nhu cầu tín ngưỡng của người dân được nhà nước xã hội chủ nghĩa tôn trọng và bảo hộ.",144]],[6,3,"Điền từ thích hợp vào chỗ trống: Lịch sử phát triển của các ____ gắn liền với truyền thống văn hóa của họ.","tộc người","liên hiệp","tôn giáo","giáo hội",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Lịch sử phát triển của các tộc người gắn liền với truyền thống văn hóa của họ.",130]],[6,2,"Điền từ thích hợp vào chỗ trống: Sự biến đổi của phương thức sản xuất chính là nguyên nhân quyết định sự biến đổi của cộng đồng ____.","dân tộc","tín ngưỡng","nhà nước","tôn giáo",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Sự biến đổi của phương thức sản xuất chính là nguyên nhân quyết định sự biến đổi của cộng đồng dân tộc.",127]],[6,2,"Điền từ thích hợp vào chỗ trống: ____ là dấu hiệu xác định không gian sinh tồn, vị trí địa lý của một dân tộc, biểu thị vùng đất, vùng trời, vùng biển mà mỗi dân tộc được quyền sở hữu.","Lãnh thổ","thị tộc","tộc người","quốc gia",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Lãnh thổ là dấu hiệu xác định không gian sinh tồn, vị trí địa lý của một dân tộc, biểu thị vùng đất, vùng trời, vùng biển mà mỗi dân tộc được quyền sở hữu.",128]],[6,3,"Điền từ thích hợp vào chỗ trống: Chủ nghĩa Mác - Lênin cũng cho rằng, sản xuất vật chất và các quan hệ kinh tế, xét đến cùng là nhân tố quyết định sự tồn tại và phát triển của các hình thái ý thức xã hội, trong đó có ____.","tôn giáo","giai cấp","tín ngưỡng","dân tộc",["4. Quan điểm CN Mác - Lênin về tôn giáo","Chủ nghĩa Mác - Lênin cũng cho rằng, sản xuất vật chất và các quan hệ kinh tế, xét đến cùng là nhân tố quyết định sự tồn tại và phát triển của các hình thái ý thức xã hội, trong đó có tôn giáo.",141]],[6,1,"Điền từ thích hợp vào chỗ trống: Lãnh thổ là yếu tố thể hiện chủ quyền của một dân tộc trong tương quan với các ____ - dân tộc khác.","quốc gia","đồng bào","bộ tộc","tín ngưỡng",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Lãnh thổ là yếu tố thể hiện chủ quyền của một dân tộc trong tương quan với các quốc gia - dân tộc khác.",128]],[6,2,"Điền từ thích hợp vào chỗ trống: Thực chất, hai cách hiểu trên về khái niệm ____ tuy không đồng nhất nhưng lại gắn bó mật thiết với nhau, không tách rời nhau.","dân tộc","gia đình","giai cấp","tôn giáo",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Thực chất, hai cách hiểu trên về khái niệm dân tộc tuy không đồng nhất nhưng lại gắn bó mật thiết với nhau, không tách rời nhau.",131]],[6,2,"Điền từ thích hợp vào chỗ trống: Quan hệ dân tộc và ____ được biểu hiện dưới nhiều cấp độ, hình thức và phạm vi khác nhau.","tôn giáo","miền núi","chia rẽ","tộc người",["6. Đặc điểm quan hệ dân tộc và tôn giáo ở Việt Nam","Quan hệ dân tộc và tôn giáo được biểu hiện dưới nhiều cấp độ, hình thức và phạm vi khác nhau.",150]],[6,2,"Điền từ thích hợp vào chỗ trống: Trên không gian đó, các cộng đồng ____ có mối quan hệ gắn bó với nhau, cư trú đan xen với nhau.","tộc người","bình đẳng","lãnh thổ","miền núi",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Trên không gian đó, các cộng đồng tộc người có mối quan hệ gắn bó với nhau, cư trú đan xen với nhau.",128]],[6,2,"Điền từ thích hợp vào chỗ trống: Quyền tự quyết ____ không đồng nhất với “quyền” của các tộc người thiểu số trong một quốc gia đa tộc người, nhất là việc phân lập thành quốc gia độc lập.","dân tộc","tôn giáo","giai cấp","nhà nước",["2. CN Mác - Lênin về vấn đề dân tộc","Quyền tự quyết dân tộc không đồng nhất với “quyền” của các tộc người thiểu số trong một quốc gia đa tộc người, nhất là việc phân lập thành quốc gia độc lập.",134]],[6,2,"Điền từ thích hợp vào chỗ trống: ____ không phải là một hiện tượng xã hội bất biến, ngược lại nó luôn luôn vận động và biến đổi không ngừng tuỳ thuộc vào những điều kiện kinh tế - xã hội - lịch sử cụ thể.","Tôn giáo","ngôn ngữ","tín ngưỡng","bộ lạc",["4. Quan điểm CN Mác - Lênin về tôn giáo","Tôn giáo không phải là một hiện tượng xã hội bất biến, ngược lại nó luôn luôn vận động và biến đổi không ngừng tuỳ thuộc vào những điều kiện kinh tế - xã hội - lịch sử cụ thể.",146]],[6,2,"Điền từ thích hợp vào chỗ trống: Chủ quyền quốc gia - ____ về lãnh thổ là một khái niệm xác định thường được thể chế hóa thành luật pháp quốc gia và luật pháp quốc tế.","dân tộc","giai cấp","tôn giáo","gia đình",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Chủ quyền quốc gia - dân tộc về lãnh thổ là một khái niệm xác định thường được thể chế hóa thành luật pháp quốc gia và luật pháp quốc tế.",128]],[6,2,"Điền từ thích hợp vào chỗ trống: Đại hội XII khẳng định: “Đoàn kết các ____ có vị trí chiến lược trong sự nghiệp cách mạng của nước ta.","dân tộc","tín ngưỡng","gia đình","nhà nước",["3. Dân tộc và quan hệ dân tộc ở Việt Nam","Đại hội XII khẳng định: “Đoàn kết các dân tộc có vị trí chiến lược trong sự nghiệp cách mạng của nước ta.",137]],[6,2,"Điền từ thích hợp vào chỗ trống: Đồng thời, nghiêm cấm lợi dụng tín ngưỡng, tôn giáo để hoạt động ____, hoạt động trái pháp luật và chính sách của Nhà nước, kích động chia rẽ nhân dân, chia rẽ các dân tộc, gây rối, xâm phạm an ninh quốc gia.","mê tín dị đoan","thế giới quan","đại đoàn kết","thần linh",["5. Tôn giáo ở Việt Nam, chính sách của Đảng và Nhà nước","Đồng thời, nghiêm cấm lợi dụng tín ngưỡng, tôn giáo để hoạt động mê tín dị đoan, hoạt động trái pháp luật và chính sách của Nhà nước, kích động chia rẽ nhân dân, chia rẽ các dân tộc, gây rối, xâm phạm an ninh quốc gia.",149]],[6,2,"Điền từ thích hợp vào chỗ trống: Nhà nước là đặc trưng cho thể chế chính trị của dân tộc, là đại diện cho dân tộc trong quan hệ với các ____ dân tộc khác trên thế giới.","quốc gia","tộc người","đồng bào","chia rẽ",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Nhà nước là đặc trưng cho thể chế chính trị của dân tộc, là đại diện cho dân tộc trong quan hệ với các quốc gia dân tộc khác trên thế giới.",130]],[6,2,"Điền từ thích hợp vào chỗ trống: Cần củng cố và kiện toàn tổ chức bộ máy và đội ngũ cán bộ chuyên trách làm công tác ____ các cấp.","tôn giáo","giai cấp","dân tộc","gia đình",["5. Tôn giáo ở Việt Nam, chính sách của Đảng và Nhà nước","Cần củng cố và kiện toàn tổ chức bộ máy và đội ngũ cán bộ chuyên trách làm công tác tôn giáo các cấp.",149]],[6,2,"Điền từ thích hợp vào chỗ trống: ____ của chủ nghĩa Mác - Lênin là cơ sở lý luận quan trọng để các Đảng Cộng sản vận dụng thực hiện chính sách dân tộc trong quá trình đấu tranh giành độc lập dân tộc và xây dựng chủ nghĩa xã hội.","Cương lĩnh dân tộc","tự do tín ngưỡng","quyền tự quyết","ngôn ngữ",["2. CN Mác - Lênin về vấn đề dân tộc","Cương lĩnh dân tộc của chủ nghĩa Mác - Lênin là cơ sở lý luận quan trọng để các Đảng Cộng sản vận dụng thực hiện chính sách dân tộc trong quá trình đấu tranh giành độc lập dân tộc và xây dựng chủ nghĩa xã hội.",134]],[6,2,"Điền từ thích hợp vào chỗ trống: Mỗi ____ ở Việt Nam có quá trình lịch sử tồn tại và phát triển khác nhau nên sự gắn bó với dân tộc cũng khác nhau.","tôn giáo","thiểu số","bộ lạc","chia rẽ",["5. Tôn giáo ở Việt Nam, chính sách của Đảng và Nhà nước","Mỗi tôn giáo ở Việt Nam có quá trình lịch sử tồn tại và phát triển khác nhau nên sự gắn bó với dân tộc cũng khác nhau.",146]],[6,1,"Điền từ thích hợp vào chỗ trống: Vậy nên, khái niệm dân tộc, lãnh thổ, hay đường biên giới không chỉ bó hẹp trong biên giới hữu hình, mà đã được mở rộng thành đường biên giới “mềm”, ở đó dấu ấn văn hóa chính là yếu tố để phân định ranh giới giữa các ____ - dân tộc.","quốc gia","thị tộc","bộ tộc","thần linh",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Vậy nên, khái niệm dân tộc, lãnh thổ, hay đường biên giới không chỉ bó hẹp trong biên giới hữu hình, mà đã được mở rộng thành đường biên giới “mềm”, ở đó dấu ấn văn hóa chính là yếu tố để phân định ranh giới giữa các quốc gia - dân tộc.",128]],[6,2,"Điền từ thích hợp vào chỗ trống: Việc phân biệt ____ mặt này là cần thiết nhằm tránh khuynh hướng cực đoan trong quá trình quản lý, ứng xử những vấn đề liên quan đến tín ngưỡng, tôn giáo.","hai","ba","bốn","năm",["4. Quan điểm CN Mác - Lênin về tôn giáo","Việc phân biệt hai mặt này là cần thiết nhằm tránh khuynh hướng cực đoan trong quá trình quản lý, ứng xử những vấn đề liên quan đến tín ngưỡng, tôn giáo.",146]],[6,2,"Điền từ thích hợp vào chỗ trống: Xã hội ấy chính là xã hội mà quần chúng tín đồ cũng từng mơ ước và phản ánh nó qua một số ____.","tôn giáo","gia đình","giai cấp","dân tộc",["4. Quan điểm CN Mác - Lênin về tôn giáo","Xã hội ấy chính là xã hội mà quần chúng tín đồ cũng từng mơ ước và phản ánh nó qua một số tôn giáo.",141]],[7,2,"Điền từ thích hợp vào chỗ trống: Quan hệ ____ là quan hệ giữa những người cùng một dòng máu, nảy sinh từ quan hệ hôn nhân.","huyết thống","con cái","tảo hôn","giáo dục",["1. Khái niệm gia đình","Quan hệ huyết thống là quan hệ giữa những người cùng một dòng máu, nảy sinh từ quan hệ hôn nhân.",158]],[7,2,"Điền từ thích hợp vào chỗ trống: Trình độ phát triển kinh tế, văn hóa, xã hội ảnh hưởng đến chất lượng nguồn lực lao động mà ____ cung cấp.","gia đình","dân tộc","tín ngưỡng","tôn giáo",["3. Chức năng cơ bản của gia đình","Trình độ phát triển kinh tế, văn hóa, xã hội ảnh hưởng đến chất lượng nguồn lực lao động mà gia đình cung cấp.",161]],[7,2,"Điền từ thích hợp vào chỗ trống: Mỗi cá nhân không chỉ là thành viên của ____ mà còn là thành viên của xã hội.","gia đình","giai cấp","tôn giáo","dân tộc",["2. Vị trí của gia đình trong xã hội","Mỗi cá nhân không chỉ là thành viên của gia đình mà còn là thành viên của xã hội.",160]],[7,2,"Điền từ thích hợp vào chỗ trống: Hiện tượng trẻ em hư, bỏ học sớm, lang thang, nghiện hút ma túy, mại dâm... cũng cho thấy phần nào sự bất lực của xã hội và sự bế tắc của một số gia dinh trong việc chăm sóc, ____ trẻ em.","giáo dục","hạt nhân","pháp luật","tự nguyện",["9. Biến đổi trong thực hiện các chức năng","Hiện tượng trẻ em hư, bỏ học sớm, lang thang, nghiện hút ma túy, mại dâm... cũng cho thấy phần nào sự bất lực của xã hội và sự bế tắc của một số gia dinh trong việc chăm sóc, giáo dục trẻ em.",172]],[7,3,"Điền từ thích hợp vào chỗ trống: Chức năng này không chỉ đáp ứng nhu cầu tâm, sinh lý tự nhiên của con người, đáp ứng nhu cầu duy trì nòi giống của ____, dòng họ mà còn đáp ứng nhu cầu về sức lao động và duy trì sự trường tồn của xã hội.","gia đình","tín ngưỡng","dân tộc","tôn giáo",["3. Chức năng cơ bản của gia đình","Chức năng này không chỉ đáp ứng nhu cầu tâm, sinh lý tự nhiên của con người, đáp ứng nhu cầu duy trì nòi giống của gia đình, dòng họ mà còn đáp ứng nhu cầu về sức lao động và duy trì sự trường tồn của xã hội.",161]],[7,2,"Điền từ thích hợp vào chỗ trống: Mỗi thành viên trong gia đình đều có vị trí, vai trò nhất định, vừa là chủ thể vừa là khách thể trong việc ____, giáo dục của gia đình.","nuôi dưỡng","ly hôn","tiêu dùng","ông bà",["3. Chức năng cơ bản của gia đình","Mỗi thành viên trong gia đình đều có vị trí, vai trò nhất định, vừa là chủ thể vừa là khách thể trong việc nuôi dưỡng, giáo dục của gia đình.",162]],[7,1,"Điền từ thích hợp vào chỗ trống: Hôn nhân xuất phát từ tình yêu tất yếu dẫn đến hôn nhân ____.","tự nguyện","nền tảng","giáo dục","pháp luật",["7. Chế độ hôn nhân tiến bộ","Hôn nhân xuất phát từ tình yêu tất yếu dẫn đến hôn nhân tự nguyện.",167]],[7,3,"Điền từ thích hợp vào chỗ trống: Chỉ trong ____ mới thể hiện được quan hệ tình cảm thiêng liêng, sâu đậm giữa vợ và chồng, cha mẹ và con cái, anh chị em với nhau mà không cộng đồng nào có được và có thể thay thế.","gia đình","giai cấp","dân tộc","nhà nước",["2. Vị trí của gia đình trong xã hội","Chỉ trong gia đình mới thể hiện được quan hệ tình cảm thiêng liêng, sâu đậm giữa vợ và chồng, cha mẹ và con cái, anh chị em với nhau mà không cộng đồng nào có được và có thể thay thế.",160]],[7,3,"Điền từ thích hợp vào chỗ trống: Quan hệ ____ bình đẳng là cơ sở cho sự bình đẳng trong quan hệ giữa cha mẹ với con cái và quan hệ giữa anh chị em với nhau.","vợ chồng","tế bào","tự nguyện","ly hôn",["7. Chế độ hôn nhân tiến bộ","Quan hệ vợ chồng bình đẳng là cơ sở cho sự bình đẳng trong quan hệ giữa cha mẹ với con cái và quan hệ giữa anh chị em với nhau.",168]],[7,2,"Điền từ thích hợp vào chỗ trống: Ngược lại, ____ cũng là một trong những cộng đồng để xã hội tác động đến cá nhân.","gia đình","nhà nước","tôn giáo","dân tộc",["2. Vị trí của gia đình trong xã hội","Ngược lại, gia đình cũng là một trong những cộng đồng để xã hội tác động đến cá nhân.",160]],[7,2,"Điền từ thích hợp vào chỗ trống: Thực hiện chức năng này, ____ có ý nghĩa rất quan trọng đối với sự hình thành nhân cách, đạo đức, lối sống của mỗi người.","gia đình","dân tộc","tín ngưỡng","nhà nước",["3. Chức năng cơ bản của gia đình","Thực hiện chức năng này, gia đình có ý nghĩa rất quan trọng đối với sự hình thành nhân cách, đạo đức, lối sống của mỗi người.",161]],[7,2,"Điền từ thích hợp vào chỗ trống: Bởi vì, ngay khi sinh ra, trước tiên mỗi người đều chịu sự giáo dục trực tiếp của cha mẹ và người thân trong ____.","gia đình","tôn giáo","tín ngưỡng","dân tộc",["3. Chức năng cơ bản của gia đình","Bởi vì, ngay khi sinh ra, trước tiên mỗi người đều chịu sự giáo dục trực tiếp của cha mẹ và người thân trong gia đình.",162]],[7,2,"Điền từ thích hợp vào chỗ trống: Gia đình đơn (còn gọi là gia đình ____) đang trở nên rất phổ biến ở các đô thị và cả ở nông thôn - thay thế cho kiểu gia đình truyền thống từng giữ vai trò chủ đạo trước đây.","hạt nhân","giáo dục","ông bà","pháp luật",["8. Biến đổi về quy mô, kết cấu gia đình Việt Nam","Gia đình đơn (còn gọi là gia đình hạt nhân) đang trở nên rất phổ biến ở các đô thị và cả ở nông thôn - thay thế cho kiểu gia đình truyền thống từng giữ vai trò chủ đạo trước đây.",169]],[7,2,"Điền từ thích hợp vào chỗ trống: ____ không chỉ là nơi lưu giữ mà còn là nơi sáng tạo và thụ hưởng những giá trị văn hóa của xã hội.","Gia đình","tế bào","ly hôn","tiêu dùng",["3. Chức năng cơ bản của gia đình","Gia đình không chỉ là nơi lưu giữ mà còn là nơi sáng tạo và thụ hưởng những giá trị văn hóa của xã hội.",164]],[7,3,"Điền từ thích hợp vào chỗ trống: Tích cực khai thác và tạo điều kiện thuận lợi cho các hộ ____ vay vốn ngắn hạn và dài hạn nhằm xóa đói giảm nghèo, chuyển dịch cơ cấu sản xuất, mở rộng phát triển kinh tế, đẩy mạnh loại hình kinh tế trang trại, vươn lên làm giàu chính đáng.","gia đình","tín ngưỡng","giai cấp","nhà nước",["11. Phương hướng xây dựng, phát triển gia đình Việt Nam","Tích cực khai thác và tạo điều kiện thuận lợi cho các hộ gia đình vay vốn ngắn hạn và dài hạn nhằm xóa đói giảm nghèo, chuyển dịch cơ cấu sản xuất, mở rộng phát triển kinh tế, đẩy mạnh loại hình kinh tế trang trại, vươn lên làm giàu chính đáng.",175]],[7,3,"Điền từ thích hợp vào chỗ trống: Xóa bỏ chế độ tư hữu về tư liệu sản xuất là xóa bỏ nguồn gốc gây nên tình trạng thống trị của người đàn ông trong ____, sự bất bình đẳng giữa nam và nữ, giữa vợ và chồng, sự nô dịch đối với phụ nữ.","gia đình","dân tộc","nhà nước","giai cấp",["4. Cơ sở kinh tế - xã hội","Xóa bỏ chế độ tư hữu về tư liệu sản xuất là xóa bỏ nguồn gốc gây nên tình trạng thống trị của người đàn ông trong gia đình, sự bất bình đẳng giữa nam và nữ, giữa vợ và chồng, sự nô dịch đối với phụ nữ.",165]],[7,2,"Điền từ thích hợp vào chỗ trống: Sự quan tâm, chăm sóc lẫn nhau giữa các thành viên trong ____ vừa là nhu cầu tình cảm, vừa là trách nhiệm, đạo lý, lương tâm của mỗi người.","gia đình","dân tộc","tôn giáo","giai cấp",["3. Chức năng cơ bản của gia đình","Sự quan tâm, chăm sóc lẫn nhau giữa các thành viên trong gia đình vừa là nhu cầu tình cảm, vừa là trách nhiệm, đạo lý, lương tâm của mỗi người.",164]],[7,1,"Điền từ thích hợp vào chỗ trống: Trong thời kỳ quá độ lên chủ nghĩa xã hội, thực hiện chế độ hôn nhân ____ là thực hiện sự giải phóng đối với phụ nữ, thực hiện sự bình đẳng, tôn trọng lẫn nhau giữa vợ và chồng.","một vợ một chồng","huyết thống","pháp luật","tái sản xuất",["7. Chế độ hôn nhân tiến bộ","Trong thời kỳ quá độ lên chủ nghĩa xã hội, thực hiện chế độ hôn nhân một vợ một chồng là thực hiện sự giải phóng đối với phụ nữ, thực hiện sự bình đẳng, tôn trọng lẫn nhau giữa vợ và chồng.",168]],[7,2,"Điền từ thích hợp vào chỗ trống: Vì thế, cần phải có chế độ ____ về phía người vợ, chứ không phải về phía người chồng 1”.","một vợ một chồng","tái sản xuất","tiêu dùng","ly hôn",["7. Chế độ hôn nhân tiến bộ","Vì thế, cần phải có chế độ một vợ một chồng về phía người vợ, chứ không phải về phía người chồng 1”.",168]],[7,2,"Điền từ thích hợp vào chỗ trống: Không có ____ để tái tạo ra con người thì xã hội không thể tồn tại và phát triển được.","gia đình","dân tộc","nhà nước","giai cấp",["2. Vị trí của gia đình trong xã hội","Không có gia đình để tái tạo ra con người thì xã hội không thể tồn tại và phát triển được.",159]],[7,2,"Điền từ thích hợp vào chỗ trống: Những tác động trên đây làm giảm sút đáng kể vai trò của ____ trong thực hiện chức năng xã hội hóa giáo dục trẻ em ở nước ta thời gian qua.","gia đình","tín ngưỡng","dân tộc","nhà nước",["9. Biến đổi trong thực hiện các chức năng","Những tác động trên đây làm giảm sút đáng kể vai trò của gia đình trong thực hiện chức năng xã hội hóa giáo dục trẻ em ở nước ta thời gian qua.",172]],[7,3,"Điền từ thích hợp vào chỗ trống: Bởi vì sự thống trị của người đàn ông trong ____ là kết quả sự thống trị của họ về kinh tế, sự thống trị đó tự nó sẽ tiêu tan khi sự thống trị về kinh tế của đàn ông không còn.","gia đình","tín ngưỡng","nhà nước","giai cấp",["4. Cơ sở kinh tế - xã hội","Bởi vì sự thống trị của người đàn ông trong gia đình là kết quả sự thống trị của họ về kinh tế, sự thống trị đó tự nó sẽ tiêu tan khi sự thống trị về kinh tế của đàn ông không còn.",165]],[7,2,"Điền từ thích hợp vào chỗ trống: Sự yên ổn, hạnh phúc của mỗi ____ là tiền đề, điều kiện quan trọng cho sự hình thành, phát triển nhân cách, thể lực, trí lực để trở thành công dân tốt cho xã hội.","gia đình","tín ngưỡng","giai cấp","nhà nước",["2. Vị trí của gia đình trong xã hội","Sự yên ổn, hạnh phúc của mỗi gia đình là tiền đề, điều kiện quan trọng cho sự hình thành, phát triển nhân cách, thể lực, trí lực để trở thành công dân tốt cho xã hội.",159]],[7,2,"Điền từ thích hợp vào chỗ trống: Gia đình là môi trường tốt nhất để mỗi cá nhân được yêu thương, ____, chăm sóc, trưởng thành, phát triển.","nuôi dưỡng","tế bào","tự nguyện","pháp luật",["2. Vị trí của gia đình trong xã hội","Gia đình là môi trường tốt nhất để mỗi cá nhân được yêu thương, nuôi dưỡng, chăm sóc, trưởng thành, phát triển.",159]],[7,2,"Điền từ thích hợp vào chỗ trống: Điểm tương đồng giữa giáo dục ____ truyền thống và giáo dục của xã hội mới là tiếp tục nhấn mạnh sự hy sinh của cá nhân cho cộng đồng.","gia đình","tín ngưỡng","dân tộc","giai cấp",["9. Biến đổi trong thực hiện các chức năng","Điểm tương đồng giữa giáo dục gia đình truyền thống và giáo dục của xã hội mới là tiếp tục nhấn mạnh sự hy sinh của cá nhân cho cộng đồng.",172]],[7,1,"Điền từ thích hợp vào chỗ trống: ____ đã viết: “Bước thứ hai và là bước chủ yếu là thủ tiêu chế độ tư hữu về ruộng đất, công xưởng và nhà máy.","V.I. Lênin","C.Mác","Ph.Ăngghen","Hồ Chí Minh",["4. Cơ sở kinh tế - xã hội","V.I. Lênin đã viết: “Bước thứ hai và là bước chủ yếu là thủ tiêu chế độ tư hữu về ruộng đất, công xưởng và nhà máy.",164]],[7,3,"Điền từ thích hợp vào chỗ trống: Xã hội ngày càng phát triển, mỗi người đều bị cuốn theo công việc của riêng mình với mục đích kiếm thêm thu nhập, thời gian dành cho ____ cũng vì vậy mà ngày càng ít đi.","gia đình","nhà nước","tín ngưỡng","tôn giáo",["8. Biến đổi về quy mô, kết cấu gia đình Việt Nam","Xã hội ngày càng phát triển, mỗi người đều bị cuốn theo công việc của riêng mình với mục đích kiếm thêm thu nhập, thời gian dành cho gia đình cũng vì vậy mà ngày càng ít đi.",170]],[7,2,"Điền từ thích hợp vào chỗ trống: Sự phát triển của kinh tế hàng hóa và nguồn thu nhập bằng tiền của gia đình tăng lên làm cho gia đình trở thành một đơn vị ____ quan trọng của xã hội.","tiêu dùng","giáo dục","huyết thống","nuôi dưỡng",["9. Biến đổi trong thực hiện các chức năng","Sự phát triển của kinh tế hàng hóa và nguồn thu nhập bằng tiền của gia đình tăng lên làm cho gia đình trở thành một đơn vị tiêu dùng quan trọng của xã hội.",171]],[7,1,"Điền từ thích hợp vào chỗ trống: Với chức năng chính trị, ____ là một tổ chức chính trị của xã hội, là nơi tổ chức thực hiện chính sách, pháp luật của nhà nước và quy chế (hương ước) của làng, xã và hưởng lợi từ hệ thống pháp luật, chính sách và quy chế đó.","gia đình","tự nguyện","nền tảng","hôn nhân",["3. Chức năng cơ bản của gia đình","Với chức năng chính trị, gia đình là một tổ chức chính trị của xã hội, là nơi tổ chức thực hiện chính sách, pháp luật của nhà nước và quy chế (hương ước) của làng, xã và hưởng lợi từ hệ thống pháp luật, chính sách và quy chế đó.",164]],[7,1,"Điền từ thích hợp vào chỗ trống: Chủ tịch ____ khẳng định: “Nếu không giải phóng phụ nữ là xây dựng chủ nghĩa xã hội chỉ một nửa 1”.","Hồ Chí Minh","C.Mác","Ph.Ăngghen","V.I.Lênin",["2. Vị trí của gia đình trong xã hội","Chủ tịch Hồ Chí Minh khẳng định: “Nếu không giải phóng phụ nữ là xây dựng chủ nghĩa xã hội chỉ một nửa 1”.",161]],[7,2,"Điền từ thích hợp vào chỗ trống: Tất nhiên, hôn nhân ____ không bác bỏ việc cha mẹ quan tâm, hướng dẫn giúp đỡ con cái có nhận thức đúng, có trách nhiệm trong việc kết hôn.","tự nguyện","pháp luật","hạt nhân","huyết thống",["7. Chế độ hôn nhân tiến bộ","Tất nhiên, hôn nhân tự nguyện không bác bỏ việc cha mẹ quan tâm, hướng dẫn giúp đỡ con cái có nhận thức đúng, có trách nhiệm trong việc kết hôn.",167]],[7,3,"Điền từ thích hợp vào chỗ trống: ____ cũng chính là môi trường đầu tiên mà mỗi cá nhân học được và thực hiện quan hệ xã hội.","Gia đình","huyết thống","con cái","nền tảng",["2. Vị trí của gia đình trong xã hội","Gia đình cũng chính là môi trường đầu tiên mà mỗi cá nhân học được và thực hiện quan hệ xã hội.",160]],[7,2,"Điền từ thích hợp vào chỗ trống: Bước vào thời kỳ mới, ____ ấy bộc lộ cả những mặt tích cực và tiêu cực.","gia đình","giai cấp","dân tộc","tôn giáo",["11. Phương hướng xây dựng, phát triển gia đình Việt Nam","Bước vào thời kỳ mới, gia đình ấy bộc lộ cả những mặt tích cực và tiêu cực.",175]],[7,2,"Điền từ thích hợp vào chỗ trống: Biến đổi trong các mối quan hệ gia đình Trong thực tế, ____ và gia đình Việt Nam đang phải đối mặt với những thách thức, biến đổi lớn.","hôn nhân","tình yêu","pháp luật","huyết thống",["10. Biến đổi trong các mối quan hệ gia đình","Biến đổi trong các mối quan hệ gia đình Trong thực tế, hôn nhân và gia đình Việt Nam đang phải đối mặt với những thách thức, biến đổi lớn.",173]],[7,2,"Điền từ thích hợp vào chỗ trống: Chỉ trong môi trường yên ấm của ____, cá nhân mới cảm thấy bình yên, hạnh phúc, có động lực để phấn đấu trở thành con người xã hội tốt.","gia đình","nhà nước","tôn giáo","giai cấp",["2. Vị trí của gia đình trong xã hội","Chỉ trong môi trường yên ấm của gia đình, cá nhân mới cảm thấy bình yên, hạnh phúc, có động lực để phấn đấu trở thành con người xã hội tốt.",160]],[7,2,"Điền từ thích hợp vào chỗ trống: Với việc sản xuất ra tư liệu tiêu dùng, tư liệu sản xuất, tái sản xuất ra con người, ____ như một tế bào tự nhiên, là một đơn vị cơ sở để tạo nên cơ thể - xã hội.","gia đình","dân tộc","giai cấp","tín ngưỡng",["2. Vị trí của gia đình trong xã hội","Với việc sản xuất ra tư liệu tiêu dùng, tư liệu sản xuất, tái sản xuất ra con người, gia đình như một tế bào tự nhiên, là một đơn vị cơ sở để tạo nên cơ thể - xã hội.",159]],[7,3,"Điền từ thích hợp vào chỗ trống: Với chức năng này, ____ góp phần to lớn vào việc đào tạo thế hệ trẻ, thế hệ tương lai của xã hội, cung cấp và nâng cao chất lượng nguồn lao động để duy trì sự trường tồn của xã hội, đồng thời mỗi cá nhân từng bước được xã hội hóa.","gia đình","dân tộc","giai cấp","tôn giáo",["3. Chức năng cơ bản của gia đình","Với chức năng này, gia đình góp phần to lớn vào việc đào tạo thế hệ trẻ, thế hệ tương lai của xã hội, cung cấp và nâng cao chất lượng nguồn lao động để duy trì sự trường tồn của xã hội, đồng thời mỗi cá nhân từng bước được xã hội hóa.",162]],[7,2,"Điền từ thích hợp vào chỗ trống: Giáo dục gia đình hiện nay phát triển theo xu hướng sự đầu tư tài chính của gia đình cho giáo dục ____ tăng lên.","con cái","cha mẹ","pháp luật","tình yêu",["9. Biến đổi trong thực hiện các chức năng","Giáo dục gia đình hiện nay phát triển theo xu hướng sự đầu tư tài chính của gia đình cho giáo dục con cái tăng lên.",172]],[7,2,"Điền từ thích hợp vào chỗ trống: Chỉ khi con người được yên ấm, hòa thuận trong ____ thì mới có thể yên tâm lao động, sáng tạo và đóng góp sức mình cho xã hội và ngược lại.","gia đình","nhà nước","tôn giáo","tín ngưỡng",["2. Vị trí của gia đình trong xã hội","Chỉ khi con người được yên ấm, hòa thuận trong gia đình thì mới có thể yên tâm lao động, sáng tạo và đóng góp sức mình cho xã hội và ngược lại.",159]],[7,2,"Điền từ thích hợp vào chỗ trống: Thực hiện tốt chức năng ____, giáo dục đòi hỏi mỗi người làm cha, làm mẹ phải có kiến thức cơ bản, tương đối toàn diện về mọi mặt, văn hóa, học vấn, đặc biệt là phương pháp giáo dục.","nuôi dưỡng","nền tảng","tiêu dùng","cha mẹ",["3. Chức năng cơ bản của gia đình","Thực hiện tốt chức năng nuôi dưỡng, giáo dục đòi hỏi mỗi người làm cha, làm mẹ phải có kiến thức cơ bản, tương đối toàn diện về mọi mặt, văn hóa, học vấn, đặc biệt là phương pháp giáo dục.",162]],[7,2,"Điền từ thích hợp vào chỗ trống: Chức năng ____, giáo dục có ảnh hưởng lâu dài và toàn diện đến cuộc đời của mỗi thành viên, từ lúc lọt lòng cho đến khi trưởng thành và tuổi già.","nuôi dưỡng","cha mẹ","tảo hôn","con cái",["3. Chức năng cơ bản của gia đình","Chức năng nuôi dưỡng, giáo dục có ảnh hưởng lâu dài và toàn diện đến cuộc đời của mỗi thành viên, từ lúc lọt lòng cho đến khi trưởng thành và tuổi già.",162]],[7,2,"Điền từ thích hợp vào chỗ trống: Với việc duy trì tình cảm giữa các thành viên, ____ có ý nghĩa quyết định đến sự ổn định và phát triển của xã hội.","gia đình","nhà nước","giai cấp","tín ngưỡng",["3. Chức năng cơ bản của gia đình","Với việc duy trì tình cảm giữa các thành viên, gia đình có ý nghĩa quyết định đến sự ổn định và phát triển của xã hội.",164]],[7,2,"Điền từ thích hợp vào chỗ trống: Do vậy, cần tránh khuynh hướng coi trọng giáo dục ____ mà hạ thấp giáo dục của xã hội hoặc ngược lại.","gia đình","giai cấp","dân tộc","nhà nước",["3. Chức năng cơ bản của gia đình","Do vậy, cần tránh khuynh hướng coi trọng giáo dục gia đình mà hạ thấp giáo dục của xã hội hoặc ngược lại.",162]],[7,2,"Điền từ thích hợp vào chỗ trống: Chính vì vậy, ở bất cứ xã hội nào, giai cấp cầm quyền muốn quản lý xã hội theo yêu cầu của mình cũng đều coi trọng việc xây dựng và củng cố ____.","gia đình","vợ chồng","tảo hôn","nền tảng",["2. Vị trí của gia đình trong xã hội","Chính vì vậy, ở bất cứ xã hội nào, giai cấp cầm quyền muốn quản lý xã hội theo yêu cầu của mình cũng đều coi trọng việc xây dựng và củng cố gia đình.",160]],[7,2,"Điền từ thích hợp vào chỗ trống: Những hiểu biết đầu tiên mà ____ đem lại thường để lại dấu ấn sâu đậm và bền vững trong cuộc đời mỗi người.","gia đình","giai cấp","dân tộc","tín ngưỡng",["3. Chức năng cơ bản của gia đình","Những hiểu biết đầu tiên mà gia đình đem lại thường để lại dấu ấn sâu đậm và bền vững trong cuộc đời mỗi người.",162]],[7,2,"Điền từ thích hợp vào chỗ trống: Tất cả nhằm hướng tới thực hiện mục tiêu làm cho ____ thực sự là tế bào lành mạnh của xã hội, là tổ ấm của mỗi người.","gia đình","tín ngưỡng","nhà nước","giai cấp",["11. Phương hướng xây dựng, phát triển gia đình Việt Nam","Tất cả nhằm hướng tới thực hiện mục tiêu làm cho gia đình thực sự là tế bào lành mạnh của xã hội, là tổ ấm của mỗi người.",176]],[7,3,"Điền từ thích hợp vào chỗ trống: Cốt lõi của quan hệ sản xuất mới ấy là chế độ sở hữu ____ đối với tư liệu sản xuất từng bước hình thành và củng cố thay thế chế độ sở hữu tư nhân về tư liệu sản xuất.","xã hội chủ nghĩa","tư bản chủ nghĩa","phong kiến","chiếm hữu nô lệ",["4. Cơ sở kinh tế - xã hội","Cốt lõi của quan hệ sản xuất mới ấy là chế độ sở hữu xã hội chủ nghĩa đối với tư liệu sản xuất từng bước hình thành và củng cố thay thế chế độ sở hữu tư nhân về tư liệu sản xuất.",164]],[7,3,"Điền từ thích hợp vào chỗ trống: Trong quá trình xây dựng chủ nghĩa xã hội, để xây dựng một xã hội thật sự bình đẳng, con người được giải phóng, ____ chủ trương bảo vệ chế độ hôn nhân một vợ, một chồng, thực hiện sự bình đẳng trong gia đình, giải phóng phụ nữ.","giai cấp công nhân","đội ngũ trí thức","giai cấp tư sản","giai cấp nông dân",["2. Vị trí của gia đình trong xã hội","Trong quá trình xây dựng chủ nghĩa xã hội, để xây dựng một xã hội thật sự bình đẳng, con người được giải phóng, giai cấp công nhân chủ trương bảo vệ chế độ hôn nhân một vợ, một chồng, thực hiện sự bình đẳng trong gia đình, giải phóng phụ nữ.",161]],[7,2,"Điền từ thích hợp vào chỗ trống: ____ là cộng đồng xã hội đầu tiên đáp ứng nhu cầu quan hệ xã hội của mỗi cá nhân.","Gia đình","nuôi dưỡng","vợ chồng","tiêu dùng",["2. Vị trí của gia đình trong xã hội","Gia đình là cộng đồng xã hội đầu tiên đáp ứng nhu cầu quan hệ xã hội của mỗi cá nhân.",160]],[7,2,"Điền từ thích hợp vào chỗ trống: Ăngghen đã nhấn mạnh: “Tư liệu sản xuất chuyển thành tài sản chung, thì ____ cá thể sẽ không còn là đơn vị kinh tế của xã hội nữa.","gia đình","nhà nước","dân tộc","giai cấp",["4. Cơ sở kinh tế - xã hội","Ăngghen đã nhấn mạnh: “Tư liệu sản xuất chuyển thành tài sản chung, thì gia đình cá thể sẽ không còn là đơn vị kinh tế của xã hội nữa.",165]],[7,2,"Điền từ thích hợp vào chỗ trống: Cần tránh xu hướng chạy theo thành tích, phản ánh không thực chất phong trào và chất lượng ____ văn hóa.","gia đình","nhà nước","tôn giáo","dân tộc",["11. Phương hướng xây dựng, phát triển gia đình Việt Nam","Cần tránh xu hướng chạy theo thành tích, phản ánh không thực chất phong trào và chất lượng gia đình văn hóa.",176]],[7,2,"Điền từ thích hợp vào chỗ trống: Thực hiện thủ tục pháp lý trong ____ không ngăn cản quyền tự do kết hôn và tự do ly hôn chính đáng, mà ngược lại, là cơ sở để thực hiện những quyền đó một cách đầy đủ nhất.","hôn nhân","nuôi dưỡng","nền tảng","gia đình",["7. Chế độ hôn nhân tiến bộ","Thực hiện thủ tục pháp lý trong hôn nhân không ngăn cản quyền tự do kết hôn và tự do ly hôn chính đáng, mà ngược lại, là cơ sở để thực hiện những quyền đó một cách đầy đủ nhất.",169]],[7,2,"Điền từ thích hợp vào chỗ trống: Hiện nay, kinh tế ____ đang trở thành một bộ phận quan trọng trong nền kinh tế quốc dân.","gia đình","tín ngưỡng","nhà nước","tôn giáo",["9. Biến đổi trong thực hiện các chức năng","Hiện nay, kinh tế gia đình đang trở thành một bộ phận quan trọng trong nền kinh tế quốc dân.",171]],[7,1,"Điền từ thích hợp vào chỗ trống: Hôn nhân ____ đã xuất hiện từ sớm trong lịch sử xã hội loài người, khi có sự thắng lợi của chế độ tư hữu đối với chế độ công hữu nguyên thủy.","một vợ một chồng","bình đẳng giới","bạo lực gia đình","huyết thống",["7. Chế độ hôn nhân tiến bộ","Hôn nhân một vợ một chồng đã xuất hiện từ sớm trong lịch sử xã hội loài người, khi có sự thắng lợi của chế độ tư hữu đối với chế độ công hữu nguyên thủy.",167]],[7,3,"Điền từ thích hợp vào chỗ trống: Quan hệ ____ là cơ sở, nền tảng hình thành nên các mối quan hệ khác trong gia đình, là cơ sở pháp lý cho sự tồn tại của mỗi gia đình.","hôn nhân","tế bào","tình yêu","cha mẹ",["1. Khái niệm gia đình","Quan hệ hôn nhân là cơ sở, nền tảng hình thành nên các mối quan hệ khác trong gia đình, là cơ sở pháp lý cho sự tồn tại của mỗi gia đình.",158]],[7,1,"Điền từ thích hợp vào chỗ trống: Gia đình không chỉ tham gia trực tiếp vào sản xuất và ____ ra của cải vật chất và sức lao động, mà còn là một đơn vị tiêu dùng trong xã hội.","tái sản xuất","nuôi dưỡng","hôn nhân","bạo lực gia đình",["3. Chức năng cơ bản của gia đình","Gia đình không chỉ tham gia trực tiếp vào sản xuất và tái sản xuất ra của cải vật chất và sức lao động, mà còn là một đơn vị tiêu dùng trong xã hội.",163]],[7,2,"Điền từ thích hợp vào chỗ trống: Xóa bỏ chế độ tư hữu về tư liệu sản xuất cũng là cơ sở làm cho ____ được thực hiện dựa trên cơ sở tình yêu chứ không phải vì lý do kinh tế, địa vị xã hội hay một sự tính toán nào khác.","hôn nhân","tế bào","tiêu dùng","cha mẹ",["4. Cơ sở kinh tế - xã hội","Xóa bỏ chế độ tư hữu về tư liệu sản xuất cũng là cơ sở làm cho hôn nhân được thực hiện dựa trên cơ sở tình yêu chứ không phải vì lý do kinh tế, địa vị xã hội hay một sự tính toán nào khác.",165]],[7,3,"Điền từ thích hợp vào chỗ trống: Ăngghen nhấn mạnh: “... nếu nghĩa vụ của ____ là phải thương yêu nhau thì nghĩa vụ của những kẻ yêu nhau há chẳng phải là kết hôn với nhau và không được kết hôn với người khác hay sao1?”.","vợ chồng","gia đình","tiêu dùng","huyết thống",["7. Chế độ hôn nhân tiến bộ","Ăngghen nhấn mạnh: “... nếu nghĩa vụ của vợ chồng là phải thương yêu nhau thì nghĩa vụ của những kẻ yêu nhau há chẳng phải là kết hôn với nhau và không được kết hôn với người khác hay sao1?”.",167]],[7,2,"Điền từ thích hợp vào chỗ trống: Quan hệ giữa các thành viên trong ____ đồng thời cũng là quan hệ giữa các thành viên của xã hội.","gia đình","dân tộc","tôn giáo","giai cấp",["2. Vị trí của gia đình trong xã hội","Quan hệ giữa các thành viên trong gia đình đồng thời cũng là quan hệ giữa các thành viên của xã hội.",160]],[7,2,"Điền từ thích hợp vào chỗ trống: Cơ sở hình thành ____ là hai mối quan hệ cơ bản, quan hệ hôn nhân (vợ và chồng) và quan hệ huyết thống (cha mẹ và con cái...).","gia đình","nhà nước","giai cấp","dân tộc",["1. Khái niệm gia đình","Cơ sở hình thành gia đình là hai mối quan hệ cơ bản, quan hệ hôn nhân (vợ và chồng) và quan hệ huyết thống (cha mẹ và con cái...).",157]],[7,2,"Điền từ thích hợp vào chỗ trống: Nội dung giáo dục gia đình hiện nay không chỉ nặng về giáo dục đạo đức, ứng xử trong gia đình, dòng họ, làng, xã, mà hướng đến giáo dục kiến thức khoa học hiện đại, trang bị công cụ để ____ hòa nhập với thế giới.","con cái","vợ chồng","ly hôn","nuôi dưỡng",["9. Biến đổi trong thực hiện các chức năng","Nội dung giáo dục gia đình hiện nay không chỉ nặng về giáo dục đạo đức, ứng xử trong gia đình, dòng họ, làng, xã, mà hướng đến giáo dục kiến thức khoa học hiện đại, trang bị công cụ để con cái hòa nhập với thế giới.",172]],[7,3,"Điền từ thích hợp vào chỗ trống: Cấp ủy và chính quyền các cấp phải đưa nội dung, mục tiêu của công tác xây dựng và phát triển ____ vào chiến lược phát triển kinh tế - xã hội và chương trình kế hoạch công tác hằng năm của các bộ, ngành, địa phương.","gia đình","tôn giáo","nhà nước","dân tộc",["11. Phương hướng xây dựng, phát triển gia đình Việt Nam","Cấp ủy và chính quyền các cấp phải đưa nội dung, mục tiêu của công tác xây dựng và phát triển gia đình vào chiến lược phát triển kinh tế - xã hội và chương trình kế hoạch công tác hằng năm của các bộ, ngành, địa phương.",175]],[7,2,"Điền từ thích hợp vào chỗ trống: Phong trào xây dựng gia đình văn hóa đã thực sự tác động đến ____ gia đình với những quy tắc ứng xử tốt đẹp, phát huy giá trị đạo đức truyền thống của gia đình Việt Nam.","nền tảng","con cái","tế bào","hôn nhân",["11. Phương hướng xây dựng, phát triển gia đình Việt Nam","Phong trào xây dựng gia đình văn hóa đã thực sự tác động đến nền tảng gia đình với những quy tắc ứng xử tốt đẹp, phát huy giá trị đạo đức truyền thống của gia đình Việt Nam.",176]],[7,2,"Điền từ thích hợp vào chỗ trống: Do vậy, giải quyết mâu thuẫn trong ____ là vấn đề cần được mọi người quan tâm, chia sẻ.","gia đình","tôn giáo","tín ngưỡng","nhà nước",["7. Chế độ hôn nhân tiến bộ","Do vậy, giải quyết mâu thuẫn trong gia đình là vấn đề cần được mọi người quan tâm, chia sẻ.",168]],[7,2,"Điền từ thích hợp vào chỗ trống: Đồng thời, ____ đóng góp vào quá trình sản xuất và tái sản xuất ra của cải, sự giàu có của xã hội.","gia đình","giai cấp","tôn giáo","tín ngưỡng",["3. Chức năng cơ bản của gia đình","Đồng thời, gia đình đóng góp vào quá trình sản xuất và tái sản xuất ra của cải, sự giàu có của xã hội.",163]],[7,2,"Điền từ thích hợp vào chỗ trống: Khi quan hệ tình cảm ____ rạn nứt, quan hệ tình cảm trong xã hội cũng có nguy cơ bị phá vỡ.","gia đình","giai cấp","dân tộc","tôn giáo",["3. Chức năng cơ bản của gia đình","Khi quan hệ tình cảm gia đình rạn nứt, quan hệ tình cảm trong xã hội cũng có nguy cơ bị phá vỡ.",164]],[7,3,"Điền từ thích hợp vào chỗ trống: Thực hiện thủ tục pháp lý trong hôn nhân là thể hiện sự tôn trọng trong tình yêu, trách nhiệm giữa nam và nữ, trách nhiệm của cá nhân với ____ và xã hội và ngược lại.","gia đình","nhà nước","tôn giáo","dân tộc",["7. Chế độ hôn nhân tiến bộ","Thực hiện thủ tục pháp lý trong hôn nhân là thể hiện sự tôn trọng trong tình yêu, trách nhiệm giữa nam và nữ, trách nhiệm của cá nhân với gia đình và xã hội và ngược lại.",168]],[7,2,"Điền từ thích hợp vào chỗ trống: Để đảm bảo lợi ích của gia đình và sự phát triển bền vững của xã hội, thông điệp mới trong kế hoạch hóa gia đình là mỗi cặp ____ nên sinh đủ hai con.","vợ chồng","tế bào","huyết thống","tự nguyện",["9. Biến đổi trong thực hiện các chức năng","Để đảm bảo lợi ích của gia đình và sự phát triển bền vững của xã hội, thông điệp mới trong kế hoạch hóa gia đình là mỗi cặp vợ chồng nên sinh đủ hai con.",170]],[7,1,"Điền từ thích hợp vào chỗ trống: Chừng nào và ở đâu, hệ thống chính sách, ____ chưa hoàn thiện thì việc xây dựng gia đình và đảm bảo hạnh phúc gia đình còn hạn chế.","pháp luật","tự nguyện","nền tảng","tế bào",["5. Cơ sở chính trị - xã hội","Chừng nào và ở đâu, hệ thống chính sách, pháp luật chưa hoàn thiện thì việc xây dựng gia đình và đảm bảo hạnh phúc gia đình còn hạn chế.",166]],[7,2,"Điền từ thích hợp vào chỗ trống: Trong gia đình hiện đại, sự bền vững của ____ phụ thuộc rất nhiều vào các yếu tố tâm lý, tình cảm, kinh tế, chứ không phải chỉ là các yếu tố có con hay không có con, có con trai hay không có con trai như gia đình truyền thống.","hôn nhân","pháp luật","giáo dục","con cái",["9. Biến đổi trong thực hiện các chức năng","Trong gia đình hiện đại, sự bền vững của hôn nhân phụ thuộc rất nhiều vào các yếu tố tâm lý, tình cảm, kinh tế, chứ không phải chỉ là các yếu tố có con hay không có con, có con trai hay không có con trai như gia đình truyền thống.",171]],[7,2,"Điền từ thích hợp vào chỗ trống: Nghĩa vụ và quyền lợi của mỗi cá nhân được thực hiện với sự hợp tác của các thành viên trong ____.","gia đình","dân tộc","tín ngưỡng","giai cấp",["2. Vị trí của gia đình trong xã hội","Nghĩa vụ và quyền lợi của mỗi cá nhân được thực hiện với sự hợp tác của các thành viên trong gia đình.",160]],[7,2,"Điền từ thích hợp vào chỗ trống: Con người dường như rơi vào vòng xoáy của đồng tiền và vị thế xã hội mà vô tình đánh mất đi tình cảm ____.","gia đình","nhà nước","dân tộc","tôn giáo",["8. Biến đổi về quy mô, kết cấu gia đình Việt Nam","Con người dường như rơi vào vòng xoáy của đồng tiền và vị thế xã hội mà vô tình đánh mất đi tình cảm gia đình.",170]],[7,3,"Điền từ thích hợp vào chỗ trống: Những trật tự xã hội, trong đó những con người của một thời đại lịch sử nhất định và của một nước nhất định đang sống, là do hai loại sản xuất quyết định: một mặt là do trình độ phát triển của lao động và mặt khác là do trình độ phát triển của ____”.","gia đình","giai cấp","tôn giáo","tín ngưỡng",["2. Vị trí của gia đình trong xã hội","Những trật tự xã hội, trong đó những con người của một thời đại lịch sử nhất định và của một nước nhất định đang sống, là do hai loại sản xuất quyết định: một mặt là do trình độ phát triển của lao động và mặt khác là do trình độ phát triển của gia đình”.",159]],[7,2,"Điền từ thích hợp vào chỗ trống: Ngược lại, sự biến đổi của ____ cũng tạo ra động lực mới thúc đẩy sự phát triển của xã hội.","gia đình","dân tộc","tôn giáo","tín ngưỡng",["7. Chế độ hôn nhân tiến bộ","Ngược lại, sự biến đổi của gia đình cũng tạo ra động lực mới thúc đẩy sự phát triển của xã hội.",169]],[7,2,"Điền từ thích hợp vào chỗ trống: Không có cá nhân bên ngoài ____, cũng không thể có cá nhân bên ngoài xã hội.","gia đình","nhà nước","tín ngưỡng","tôn giáo",["2. Vị trí của gia đình trong xã hội","Không có cá nhân bên ngoài gia đình, cũng không thể có cá nhân bên ngoài xã hội.",160]],[7,3,"Điền từ thích hợp vào chỗ trống: Gia đình thực hiện chức năng tổ chức ____ hàng hóa để duy trì đời sống của gia đình về lao động sản xuất cũng như các sinh hoạt trong gia đình.","tiêu dùng","cha mẹ","ly hôn","tế bào",["3. Chức năng cơ bản của gia đình","Gia đình thực hiện chức năng tổ chức tiêu dùng hàng hóa để duy trì đời sống của gia đình về lao động sản xuất cũng như các sinh hoạt trong gia đình.",163]],[7,3,"Điền từ thích hợp vào chỗ trống: Việc thực hiện chức năng ____ ra con người diễn ra trong từng gia đình, nhưng không chỉ là việc riêng của gia đình mà là vấn đề xã hội.","tái sản xuất","ông bà","cha mẹ","hạt nhân",["3. Chức năng cơ bản của gia đình","Việc thực hiện chức năng tái sản xuất ra con người diễn ra trong từng gia đình, nhưng không chỉ là việc riêng của gia đình mà là vấn đề xã hội.",161]],[7,3,"Điền từ thích hợp vào chỗ trống: Thực hiện hôn nhân một vợ một chồng là điều kiện đảm bảo hạnh phúc ____, đồng thời cũng phù hợp với quy luật tự nhiên, phù hợp với tâm lý, tình cảm, đạo đức con người.","gia đình","tôn giáo","tín ngưỡng","dân tộc",["7. Chế độ hôn nhân tiến bộ","Thực hiện hôn nhân một vợ một chồng là điều kiện đảm bảo hạnh phúc gia đình, đồng thời cũng phù hợp với quy luật tự nhiên, phù hợp với tâm lý, tình cảm, đạo đức con người.",167]],[7,2,"Điền từ thích hợp vào chỗ trống: Thực hiện tốt chức năng này không những tạo cho ____ có cơ sở để tổ chức tốt đời sống, nuôi dạy con cái, mà còn đóng góp to lớn đối với sự phát triển của xã hội.","gia đình","dân tộc","giai cấp","tín ngưỡng",["3. Chức năng cơ bản của gia đình","Thực hiện tốt chức năng này không những tạo cho gia đình có cơ sở để tổ chức tốt đời sống, nuôi dạy con cái, mà còn đóng góp to lớn đối với sự phát triển của xã hội.",163]],[7,2,"Điền từ thích hợp vào chỗ trống: Những phong tục, tập quán, sinh hoạt văn hóa của cộng đồng được thực hiện trong ____.","gia đình","giai cấp","nhà nước","dân tộc",["3. Chức năng cơ bản của gia đình","Những phong tục, tập quán, sinh hoạt văn hóa của cộng đồng được thực hiện trong gia đình.",164]],[7,1,"Điền từ thích hợp vào chỗ trống: ____ tiến bộ còn bao hàm cả quyền tự do ly hôn khi tình yêu giữa nam và nữ không còn nữa.","Hôn nhân","con cái","nền tảng","huyết thống",["7. Chế độ hôn nhân tiến bộ","Hôn nhân tiến bộ còn bao hàm cả quyền tự do ly hôn khi tình yêu giữa nam và nữ không còn nữa.",167]],[7,1,"Điền từ thích hợp vào chỗ trống: Gia đình Việt Nam hiện đại chỉ có hai thế hệ cùng sống chung: cha mẹ - con cái, số con trong gia đình cũng không nhiều như trước, cá biệt còn có số ít gia đình đơn thân, nhưng phổ biến nhất vẫn là loại hình gia đình ____ quy mô nhỏ.","hạt nhân","tiêu dùng","pháp luật","vợ chồng",["8. Biến đổi về quy mô, kết cấu gia đình Việt Nam","Gia đình Việt Nam hiện đại chỉ có hai thế hệ cùng sống chung: cha mẹ - con cái, số con trong gia đình cũng không nhiều như trước, cá biệt còn có số ít gia đình đơn thân, nhưng phổ biến nhất vẫn là loại hình gia đình hạt nhân quy mô nhỏ.",169]],[7,2,"Điền từ thích hợp vào chỗ trống: Chức năng này thể hiện tình cảm thiêng liêng, trách nhiệm của cha mẹ với con cái, đồng thời thể hiện trách nhiệm của ____ với xã hội.","gia đình","giai cấp","dân tộc","tín ngưỡng",["3. Chức năng cơ bản của gia đình","Chức năng này thể hiện tình cảm thiêng liêng, trách nhiệm của cha mẹ với con cái, đồng thời thể hiện trách nhiệm của gia đình với xã hội.",161]],[7,1,"Điền từ thích hợp vào chỗ trống: Cùng với đó, vấn đề đặt ra là cần phải thay đổi tâm lý truyền thống về vai trò của con trai, tạo dựng quan niệm bình đẳng giữa con trai và con gái trong trách nhiệm ____, chăm sóc cha mẹ già và thờ phụng tổ tiên.","nuôi dưỡng","tế bào","ly hôn","con cái",["9. Biến đổi trong thực hiện các chức năng","Cùng với đó, vấn đề đặt ra là cần phải thay đổi tâm lý truyền thống về vai trò của con trai, tạo dựng quan niệm bình đẳng giữa con trai và con gái trong trách nhiệm nuôi dưỡng, chăm sóc cha mẹ già và thờ phụng tổ tiên.",173]]],v=document.getElementById('v');
const CN={2:'Chương 2 · Giai cấp công nhân',3:'Chương 3 · CNXH và quá độ',4:'Chương 4 · Dân chủ và nhà nước XHCN',5:'Chương 5 · Cơ cấu xã hội, liên minh',6:'Chương 6 · Dân tộc và tôn giáo',7:'Chương 7 · Gia đình'},LV=['','Dễ','Trung bình','Khó'];
let chs=new Set([2,3,4,5,6,7]),mode=0,lim=30,Q,i,ok,wr,st,bs,best=0,mute=false;
try{mute=localStorage.getItem('cx-mute')=='1';best=+localStorage.getItem('cx-best')||0}catch(e){}
const mt=()=>mute?'🔇 Tắt':'🔊 Bật';
function tm(){mute=!mute;try{localStorage.setItem('cx-mute',mute?'1':'0')}catch(e){}document.querySelectorAll('.mb').forEach(b=>b.textContent=mt());snd(1)}
let AC;const gc=()=>AC=AC||new(window.AudioContext||window.webkitAudioContext)();
document.addEventListener('pointerdown',()=>{try{gc().resume()}catch(e){}},true);
function snd(t){if(mute)return;try{const c=gc();const go=()=>{const n=c.currentTime+.03;(t?[[784,0],[1047,.12],[1319,.24]]:[[311,0],[220,.2]]).forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type=t?'sine':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,n+d);g.gain.exponentialRampToValueAtTime(.5,n+d+.02);g.gain.exponentialRampToValueAtTime(.0001,n+d+(t?.25:.35));o.connect(g);g.connect(c.destination);o.start(n+d);o.stop(n+d+.4)})};c.state==='running'?go():c.resume().then(go)}catch(e){}}
const sh=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const scr=h=>{v.innerHTML=`<div class="scr">${h}</div>`;scrollTo(0,0)};
const pool=()=>D.filter(q=>chs.has(q[0])&&(!mode||q[1]==mode));
function home(){scr(`<div class="card"><h2 style="margin-top:0">Chọn chương</h2><div class="chips" id="c1">${Object.keys(CN).map(c=>`<button class="chip" data-c="${c}" onclick="tg(${c})">${CN[c]}</button>`).join('')}</div>
<h2>Số câu mỗi lượt</h2><div class="chips" id="c2">${[[20,'20 câu'],[50,'50 câu'],[100,'100 câu'],[0,'Tất cả']].map(([k,t])=>`<button class="chip" data-k="${k}" onclick="lim=${k};upd()">${t}</button>`).join('')}</div>
<button class="go" id="gb" onclick="start()"></button></div>`);upd()}
function upd(){document.querySelectorAll('#c1 .chip').forEach(b=>b.classList.toggle('on',chs.has(+b.dataset.c)));document.querySelectorAll('#c2 .chip').forEach(b=>b.classList.toggle('on',lim==+b.dataset.k));const n=pool().length,g=document.getElementById('gb');g.disabled=!n;g.textContent='Bắt đầu · '+(lim?Math.min(lim,n):n)+' câu'}
function tg(c){chs.has(c)?chs.delete(c):chs.add(c);upd()}
function start(list){let p=list||pool();if(!list&&lim)p=sh(p).slice(0,lim);
Q=(mode==0&&!list)?[1,2,3].flatMap(l=>sh(p.filter(q=>q[1]==l))):sh(p);i=0;ok=0;wr=[];st=0;bs=0;ask()}
const fcls=()=>'fire'+(st?'':' cold');
function ask(){if(i>=Q.length)return fin();const q=Q[i],o=sh(q.slice(3,7).map((t,k)=>[t,!k]));
scr(`<div class="hd"><button class="btn sm" onclick="home()">← Thoát</button><div class="pill"><span id="fi" class="${fcls()}" style="--s:${Math.min(st,20)}">🔥</span><b id="fn">${st}</b></div><span></span></div>
<div class="bar"><i style="width:${i/Q.length*100}%"></i></div>
<div style="display:flex;justify-content:space-between" class="mut"><span>Câu ${i+1}/${Q.length} · ${CN[q[0]].split(' · ')[0]}</span></div>
<div class="card"><div class="q">${esc(q[2])}</div></div>
<div id="o">${o.map((x,k)=>`<button class="opt" data-c="${x[1]?1:0}" onclick="pick(this)"><b>${'ABCD'[k]}</b><span>${esc(x[0])}</span></button>`).join('')}</div><div id="n"></div>`)}
function pick(b){const q=Q[i],good=b.dataset.c=='1',fi=document.getElementById('fi'),fn=document.getElementById('fn');
document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.c=='1')x.classList.add('ok')});
if(good){snd(1);ok++;st++;bs=Math.max(bs,st);if(st>best){best=st;try{localStorage.setItem('cx-best',best)}catch(e){}}
fn.textContent=st;fi.className=fcls()+' pop';fi.style.setProperty('--s',Math.min(st,20))}
else{snd(0);wr.push(q);b.classList.add('bad');st=0;fi.className='fire out';setTimeout(()=>{fn.textContent=0;fi.className='fire cold';fi.style.setProperty('--s',0)},450)}
const e=q[7],msg=good?(st>=10?'Chuỗi '+st+', bốc cháy!':st>=5?'Chuỗi '+st+', quá đỉnh!':st>=3?'Chuỗi '+st+', đang nóng!':'Chính xác!'):'Chưa đúng, chuỗi lửa đã tắt.';
document.getElementById('n').innerHTML=`<div class="ex ${good?'g':''}"><b>${msg}</b> Đáp án đúng: ${esc(q[3])}.${e?`<blockquote><b>Giáo trình${e[2]?', trang '+e[2]+' (theo file PDF)':''}</b>, mục “${esc(e[0])}”:<br>${esc(e[1])}</blockquote>`:''}</div><button class="go" onclick="i++;ask()">${i+1<Q.length?'Câu tiếp theo →':'Xem kết quả'}</button>`;
}
function fin(){const p=Math.round(ok/Q.length*100);
scr(`<div class="hero cen"><div style="font-size:2.4rem">${p>=80?'🏆':p>=50?'👍':'💪'}</div><h1>${ok}/${Q.length} câu đúng</h1><p>${p}% · Chuỗi đúng dài nhất lượt này: 🔥 ${bs}</p></div>
<div class="bar"><i style="width:${p}%"></i></div>
${wr.length?`<button class="go" onclick="start(wr.slice())">Làm lại ${wr.length} câu sai</button>`:'<div class="card cen">Đúng hết, rất tốt!</div>'}
<button class="btn" style="width:100%;margin-top:12px;padding:12px" onclick="home()">Về trang chọn</button>`)}
document.querySelector('.mb').textContent=mt();home();
</script></body></html>
