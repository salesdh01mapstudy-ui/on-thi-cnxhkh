<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Luyện trắc nghiệm CNXH khoa học</title>
<style>
:root{--bg:#f3ecdc;--fg:#14233d;--mut:#5b6b85;--card:#fffdf7;--line:#d9ccb0;--ac:#1d4ed8;--ac2:#dbe6fb;--ok:#1f7a45;--okb:#dff2e4;--bad:#b3261e;--badb:#fbe0dd;--hero:linear-gradient(135deg,#1e3a8a,#2563eb);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1729;--fg:#f1ead9;--mut:#9fb0cc;--card:#17223a;--line:#2a3a5c;--ac:#5b87f0;--ac2:#1f2f55;--ok:#7fd29a;--okb:#16341f;--bad:#f59a90;--badb:#3d211e;--hero:linear-gradient(135deg,#16224a,#1d3a8f)}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:bold 19px/1.6 "Times New Roman",Times,serif}
main{max-width:680px;margin:0 auto;padding:14px 16px 70px}
.scr{animation:in .35s ease both}@keyframes in{from{opacity:0}to{opacity:1}}
.hero{background:var(--hero);color:#f6efe0;border-radius:18px;padding:22px 20px;margin:6px 0 14px;box-shadow:0 8px 24px rgba(30,58,138,.25)}
.hero h1{margin:0;font-size:1.8rem;line-height:1.25}.hero p{margin:.4em 0 0;opacity:.9;font-size:.98rem}
h2{font-size:1.05rem;margin:1.1em 0 .5em;color:var(--ac)}.mut{color:var(--mut);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 0 var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.95rem;border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 14px;cursor:pointer;transition:.15s}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.go{font:inherit;font-weight:bold;width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:var(--ac);color:#fff;cursor:pointer;font-size:1.1rem;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .1s}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}.go:disabled{opacity:.4}
.btn{font:inherit;padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}.btn.sm{padding:4px 12px;font-size:.9rem}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);background:var(--bg);padding:6px 0;z-index:5}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:2px 14px 2px 10px;font-weight:bold;font-size:1.15rem}
.fire{display:inline-block;font-size:calc(1.2rem + var(--s,0)*1.3px);animation:fl 1s ease-in-out infinite;transition:.3s}
@keyframes fl{0%,100%{transform:rotate(-5deg) scale(1)}50%{transform:rotate(5deg) scale(1.12)}}
.fire.cold{filter:grayscale(1);opacity:.45;animation:none}.fire.out{filter:grayscale(1);animation:sh .45s}.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.6)}}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa);transition:width .4s}
.lv{font-size:.8rem;padding:2px 10px;border-radius:999px;background:var(--ac2);color:var(--ac)}
.q{font-size:1.2rem;font-weight:bold;line-height:1.55}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;cursor:pointer;transition:transform .1s,border-color .15s;animation:in .35s ease both}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
.opt:hover:not(:disabled){border-color:var(--ac);transform:translateY(-2px)}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ac2);color:var(--ac);display:grid;place-items:center;font-size:.9rem}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ok b{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badb);animation:sh .4s}.opt.bad b{background:var(--bad);color:#fff}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ex{border-left:5px solid var(--bad);background:var(--card);border-radius:12px;padding:12px 14px;margin:14px 0;animation:in .3s ease both}.ex.g{border-left-color:var(--ok)}
.ex blockquote{margin:.6em 0 0;color:var(--mut);font-size:.96rem}
.mas{font-size:3.4rem;line-height:1;flex:none;transform-origin:50% 100%;animation:hop 1.2s ease-in-out infinite;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.1,.88)}25%{transform:translateY(-26px) rotate(-10deg) scale(1)}50%{transform:translateY(0) scale(1.1,.88)}75%{transform:translateY(-14px) rotate(8deg) scale(1)}}
#n .go{position:sticky;bottom:12px}.opt:hover:not(:disabled){transform:none}#tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hero);color:#f6efe0;box-shadow:0 3px 12px rgba(0,0,0,.25)}#tb .in{max-width:680px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px}#tb .ttl{flex:1;font-size:1.1rem;line-height:1.2}#tb small{font-size:.8rem;opacity:.9}#tb .mas{font-size:2rem;animation:hop 1.6s ease-in-out infinite;filter:none}#tb .btn{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.4)}.big{font-size:3rem;font-weight:bold;color:var(--ac);line-height:1}.cen{text-align:center}
</style></head><body><header id="tb"><div class="in"><span class="mas">🐥</span><div class="ttl">Luyện trắc nghiệm<br><small>Chủ nghĩa xã hội khoa học</small></div><button class="btn sm mb" onclick="tm()"></button></div></header><main id="v"></main>
<script>
const D=[[2,1,"Sứ mệnh lịch sử của giai cấp công nhân thể hiện ở ba nội dung cơ bản nào?","Kinh tế; chính trị - xã hội; văn hóa, tư tưởng","Kinh tế; quân sự; ngoại giao","Chính trị; tôn giáo; giáo dục","Kinh tế; pháp luật; an ninh",["2. Nội dung sứ mệnh lịch sử của GCCN","Phát triển văn hóa, xây dựng con người mới xã hội chủ nghĩa, đạo đức và lối sống mới xã hội chủ nghĩa là một trong những nội dung căn bản mà cách mạng xã hội chủ nghĩa trên lĩnh vực văn hóa tư tưởng đặt ra đối với sứ mệnh lịch sử của giai cấp công nhân hiện đại.",36]],[2,1,"Nhân tố chủ quan quan trọng nhất để GCCN thực hiện sứ mệnh lịch sử là gì?","Đảng Cộng sản","Sự giàu có của giai cấp tư sản","Số lượng công nhân đông đảo","Sự nghèo khổ của công nhân",["3. Điều kiện quy định và thực hiện sứ mệnh","Giai cấp công nhân được trang bị lý luận tiên tiến là chủ nghĩa Mác - Lênin, có đội tiền phong là Đảng Cộng sản dẫn dắt.",38]],[2,2,"Điều kiện khách quan quy định sứ mệnh lịch sử của GCCN là gì?","Địa vị kinh tế và địa vị chính trị - xã hội của giai cấp","Sự nghèo khổ của công nhân","Truyền thống yêu nước","Sự giúp đỡ của giai cấp tư sản",["3. Điều kiện quy định và thực hiện sứ mệnh","Thứ hai, do địa vị chính trị - xã hội của giai cấp công nhân quy định.",37]],[2,2,"GCCN là giai cấp cách mạng chủ yếu vì lý do nào?","Đại biểu cho lực lượng sản xuất tiên tiến, phương thức sản xuất tiên tiến","Vì họ nghèo khổ","Vì họ đông nhất xã hội","Vì họ sở hữu tư liệu sản xuất",["3. Điều kiện quy định và thực hiện sứ mệnh","Vì thế, giai cấp công nhân đại diện cho phương thức sản xuất tiên tiến và lực lượng sản xuất hiện đại.",37]],[2,2,"Đảng Cộng sản Việt Nam ra đời là kết quả của sự kết hợp giữa:","CN Mác - Lênin, phong trào công nhân và phong trào yêu nước","CN Mác - Lênin và phong trào nông dân","Phong trào yêu nước và tư tưởng phương Tây","Phong trào công nhân và chủ nghĩa dân tộc tư sản",["3. Điều kiện quy định và thực hiện sứ mệnh","Ở Việt Nam, quy luật phổ biến này được biểu hiện trong tính đặc thù, xuất phát từ hoàn cảnh và điều kiện lịch sử - cụ thể của Việt Nam, đó là: Đảng Cộng sản Việt Nam ra đời là kết quả của sự kết hợp giữa chủ nghĩa Mác - Lênin với phong trào công nhân và phong trào yêu nước của dân tộc.",39]],[2,1,"Hai xu hướng biến đổi nổi bật của GCCN hiện nay là:","Trí tuệ hóa và trung lưu hóa","Nông dân hóa và vô sản hóa","Thủ công hóa và địa phương hóa","Tư sản hóa và quý tộc hóa",["4. GCCN hiện nay","Tri thức hóa và trí thức hóa công nhân là hai mặt của cùng một quá trình, của xu hướng trí tuệ hóa đối với công nhân và giai cấp công nhân.",41]],[2,2,"Vấn đề nổi bật nhất trong sứ mệnh lịch sử của GCCN Việt Nam hiện nay là:","Đi đầu trong sự nghiệp công nghiệp hóa, hiện đại hóa","Phát triển nông nghiệp truyền thống","Xóa bỏ kinh tế thị trường","Hạn chế hội nhập quốc tế",["7. Nội dung sứ mệnh của GCCN Việt Nam","Giai cấp công nhân phát huy vai trò và trách nhiệm của lực lượng đi đầu trong sự nghiệp đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước - đây là vấn đề nổi bật nhất đối với việc thực hiện sứ mệnh lịch sử của giai cấp công nhân Việt Nam hiện nay.",48]],[2,2,"Mâu thuẫn cơ bản của phương thức sản xuất tư bản chủ nghĩa là mâu thuẫn giữa:","Lực lượng sản xuất xã hội hóa và quan hệ sản xuất tư bản chủ nghĩa","Thành thị và nông thôn","Công nghiệp và nông nghiệp","Tư bản lớn và tư bản nhỏ",["1. Khái niệm và đặc điểm của GCCN","Mâu thuẫn cơ bản của phương thức sản xuất tư bản chủ nghĩa là mâu thuẫn giữa lực lượng sản xuất xã hội hóa ngày càng rộng lớn với quan hệ sản xuất tư bản chủ nghĩa dựa trên chế độ tư hữu tư bản chủ nghĩa về tư liệu sản xuất.",33]],[3,2,"Theo Mác, nhà nước của thời kỳ quá độ chính trị là:","Chuyên chính cách mạng của giai cấp vô sản","Nhà nước tư sản cải cách","Nhà nước phong kiến","Nhà nước phi giai cấp",["1. CNXH, giai đoạn đầu của hình thái KT-XH cộng sản chủ nghĩa","Thích ứng với thời kỳ ấy là một thời kỳ quá độ chính trị, và nhà nước của thời kỳ ấy không thể là cái gì khác hơn là nền chuyên chính cách mạng của giai cấp vô sản”.",55]],[3,2,"Quá độ lên CNXH ở Việt Nam là loại hình quá độ nào?","Quá độ gián tiếp, bỏ qua chế độ TBCN","Quá độ trực tiếp từ CNTB phát triển","Quá độ từ chiếm hữu nô lệ","Không cần thời kỳ quá độ",["4. Tính tất yếu khách quan của thời kỳ quá độ","Cho đến nay thời kỳ quá độ trực tiếp lên chủ nghĩa cộng sản từ chủ nghĩa tư bản phát triển chưa từng diễn ra; 2) Quá độ gián tiếp từ chủ nghĩa tư bản lên chủ nghĩa cộng sản đối với những nước chưa trải qua chủ nghĩa tư bản phát triển.",66]],[3,1,"Mục đích cao nhất của những cải tạo xã hội chủ nghĩa theo Lênin là thực hiện nguyên tắc:","Làm theo năng lực, hưởng theo nhu cầu","Làm theo năng lực, hưởng theo lao động","Bình quân chia đều","Hưởng theo vốn góp",["3. Những đặc trưng bản chất của CNXH","V.I. Lênin cho rằng: “Thiết lập một chế độ xã hội cao hơn chủ nghĩa tư bản, nghĩa là nâng cao năng suất lao động và do đó (và nhằm mục đích đó) phải tổ chức lao động theo một trình độ cao hơn”.",61]],[3,1,"Lịch sử xã hội loài người trải qua mấy hình thái kinh tế - xã hội?","5","3","4","6",["1. CNXH, giai đoạn đầu của hình thái KT-XH cộng sản chủ nghĩa","Ăngghen khi nghiên cứu lịch sử phát triển của xã hội loài người, nhất là lịch sử xã hội tư bản, đã xây dựng nên học thuyết về hình thái kinh tế - xã hội.",54]],[4,2,"Nền dân chủ XHCN được chính thức xác lập khi nào?","Cách mạng Tháng Mười Nga thành công (1917)","Công xã Pari (1871)","Cách mạng tư sản Pháp (1789)","Sau Chiến tranh thế giới thứ hai",["2. Dân chủ xã hội chủ nghĩa","Dân chủ xã hội chủ nghĩa đã được phôi thai từ thực tiễn đấu tranh giai cấp ở Pháp và Công xã Pari năm 1871, tuy nhiên chỉ đến khi Cách mạng Tháng Mười Nga thành công với sự ra đời của nhà nước xã hội chủ nghĩa đầu tiên trên thế giới (1917), nền dân chủ xã hội chủ nghĩa mới chính thức được xác lập.",85]],[4,2,"Dân chủ XHCN càng hoàn thiện thì:","Càng tiến tới tự tiêu vong (tính chính trị mất dần)","Càng bị thu hẹp","Càng trở nên giai cấp hơn","Càng tách khỏi nhân dân",["2. Dân chủ xã hội chủ nghĩa","Thực chất của sự tiêu vong này, theo V.I. Lênin, đó là tính chính trị của dân chủ sẽ mất đỉ trên cơ sở không ngừng mở rộng dân chủ đối với nhân dân, xác lập địa vị chủ thể quyền lực của nhân dân, tạo điều kiện để họ tham gia ngày càng đông đảo và ngày càng có ý nghĩa quyết định vào sự quản lý nhà nước, quản lý xã hội (xã hội tự quản).",86]],[4,3,"Nguyên tắc cơ bản của dân chủ XHCN là:","Không ngừng mở rộng dân chủ, thu hút nhân dân tham gia quản lý nhà nước, xã hội","Hạn chế quyền của số đông","Dân chủ chỉ cho giai cấp công nhân","Dân chủ chỉ trong lĩnh vực kinh tế",["2. Dân chủ xã hội chủ nghĩa","Nguyên tắc cơ bản của nền dân chủ xã hội chủ nghĩa là không ngừng mở rộng dân chủ, nâng cao mức độ giải phóng cho những người lao động, thu hút họ tham gia tự giác vào công việc quản lý nhà nước, quản lý xã hội.",85]],[5,1,"Khối liên minh giai cấp, tầng lớp nòng cốt ở Việt Nam gồm:","Công nhân - nông dân - đội ngũ trí thức","Công nhân - tư sản - địa chủ","Nông dân - thương nhân - quân đội","Công nhân - học sinh - sinh viên",["4. Liên minh giai cấp, tầng lớp","Tăng cường khối đại đoàn kết toàn dân tộc trên nền tảng liên minh giai cấp công nhân với giai cấp nông dân và đội ngũ trí thức do Đảng lãnh đạo”.",118]],[5,2,"Liên minh công - nông - trí thức ở Việt Nam đặt dưới sự lãnh đạo của:","Đảng Cộng sản Việt Nam","Giai cấp nông dân","Giai cấp tư sản dân tộc","Các tổ chức quốc tế",["4. Liên minh giai cấp, tầng lớp","Liên minh giai cấp, tầng lớp trong thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam Trên cơ sở những quan điểm cơ bản của chủ nghĩa Mác - Lênin về liên minh giai cấp, tầng lớp, dưới sự lãnh đạo của Chủ tịch Hồ Chí Minh và Đảng Cộng sản Việt Nam, tư tưởng liên minh giai cấp công nhân với giai cấp nông dân và đội ngũ trí thức đã được hình thành từ rất sớm ở nước ta và được khẳng định qua các kỳ Đại hội của Đảng.",118]],[6,1,"Người phát hiện hai xu hướng khách quan trong sự phát triển quan hệ dân tộc là:","V.I. Lênin","C. Mác","Ph. Ăngghen","Hồ Chí Minh",["2. CN Mác - Lênin về vấn đề dân tộc","Hai xu hướng khách quan của sự phát triển dân tộc có sự thống nhất biện chứng với nhau trong tiến trình phát triển của mỗi quốc gia và của toàn nhân loại.",132]],[6,2,"Xu hướng thứ nhất của quan hệ dân tộc là:","Cộng đồng dân cư muốn tách ra để hình thành dân tộc độc lập","Các dân tộc muốn liên hiệp lại với nhau","Các dân tộc muốn đồng hóa nhau","Các dân tộc muốn đóng cửa biên giới",["2. CN Mác - Lênin về vấn đề dân tộc","Xu hướng thứ nhất, cộng đồng dân cư muốn tách ra để hình thành cộng đồng dân tộc độc lập.",131]],[6,3,"Cương lĩnh dân tộc của CN Mác - Lênin gồm:","Các dân tộc bình đẳng; quyền tự quyết; liên hiệp công nhân các dân tộc","Các dân tộc bình đẳng; sáp nhập; đồng hóa","Tự quyết; cô lập; trung lập","Bình đẳng; tôn giáo hóa; liên bang hóa",["2. CN Mác - Lênin về vấn đề dân tộc","Quyền tự quyết dân tộc bao gồm quyền tách ra thành lập một quốc gia dân tộc độc lập, đồng thời có quyền tự nguyện liên hiệp với dân tộc khác trên cơ sở bình đẳng.",133]],[6,2,"Dân tộc theo nghĩa rộng dùng để chỉ:","Quốc gia, toàn bộ nhân dân của một nước","Một tộc người thiểu số","Một dòng họ","Một tôn giáo",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Với nghĩa này, khái niệm dân tộc dùng để chỉ một quốc gia, nghĩa là toàn bộ nhân dân của một nước.",128]],[6,3,"Nhân tố quyết định sự biến đổi của các hình thức cộng đồng dân tộc là:","Sự biến đổi của phương thức sản xuất","Ý chí của nhà nước","Sự thay đổi tôn giáo","Sự thay đổi ngôn ngữ",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Sự biến đổi của phương thức sản xuất chính là nguyên nhân quyết định sự biến đổi của cộng đồng dân tộc.",127]],[7,1,"Chức năng đặc thù, không cộng đồng nào thay thế được của gia đình là:","Tái sản xuất ra con người","Tổ chức tiêu dùng","Giáo dục nhà trường","Quản lý nhà nước",["3. Chức năng cơ bản của gia đình","Việc thực hiện chức năng tái sản xuất ra con người diễn ra trong từng gia đình, nhưng không chỉ là việc riêng của gia đình mà là vấn đề xã hội.",161]],[7,2,"Các cơ sở xây dựng gia đình trong thời kỳ quá độ lên CNXH là:","Kinh tế - xã hội; chính trị - xã hội; văn hóa","Tôn giáo; dòng họ; làng xã","Quân sự; ngoại giao; kinh tế","Giáo dục; y tế; thể thao",["6. Cơ sở văn hóa","Cơ sở văn hóa Trong thời kỳ quá độ lên chủ nghĩa xã hội, cùng với những biến đổi căn bản trong đời sống chính trị, kinh tế, thì đời sống văn hóa, tinh thần cũng không ngừng biến đổi.",166]],[7,2,"Cơ sở của hôn nhân tiến bộ là:","Tình yêu chân chính giữa nam và nữ","Lợi ích kinh tế của hai họ","Môn đăng hộ đối","Sự sắp đặt của cha mẹ",["7. Chế độ hôn nhân tiến bộ","Hôn nhân tiến bộ còn bao hàm cả quyền tự do ly hôn khi tình yêu giữa nam và nữ không còn nữa.",167]],[2,1,"Thuật ngữ nào đồng nghĩa với giai cấp công nhân trong tác phẩm của Mác và Ăngghen?","Giai cấp vô sản hiện đại","Giai cấp tiểu tư sản","Giai cấp nông nô","Giai cấp quý tộc",["2. Nội dung sứ mệnh lịch sử của GCCN","Nói về sứ mệnh lịch sử của giai cấp công nhân, C.Mác đã viết: “Thực hiện sự nghiệp giải phóng thế giới ấy, - đó là sứ mệnh lịch sử của giai cấp vô sản hiện đại”.",35]],[2,1,"Giai cấp công nhân là sản phẩm của nền sản xuất nào?","Đại công nghiệp","Thủ công nghiệp","Nông nghiệp tự cung tự cấp","Thương mại cổ truyền",["3. Điều kiện quy định và thực hiện sứ mệnh","Giai cấp công nhân là con đẻ, sản phẩm của nền đại công nghiệp, có tính xã hội hóa ngày càng cao, là chủ thể của quá trình sản xuất vật chất hiện đại.",37]],[2,1,"Đặc điểm nổi bật của giai cấp công nhân là lao động bằng phương thức nào?","Công nghiệp với máy móc hiện đại","Thủ công truyền thống","Canh tác nông nghiệp","Buôn bán nhỏ",["1. Khái niệm và đặc điểm của GCCN","Họ lao động bằng phương thức công nghiệp ngày càng hiện đại với những đặc điểm nổi bật: sản xuất bằng máy móc, lao động có tính chất xã hội hóa, năng suất lao động cao và tạo ra những tiền đề của cải vật chất cho xã hội mới.",32]],[2,2,"Ở phương diện chính trị - xã hội, công nhân là những người:","Không có tư liệu sản xuất, phải bán sức lao động và bị bóc lột giá trị thặng dư","Sở hữu tư liệu sản xuất chủ yếu","Sống nhờ địa tô","Bóc lột lao động của người khác",["1. Khái niệm và đặc điểm của GCCN","Họ là người làm thuê do không có tư liệu sản xuất, buộc phải bán sức lao động để sống và bị giai cấp tư sản bóc lột giá trị thặng dư; vì vậy lợi ích cơ bản của họ đối lập với lợi ích cơ bản của giai cấp tư sản.",33]],[2,2,"Theo Tuyên ngôn của Đảng Cộng sản, giai cấp tư sản sản sinh ra:","Những người đào huyệt chôn chính nó","Những người kế thừa nó","Những đồng minh vĩnh viễn","Những nhà tài trợ cách mạng",["3. Điều kiện quy định và thực hiện sứ mệnh","Trước hết, giai cấp tư sản sản sinh ra những người đào huyệt chôn chính nó.",37]],[2,2,"Hai biện pháp cơ bản để phát triển GCCN về số lượng và chất lượng là:","Phát triển công nghiệp và sự trưởng thành của Đảng Cộng sản","Phát triển nông nghiệp và thương mại","Mở rộng đô thị và du lịch","Tăng dân số và tăng thuế",["3. Điều kiện quy định và thực hiện sứ mệnh","Để phát triển giai cấp công nhân về số lượng và chất lượng, theo chủ nghĩa Mác - Lênin phải đặc biệt chú ý đến hai biện pháp cơ bản: 1) Phát triển công nghiệp - “tiền đề thực tiễn tuyệt đối cần thiết”; 2) Sự trưởng thành của Đảng Cộng sản - hạt nhân chính trị quan trọng của giai cấp công nhân.",39]],[2,2,"Quy luật phổ biến cho sự ra đời của Đảng Cộng sản là:","Kết hợp chủ nghĩa xã hội khoa học với phong trào công nhân","Kết hợp phong trào nông dân với chủ nghĩa dân tộc","Tự phát từ nghiệp đoàn","Do giai cấp tư sản thành lập",["3. Điều kiện quy định và thực hiện sứ mệnh","Quy luật chung, phổ biến cho sự ra đời của Đảng Cộng sản là sự kết hợp giữa chủ nghĩa xã hội khoa học, tức chủ nghĩa Mác - Lênin với phong trào công nhân.",39]],[2,2,"Theo C. Mác, bộ phận tiêu biểu của GCCN hiện đại là:","Công nhân công nghiệp công xưởng","Thợ thủ công","Nông dân làm thuê","Thương nhân nhỏ",["1. Khái niệm và đặc điểm của GCCN","Ăngghen, công nhân công nghiệp công xưởng là bộ phận tiêu biểu cho giai cấp công nhân hiện đại.",32]],[2,2,"Theo Hội nghị TW 6 khóa X, GCCN Việt Nam là những người lao động:","Chân tay và trí óc, làm công hưởng lương trong sản xuất, dịch vụ công nghiệp hoặc có tính chất công nghiệp","Chỉ lao động chân tay trong nhà máy","Chỉ làm trong khu vực nhà nước","Chỉ làm trong doanh nghiệp nước ngoài",["6. Đặc điểm của GCCN Việt Nam","Đặc điểm của giai cấp công nhân Việt Nam Tại Hội nghị lần thứ sáu Ban Chấp hành Trung ương khóa X, Đảng đã xác định: “Giai cấp công nhân Việt Nam là một lực lượng xã hội to lớn, đang phát triển, bao gồm những người lao động chân tay và trí óc, làm công hưởng lương trong các loại hình sản xuất kinh doanh và dịch vụ công nghiệp, hoặc sản xuất kinh doanh và dịch vụ có tính chất công nghiệp”.",45]],[2,2,"GCCN Việt Nam ra đời gắn với:","Chính sách khai thác thuộc địa của thực dân Pháp","Cải cách ruộng đất","Chiến tranh chống Mỹ","Công cuộc Đổi mới",["6. Đặc điểm của GCCN Việt Nam","Giai cấp công nhân Việt Nam ra đời và phát triển gắn liền với chính sách khai thác thuộc địa của thực dân Pháp ở Việt Nam.",45]],[2,3,"Đặc điểm nào đúng với GCCN Việt Nam khi ra đời?","Ra đời trước giai cấp tư sản Việt Nam, phát triển chậm","Ra đời sau giai cấp tư sản dân tộc","Ra đời từ nền đại công nghiệp tự thân","Ra đời cùng giai cấp địa chủ",["6. Đặc điểm của GCCN Việt Nam","Giai cấp công nhân Việt Nam ra đời và phát triển gắn liền với chính sách khai thác thuộc địa của thực dân Pháp ở Việt Nam.",45]],[2,3,"Xét về thực chất, “trung lưu hóa” của công nhân ở các nước tư bản có nghĩa là:","Vẫn bị bóc lột; quyền định đoạt sản xuất, phân phối lợi nhuận vẫn thuộc giai cấp tư sản","Đã thành chủ sở hữu chính tư liệu sản xuất","Không còn mâu thuẫn lợi ích với tư sản","Không còn bán sức lao động",["4. GCCN hiện nay","Quyền định đoạt quá trình sản xuất, quyền quyết định cơ chế phân phối lợi nhuận vẫn thuộc về giai cấp tư sản.",42]],[2,3,"Hệ giá trị mới mà GCCN cần xây dựng trong nội dung văn hóa, tư tưởng là:","Lao động, công bằng, dân chủ, bình đẳng, tự do","Cạnh tranh, tích lũy, độc quyền","Đẳng cấp, đặc quyền","Tôn ti, trật tự, phục tùng",["5. Thực hiện sứ mệnh của GCCN trên thế giới hiện nay","Các giá trị như lao động, sáng tạo, công bằng, dân chủ, bình đẳng, tự do vẫn là những giá trị được nhân loại thừa nhận và phấn đấu thực hiện.",44]],[2,3,"Điểm then chốt để thực hiện thành công sứ mệnh lịch sử của GCCN Việt Nam là:","Xây dựng, chỉnh đốn Đảng trong sạch, vững mạnh","Giảm số lượng công nhân","Hạn chế hội nhập","Chỉ phát triển nông nghiệp",["5. Thực hiện sứ mệnh của GCCN trên thế giới hiện nay","Đối với các nước xã hội chủ nghĩa, nơi các Đảng Cộng sản đã trở thành đảng cầm quyền, sứ mệnh lịch sử của giai cấp công nhân là lãnh đạo thành công sự nghiệp đổi mới, giải quyết thành công các nhiệm vụ trong thời kỳ quá độ lên chủ nghĩa xã hội, đặc biệt là xây dựng Đảng cầm quyền trong sạch, vững mạnh, thực hiện thành công sự nghiệp công nghiệp hóa, hiện đại hóa, đưa đất nước phát triển nhanh và bền vững.",43]],[2,3,"Vì sao nghèo khổ không phải nguyên nhân khiến GCCN là giai cấp cách mạng?","Vì họ đại biểu cho lực lượng sản xuất, phương thức sản xuất tiên tiến","Vì họ không nghèo","Vì nghèo khổ là điều kiện cần của cách mạng","Vì chỉ nông dân mới nghèo",["3. Điều kiện quy định và thực hiện sứ mệnh","Vì thế, giai cấp công nhân đại diện cho phương thức sản xuất tiên tiến và lực lượng sản xuất hiện đại.",37]],[2,2,"Một hạn chế của GCCN Việt Nam do nguồn gốc xã hội là:","Tâm lý tiểu nông, tác phong công nghiệp chưa đầy đủ","Không yêu nước","Không có tổ chức","Tách rời nhân dân",["7. Nội dung sứ mệnh của GCCN Việt Nam","Đó còn là điều kiện để giai cấp công nhân Việt Nam khắc phục những nhược điểm, hạn chế vốn có do hoàn cảnh lịch sử và nguồn gốc xã hội sinh ra (như tâm lý tiểu nông, lối sống nông dân, thói quen, tập quán lạc hậu từ truyền thống xã hội nông nghiệp cổ truyền...).",49]],[3,1,"Hình thái kinh tế - xã hội nào kế tiếp chủ nghĩa tư bản?","Cộng sản chủ nghĩa","Phong kiến","Chiếm hữu nô lệ","Cộng sản nguyên thủy",["1. CNXH, giai đoạn đầu của hình thái KT-XH cộng sản chủ nghĩa","Khi phân tích hình thái kinh tế - xã hội cộng sản chủ nghĩa, C. Mác và Ph.",55]],[3,1,"Thứ tự đúng của các hình thái kinh tế - xã hội là:","Nguyên thủy, chiếm hữu nô lệ, phong kiến, tư bản chủ nghĩa, cộng sản chủ nghĩa","Chiếm hữu nô lệ, phong kiến, nguyên thủy, tư bản, cộng sản","Phong kiến, nô lệ, tư bản, nguyên thủy, cộng sản","Nguyên thủy, phong kiến, nô lệ, cộng sản, tư bản",["4. Tính tất yếu khách quan của thời kỳ quá độ","Tính tất yếu khách quan của thời kỳ quá độ lên chủ nghĩa xã hội Học thuyết hình thái kinh tế - xã hội của chủ nghĩa Mác - Lênin đã chỉ rõ: lịch sử xã hội đã trải qua 5 hình thái kinh tế - xã hội: Cộng sản nguyên thủy, chiếm hữu nô lệ, phong kiến, tư bản chủ nghĩa và cộng sản chủ nghĩa.",65]],[3,2,"CNXH là giai đoạn nào của hình thái kinh tế - xã hội cộng sản chủ nghĩa?","Giai đoạn đầu (giai đoạn thấp)","Giai đoạn cao","Hình thái độc lập khác","Giai đoạn cuối",["1. CNXH, giai đoạn đầu của hình thái KT-XH cộng sản chủ nghĩa","Chủ nghĩa xã hội, giai đoạn đầu của hình thái kinh tế - xã hội cộng sản chủ nghĩa Các nhà sáng lập chủ nghĩa xã hội khoa học C. Mác và Ph.",54]],[3,2,"Quá độ trực tiếp từ CNTB phát triển lên chủ nghĩa cộng sản:","Chưa từng diễn ra trong thực tế","Đã diễn ra ở Liên Xô","Đã diễn ra ở Việt Nam","Đã diễn ra ở Trung Quốc",["4. Tính tất yếu khách quan của thời kỳ quá độ","Cho đến nay thời kỳ quá độ trực tiếp lên chủ nghĩa cộng sản từ chủ nghĩa tư bản phát triển chưa từng diễn ra; 2) Quá độ gián tiếp từ chủ nghĩa tư bản lên chủ nghĩa cộng sản đối với những nước chưa trải qua chủ nghĩa tư bản phát triển.",66]],[3,2,"Liên Xô, Đông Âu trước đây, Trung Quốc, Việt Nam đều trải qua loại quá độ nào?","Quá độ gián tiếp","Quá độ trực tiếp","Không cần quá độ","Quá độ qua phong kiến",["4. Tính tất yếu khách quan của thời kỳ quá độ","Trên thế giới một thế kỷ qua, kể cả Liên Xô và các nước xã hội chủ nghĩa Đông Âu trước đây, Trung Quốc, Việt Nam và một số nước xã hội chủ nghĩa khác ngày nay, theo đúng lý luận Mác - Lênin, đều đang trải qua thời kỳ quá độ gián tiếp với những trình độ phát triển khác nhau.",66]],[3,3,"Đặc trưng thể hiện bản chất nhân văn của CNXH là:","Giải phóng giai cấp, dân tộc, xã hội, con người, tạo điều kiện để con người phát triển toàn diện","Duy trì bóc lột","Mở rộng tư hữu","Hạn chế quyền con người",["3. Những đặc trưng bản chất của CNXH","Mục tiêu cao nhất của chủ nghĩa xã hội là giải phóng con người trên cơ sở điều kiện kinh tế - xã hội phát triển, mà xét đến cùng là trình độ phát triển cao của lực lượng sản xuất.",60]],[3,3,"Vì sao cần thời kỳ quá độ lên CNXH?","Giai cấp vô sản cần thời gian cải tạo xã hội cũ và xây dựng xã hội mới","Vì chưa có công nghiệp","Vì tư bản không cho phép","Vì chưa có nhà nước",["4. Tính tất yếu khách quan của thời kỳ quá độ","Mong muốn có ngay một chế độ xã hội xã hội chủ nghĩa tốt đẹp để thay thế xã hội tư bản chủ nghĩa bất công, tàn ác, là khát vọng chính đáng; song theo các nhà kinh điển, điều mong ước ấy không thể có với phép màu “cầu được ước thấy”; giai cấp vô sản cần phải có thời gian để cải tạo xã hội cũ do giai cấp bóc lột dựng lên và xây dựng trên nền móng ấy lâu đài của chủ nghĩa xã hội.",66]],[4,1,"“Dân chủ” theo nghĩa gốc là:","Quyền lực thuộc về nhân dân","Quyền lực thuộc về vua","Quyền lực thuộc về giáo hội","Quyền lực thuộc về quân đội",["5. Dân chủ XHCN ở Việt Nam","Quyền làm chủ của nhân dân là tất cả quyền lực đều thuộc về nhân dân, dân là gốc, là chủ, dân làm chủ.",97]],[4,1,"Nền dân chủ XHCN được phôi thai từ đâu?","Đấu tranh giai cấp ở Pháp và Công xã Pari 1871","Cách mạng công nghiệp Anh","Chiến tranh Hai miền","Hội nghị Viên",["2. Dân chủ xã hội chủ nghĩa","Dân chủ xã hội chủ nghĩa đã được phôi thai từ thực tiễn đấu tranh giai cấp ở Pháp và Công xã Pari năm 1871, tuy nhiên chỉ đến khi Cách mạng Tháng Mười Nga thành công với sự ra đời của nhà nước xã hội chủ nghĩa đầu tiên trên thế giới (1917), nền dân chủ xã hội chủ nghĩa mới chính thức được xác lập.",85]],[4,2,"Các nền dân chủ chính trong lịch sử gồm:","Dân chủ chủ nô, dân chủ tư sản, dân chủ XHCN","Dân chủ thần quyền, quân sự, thực dân","Dân chủ nông nô, đế quốc, vô chính phủ","Dân chủ liên bang, quân chủ, độc tài",["1. Dân chủ và sự ra đời, phát triển của dân chủ","Trong chế độ cộng sản nguyên thủy đã xuất hiện hình thức manh nha của dân chủ mà Ph.",83]],[4,2,"Dân chủ XHCN “tự tiêu vong” theo Lênin nghĩa là:","Tính chính trị của dân chủ mất đi, dân chủ thành thói quen, xã hội tự quản","Bị xóa bỏ ngay","Nhà nước bị lật đổ","Nhân dân mất quyền",["2. Dân chủ xã hội chủ nghĩa","Quá trình đó làm cho dân chủ trở thành một thói quen, một tập quán trong sinh hoạt xã hội... để đến lúc nó không còn tồn tại như một thể chế nhà nước, một chế độ, tức là mất đi tính chính trị của nó.",86]],[4,2,"Nhà nước XHCN đầu tiên trên thế giới là:","Nhà nước Xôviết (Nga, 1917)","Công xã Pari","Cộng hòa Pháp","Đế quốc Đức",["2. Dân chủ xã hội chủ nghĩa","Dân chủ xã hội chủ nghĩa đã được phôi thai từ thực tiễn đấu tranh giai cấp ở Pháp và Công xã Pari năm 1871, tuy nhiên chỉ đến khi Cách mạng Tháng Mười Nga thành công với sự ra đời của nhà nước xã hội chủ nghĩa đầu tiên trên thế giới (1917), nền dân chủ xã hội chủ nghĩa mới chính thức được xác lập.",85]],[4,3,"Điểm khác căn bản của dân chủ XHCN so với dân chủ tư sản là:","Là nền dân chủ của tuyệt đại đa số nhân dân lao động","Chỉ bảo vệ giai cấp công nhân","Dựa trên tư hữu tư bản","Không có pháp luật",["3. Nhà nước XHCN: ra đời, bản chất, chức năng","Do đó, nhà nước xã hội chủ nghĩa là đại biểu cho ý chí chung của nhân dân lao động.",92]],[4,2,"Nhà nước pháp quyền XHCN Việt Nam do ai lãnh đạo?","Đảng Cộng sản Việt Nam","Quốc hội độc lập","Các tổ chức quốc tế","Các hiệp hội doanh nghiệp",["7. Phát huy dân chủ XHCN, xây dựng nhà nước pháp quyền","Nhà nước pháp quyền xã hội chủ nghĩa ở nước ta đặt dưới sự lãnh đạo của Đảng Cộng sản Việt Nam, phải thực thi quyền dân chủ của nhân dân trên tất cả mọi lĩnh vực của đời sống xã hội, thể hiện bằng Hiến pháp và pháp luật.",103]],[5,1,"Cơ cấu xã hội - giai cấp giữ vị trí nào trong cơ cấu xã hội?","Quan trọng nhất, nền tảng","Thứ yếu","Hoàn toàn độc lập","Chỉ có ở xã hội tư bản",["2. Biến đổi có tính quy luật của cơ cấu xã hội - giai cấp","Vai trò chủ đạo của giai cấp công nhân còn được thể hiện ở sự phát triển mối quan hệ liên minh giữa giai cấp công nhân, giai cấp nông dân và đội ngũ trí thức ngày càng giữ vị trí nền tảng chính trị - xã hội, từ đó tạo nên sự thống nhất của cơ cấu xã hội - giai cấp trong suốt thời kỳ quá độ lên chủ nghĩa xã hội.",112]],[5,2,"Cơ cấu xã hội - giai cấp ở Việt Nam gồm các giai cấp, tầng lớp nào?","Công nhân, nông dân, trí thức, doanh nhân và các tầng lớp khác","Chỉ công nhân và nông dân","Chỉ trí thức","Địa chủ và tư sản mại bản",["2. Biến đổi có tính quy luật của cơ cấu xã hội - giai cấp","Chính những biến đổi trong cơ cấu kinh tế này đã và đang từng bước tăng cường khối liên minh giữa giai cấp công nhân với giai cấp nông dân, đội ngũ trí thức và các tầng lớp xã hội khác.",114]],[5,3,"Liên minh giai cấp, tầng lớp trong thời kỳ quá độ có những nội dung nào?","Chính trị, kinh tế, văn hóa - xã hội","Quân sự, ngoại giao, tôn giáo","Tài chính, y tế, thể thao","Chỉ kinh tế",["1. Khái niệm và vị trí của cơ cấu xã hội - giai cấp","Vì vậy, cơ cấu xã hội - giai cấp là căn cứ cơ bản để từ đó xây dựng chính sách phát triển kinh tế văn hóa, xã hội của mỗi xã hội trong từng giai đoạn lịch sử cụ thể.",109]],[6,1,"Yếu tố được coi là thiêng liêng nhất đối với quốc gia và mỗi thành viên dân tộc là:","Lãnh thổ","Ngôn ngữ","Phong tục","Ẩm thực",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Đối với quốc gia và từng thành viên dân tộc, yếu tố lãnh thổ là thiêng liêng nhất.",128]],[6,1,"Thứ tự các hình thức cộng đồng người từ thấp đến cao là:","Thị tộc, bộ lạc, bộ tộc, dân tộc","Dân tộc, bộ tộc, bộ lạc, thị tộc","Bộ lạc, thị tộc, dân tộc, bộ tộc","Thị tộc, dân tộc, bộ lạc, bộ tộc",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Khái niệm, đặc trưng cơ bản của dân tộc Theo quan điểm của chủ nghĩa Mác - Lênin, dân tộc là quá trình phát triển lâu dài của xã hội loài người, trải qua các hình thức cộng đồng từ thấp đến cao, bao gồm: thị tộc, bộ lạc, bộ tộc, dân tộc.",127]],[6,2,"Xu hướng thứ hai của quan hệ dân tộc là:","Các dân tộc muốn liên hiệp lại với nhau","Tách ra thành quốc gia độc lập","Xóa bỏ ngôn ngữ","Cô lập hóa",["2. CN Mác - Lênin về vấn đề dân tộc","Xu hướng thứ hai, các dân tộc trong từng quốc gia, thậm chí các dân tộc ở nhiều quốc gia muốn liên hiệp lại với nhau.",131]],[6,2,"Xu hướng thứ nhất biểu hiện rõ trong:","Phong trào giải phóng dân tộc ở các nước thuộc địa, phụ thuộc","Liên minh khu vực","Hội nhập kinh tế","Thương mại tự do",["2. CN Mác - Lênin về vấn đề dân tộc","Xu hướng này thể hiện rõ nét trong phong trào đấu tranh giành độc lập dân tộc của các dân tộc thuộc địa và phụ thuộc muốn thoát khỏi sự áp bức, bóc lột của các nước thực dân, đế quốc.",131]],[6,3,"Hai xu hướng khách quan của quan hệ dân tộc có quan hệ:","Thống nhất biện chứng","Loại trừ nhau","Không liên quan","Chỉ có ở nước tư bản",["2. CN Mác - Lênin về vấn đề dân tộc","Hai xu hướng khách quan của sự phát triển dân tộc có sự thống nhất biện chứng với nhau trong tiến trình phát triển của mỗi quốc gia và của toàn nhân loại.",132]],[6,2,"Tôn giáo là:","Hình thái ý thức xã hội phản ánh hư ảo hiện thực khách quan","Một giai cấp xã hội","Một hình thức nhà nước","Một phương thức sản xuất",["4. Quan điểm CN Mác - Lênin về tôn giáo","Chủ nghĩa Mác - Lênin cho rằng, tôn giáo là một hình thái ý thức xã hội phản ánh hư ảo hiện thực khách quan.",140]],[6,3,"Nguyên tắc giải quyết vấn đề tôn giáo trong thời kỳ quá độ là:","Tôn trọng quyền tự do tín ngưỡng và không tín ngưỡng","Cấm đoán mọi tôn giáo","Dùng tôn giáo thay pháp luật","Đồng nhất tôn giáo với mê tín",["5. Tôn giáo ở Việt Nam, chính sách của Đảng và Nhà nước","Mọi công dân không phân biệt tín ngưỡng, tôn giáo đều có quyền và nghĩa vụ xây dựng, bảo vệ Tổ quốc.",148]],[6,2,"Cộng đồng các dân tộc Việt Nam có đặc điểm:","Đoàn kết gắn bó, cư trú đan xen, bình đẳng","Cư trú tách biệt hoàn toàn","Mỗi dân tộc một nhà nước riêng","Chỉ dân tộc Kinh có quyền",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Trên không gian đó, các cộng đồng tộc người có mối quan hệ gắn bó với nhau, cư trú đan xen với nhau.",128]],[7,1,"Gia đình hình thành trên cơ sở:","Hôn nhân và quan hệ huyết thống","Chỉ quan hệ kinh tế","Chỉ tôn giáo","Chỉ pháp luật",["1. Khái niệm gia đình","Cơ sở hình thành gia đình là hai mối quan hệ cơ bản, quan hệ hôn nhân (vợ và chồng) và quan hệ huyết thống (cha mẹ và con cái...).",157]],[7,1,"Gia đình được xem là gì của xã hội?","Tế bào","Cơ quan quyền lực","Giai cấp","Tổ chức chính trị",["11. Phương hướng xây dựng, phát triển gia đình Việt Nam","Tất cả nhằm hướng tới thực hiện mục tiêu làm cho gia đình thực sự là tế bào lành mạnh của xã hội, là tổ ấm của mỗi người.",176]],[7,2,"Chức năng nuôi dưỡng, giáo dục của gia đình có ảnh hưởng:","Lâu dài, toàn diện đến cuộc đời mỗi thành viên","Chỉ ở tuổi thơ","Không đáng kể","Chỉ với con trai",["3. Chức năng cơ bản của gia đình","Chức năng nuôi dưỡng, giáo dục có ảnh hưởng lâu dài và toàn diện đến cuộc đời của mỗi thành viên, từ lúc lọt lòng cho đến khi trưởng thành và tuổi già.",162]],[7,2,"Chức năng tái sản xuất ra con người quyết định:","Mật độ dân cư và nguồn lực lao động của quốc gia","Thu nhập quốc gia","Lãnh thổ quốc gia","Hệ thống pháp luật",["3. Chức năng cơ bản của gia đình","Bởi vì, thực hiện chức năng này quyết định đến mật độ dân cư và nguồn lực lao động của một quốc gia và quốc tế, một yếu tố cấu thành của tồn tại xã hội.",161]],[7,2,"Chế độ hôn nhân tiến bộ có đặc điểm:","Tự nguyện, một vợ một chồng, vợ chồng bình đẳng","Cha mẹ quyết định","Đa thê","Hôn nhân vì địa vị",["7. Chế độ hôn nhân tiến bộ","Trong thời kỳ quá độ lên chủ nghĩa xã hội, thực hiện chế độ hôn nhân một vợ một chồng là thực hiện sự giải phóng đối với phụ nữ, thực hiện sự bình đẳng, tôn trọng lẫn nhau giữa vợ và chồng.",168]],[7,3,"Xu hướng biến đổi quy mô gia đình Việt Nam hiện nay là:","Quy mô nhỏ hơn, gia đình hạt nhân phổ biến","Quy mô lớn hơn, nhiều thế hệ","Không đổi","Chỉ còn gia đình đơn thân",["8. Biến đổi về quy mô, kết cấu gia đình Việt Nam","Gia đình Việt Nam hiện đại chỉ có hai thế hệ cùng sống chung: cha mẹ - con cái, số con trong gia đình cũng không nhiều như trước, cá biệt còn có số ít gia đình đơn thân, nhưng phổ biến nhất vẫn là loại hình gia đình hạt nhân quy mô nhỏ.",169]],[7,3,"Các chức năng cơ bản của gia đình gồm:","Tái sản xuất con người; nuôi dưỡng, giáo dục; kinh tế, tiêu dùng; tâm sinh lý, tình cảm","Quản lý nhà nước; quân sự; tư pháp; ngoại giao","Sản xuất công nghiệp; xuất khẩu; ngân hàng; thuế","Giáo dục đại học; y tế; vận tải; truyền thông",["2. Vị trí của gia đình trong xã hội","Với việc sản xuất ra tư liệu tiêu dùng, tư liệu sản xuất, tái sản xuất ra con người, gia đình như một tế bào tự nhiên, là một đơn vị cơ sở để tạo nên cơ thể - xã hội.",159]],[2,2,"Điền từ thích hợp vào chỗ trống: Chỉ có ____ là giai cấp duy nhất không có lợi ích riêng với nghĩa là tư hữu.","giai cấp công nhân","giai cấp tư sản","đội ngũ trí thức","giai cấp nông dân",["2. Nội dung sứ mệnh lịch sử của GCCN","Chỉ có giai cấp công nhân là giai cấp duy nhất không có lợi ích riêng với nghĩa là tư hữu.",35]],[2,2,"Điền từ thích hợp vào chỗ trống: Vì thế, ____ công nhân đại diện cho phương thức sản xuất tiên tiến và lực lượng sản xuất hiện đại.","giai cấp","tín ngưỡng","nhà nước","tôn giáo",["3. Điều kiện quy định và thực hiện sứ mệnh","Vì thế, giai cấp công nhân đại diện cho phương thức sản xuất tiên tiến và lực lượng sản xuất hiện đại.",37]],[2,3,"Điền từ thích hợp vào chỗ trống: Thiết lập nhà nước kiểu mới, mang bản chất giai cấp công nhân, xây dựng nền dân chủ ____, thực hiện quyền lực của nhân dân, quyền dân chủ và làm chủ xã hội của tuyệt đại đa số nhân dân lao động.","xã hội chủ nghĩa","tư bản chủ nghĩa","cộng sản chủ nghĩa","phong kiến",["2. Nội dung sứ mệnh lịch sử của GCCN","Thiết lập nhà nước kiểu mới, mang bản chất giai cấp công nhân, xây dựng nền dân chủ xã hội chủ nghĩa, thực hiện quyền lực của nhân dân, quyền dân chủ và làm chủ xã hội của tuyệt đại đa số nhân dân lao động.",36]],[2,2,"Điền từ thích hợp vào chỗ trống: Mâu thuẫn đó cho thấy tính chất đối kháng không thể điều hòa giữa giai cấp công nhân (giai cấp vô sản) với ____ trong phương thức sản xuất tư bản chủ nghĩa và trong chế độ tư bản chủ nghĩa.","giai cấp tư sản","kinh tế tri thức","cách mạng công nghiệp","phong trào công nhân",["1. Khái niệm và đặc điểm của GCCN","Mâu thuẫn đó cho thấy tính chất đối kháng không thể điều hòa giữa giai cấp công nhân (giai cấp vô sản) với giai cấp tư sản trong phương thức sản xuất tư bản chủ nghĩa và trong chế độ tư bản chủ nghĩa.",33]],[2,3,"Điền từ thích hợp vào chỗ trống: Sự phát triển về số lượng phải gắn liền với sự phát triển về chất lượng của giai cấp công nhân hiện đại, đảm bảo cho giai cấp công nhân thực hiện được ____ của mình.","sứ mệnh lịch sử","tư liệu sản xuất","giai cấp vô sản","phong trào yêu nước",["3. Điều kiện quy định và thực hiện sứ mệnh","Sự phát triển về số lượng phải gắn liền với sự phát triển về chất lượng của giai cấp công nhân hiện đại, đảm bảo cho giai cấp công nhân thực hiện được sứ mệnh lịch sử của mình.",38]],[2,2,"Điền từ thích hợp vào chỗ trống: Đối diện với nhà ____, công nhân là những người lao động tự do, với nghĩa là tự do bán sức lao động của mình để kiếm sống.","tư bản","chính đảng","tiên phong","thuộc địa",["1. Khái niệm và đặc điểm của GCCN","Đối diện với nhà tư bản, công nhân là những người lao động tự do, với nghĩa là tự do bán sức lao động của mình để kiếm sống.",33]],[2,2,"Điền từ thích hợp vào chỗ trống: Tri thức hóa và trí thức hóa công nhân là ____ mặt của cùng một quá trình, của xu hướng trí tuệ hóa đối với công nhân và giai cấp công nhân.","hai","sáu","năm","ba",["4. GCCN hiện nay","Tri thức hóa và trí thức hóa công nhân là hai mặt của cùng một quá trình, của xu hướng trí tuệ hóa đối với công nhân và giai cấp công nhân.",41]],[2,2,"Điền từ thích hợp vào chỗ trống: Sự lớn mạnh của ____ công nhân là một điều kiện tiên quyết bảo đảm thành công của công cuộc đổi mới, công nghiệp hóa, hiện đại hóa đất nước.","giai cấp","dân tộc","gia đình","tôn giáo",["8. Phương hướng và giải pháp xây dựng GCCN Việt Nam","Sự lớn mạnh của giai cấp công nhân là một điều kiện tiên quyết bảo đảm thành công của công cuộc đổi mới, công nghiệp hóa, hiện đại hóa đất nước.",52]],[2,2,"Điền từ thích hợp vào chỗ trống: Bốn là, đào tạo, bồi dưỡng, nâng cao trình độ mọi mặt cho công nhân, không ngừng trí thức hóa ____ công nhân.","giai cấp","tôn giáo","dân tộc","gia đình",["8. Phương hướng và giải pháp xây dựng GCCN Việt Nam","Bốn là, đào tạo, bồi dưỡng, nâng cao trình độ mọi mặt cho công nhân, không ngừng trí thức hóa giai cấp công nhân.",52]],[2,2,"Điền từ thích hợp vào chỗ trống: Mâu thuẫn cơ bản này thể hiện về mặt xã hội là mâu thuẫn về lợi ích giữa giai cấp công nhân và ____.","giai cấp tư sản","phong trào công nhân","sứ mệnh lịch sử","giá trị thặng dư",["1. Khái niệm và đặc điểm của GCCN","Mâu thuẫn cơ bản này thể hiện về mặt xã hội là mâu thuẫn về lợi ích giữa giai cấp công nhân và giai cấp tư sản.",33]],[2,1,"Điền từ thích hợp vào chỗ trống: Quy luật chung, phổ biến cho sự ra đời của Đảng Cộng sản là sự kết hợp giữa ____, tức chủ nghĩa Mác - Lênin với phong trào công nhân.","chủ nghĩa xã hội khoa học","giai cấp vô sản","trung lưu hóa","quan hệ sản xuất",["3. Điều kiện quy định và thực hiện sứ mệnh","Quy luật chung, phổ biến cho sự ra đời của Đảng Cộng sản là sự kết hợp giữa chủ nghĩa xã hội khoa học, tức chủ nghĩa Mác - Lênin với phong trào công nhân.",39]],[2,2,"Điền từ thích hợp vào chỗ trống: Công nghiệp hóa vẫn là cơ sở khách quan để ____ công nhân hiện đại phát triển mạnh mẽ cả về số lượng và chất lượng.","giai cấp","dân tộc","tín ngưỡng","nhà nước",["4. GCCN hiện nay","Công nghiệp hóa vẫn là cơ sở khách quan để giai cấp công nhân hiện đại phát triển mạnh mẽ cả về số lượng và chất lượng.",40]],[2,1,"Điền từ thích hợp vào chỗ trống: Mâu thuẫn cơ bản của phương thức sản xuất tư bản chủ nghĩa là mâu thuẫn giữa ____ xã hội hóa ngày càng rộng lớn với quan hệ sản xuất tư bản chủ nghĩa dựa trên chế độ tư hữu tư bản chủ nghĩa về tư liệu sản xuất.","lực lượng sản xuất","cách mạng công nghiệp","sứ mệnh lịch sử","phong trào công nhân",["1. Khái niệm và đặc điểm của GCCN","Mâu thuẫn cơ bản của phương thức sản xuất tư bản chủ nghĩa là mâu thuẫn giữa lực lượng sản xuất xã hội hóa ngày càng rộng lớn với quan hệ sản xuất tư bản chủ nghĩa dựa trên chế độ tư hữu tư bản chủ nghĩa về tư liệu sản xuất.",33]],[2,3,"Điền từ thích hợp vào chỗ trống: Trong bối cảnh mới của ____, hội nhập quốc tế và Cách mạng công nghiệp lần thứ tư, công nhân hiện đại cũng tăng nhanh về số lượng, thay đổi lớn về cơ cấu trong nền sản xuất hiện đại.","toàn cầu hóa","đô thị hóa","công nghiệp hóa","hiện đại hóa",["4. GCCN hiện nay","Trong bối cảnh mới của toàn cầu hóa, hội nhập quốc tế và Cách mạng công nghiệp lần thứ tư, công nhân hiện đại cũng tăng nhanh về số lượng, thay đổi lớn về cơ cấu trong nền sản xuất hiện đại.",42]],[2,3,"Điền từ thích hợp vào chỗ trống: Đồng thời xác định rõ: “Xây dựng ____ công nhân hiện đại, lớn mạnh; nâng cao bản lĩnh chính trị, trình độ học vấn, chuyên môn, kỹ năng nghề nghiệp, tác phong công nghiệp, kỷ luật lao động thích ứng với cuộc Cách mạng công nghiệp lần thứ tư.","giai cấp","tín ngưỡng","dân tộc","tôn giáo",["8. Phương hướng và giải pháp xây dựng GCCN Việt Nam","Đồng thời xác định rõ: “Xây dựng giai cấp công nhân hiện đại, lớn mạnh; nâng cao bản lĩnh chính trị, trình độ học vấn, chuyên môn, kỹ năng nghề nghiệp, tác phong công nghiệp, kỷ luật lao động thích ứng với cuộc Cách mạng công nghiệp lần thứ tư.",51]],[2,2,"Điền từ thích hợp vào chỗ trống: Sự lãnh đạo của Đảng và quản lý của Nhà nước có vai trò quyết định, công đoàn có vai trò quan trọng trực tiếp trong chăm lo xây dựng ____ công nhân.","giai cấp","tín ngưỡng","dân tộc","tôn giáo",["8. Phương hướng và giải pháp xây dựng GCCN Việt Nam","Sự lãnh đạo của Đảng và quản lý của Nhà nước có vai trò quyết định, công đoàn có vai trò quan trọng trực tiếp trong chăm lo xây dựng giai cấp công nhân.",53]],[2,2,"Điền từ thích hợp vào chỗ trống: Giai cấp công nhân Việt Nam phát triển chậm vì nó sinh ra và lớn lên ở một nước thuộc địa, nửa ____, dưới ách thống trị của thực dân Pháp.","phong kiến","chiếm hữu nô lệ","tư bản chủ nghĩa","xã hội chủ nghĩa",["6. Đặc điểm của GCCN Việt Nam","Giai cấp công nhân Việt Nam phát triển chậm vì nó sinh ra và lớn lên ở một nước thuộc địa, nửa phong kiến, dưới ách thống trị của thực dân Pháp.",45]],[2,2,"Điền từ thích hợp vào chỗ trống: Tình trạng nghèo khổ của giai cấp công nhân dưới chủ nghĩa tư bản là hậu quả của sự bóc lột, áp bức mà ____ và chủ nghĩa tư bản tạo ra đối với công nhân, đó là trạng thái mà cách mạng sẽ xóa bỏ để giải phóng giai cấp công nhân và giải phóng xã hội.","giai cấp tư sản","phong trào công nhân","giá trị thặng dư","phong trào yêu nước",["3. Điều kiện quy định và thực hiện sứ mệnh","Tình trạng nghèo khổ của giai cấp công nhân dưới chủ nghĩa tư bản là hậu quả của sự bóc lột, áp bức mà giai cấp tư sản và chủ nghĩa tư bản tạo ra đối với công nhân, đó là trạng thái mà cách mạng sẽ xóa bỏ để giải phóng giai cấp công nhân và giải phóng xã hội.",38]],[2,3,"Điền từ thích hợp vào chỗ trống: Lao động sống của công nhân là nguồn gốc của giá trị thặng dư và sự giàu có của ____ tư sản cũng chủ yếu nhờ vào việc bóc lột được ngày càng nhiều hơn giá trị thặng dư.","giai cấp","nhà nước","tín ngưỡng","gia đình",["1. Khái niệm và đặc điểm của GCCN","Lao động sống của công nhân là nguồn gốc của giá trị thặng dư và sự giàu có của giai cấp tư sản cũng chủ yếu nhờ vào việc bóc lột được ngày càng nhiều hơn giá trị thặng dư.",33]],[2,3,"Điền từ thích hợp vào chỗ trống: Đại bộ phận công nhân Việt Nam xuất thân từ nông dân và các tầng lớp lao động khác, cùng chung lợi ích, cùng chung nguyện vọng và khát vọng đấu tranh cho độc lập tự do để giải phóng ____ và phát triển đất nước.","dân tộc","gia đình","tôn giáo","nhà nước",["6. Đặc điểm của GCCN Việt Nam","Đại bộ phận công nhân Việt Nam xuất thân từ nông dân và các tầng lớp lao động khác, cùng chung lợi ích, cùng chung nguyện vọng và khát vọng đấu tranh cho độc lập tự do để giải phóng dân tộc và phát triển đất nước.",46]],[2,1,"Điền từ thích hợp vào chỗ trống: Thực tế đó cho thấy, xung đột về lợi ích cơ bản giữa ____ và giai cấp công nhân (giữa tư bản và lao động) vẫn tồn tại, vẫn là nguyên nhân cơ bản, sâu xa của đấu tranh giai cấp trong xã hội hiện đại ngày nay.","giai cấp tư sản","phong trào yêu nước","kinh tế tri thức","giá trị thặng dư",["4. GCCN hiện nay","Thực tế đó cho thấy, xung đột về lợi ích cơ bản giữa giai cấp tư sản và giai cấp công nhân (giữa tư bản và lao động) vẫn tồn tại, vẫn là nguyên nhân cơ bản, sâu xa của đấu tranh giai cấp trong xã hội hiện đại ngày nay.",41]],[2,2,"Điền từ thích hợp vào chỗ trống: Trước hết, ____ tư sản sản sinh ra những người đào huyệt chôn chính nó.","giai cấp","tín ngưỡng","gia đình","nhà nước",["3. Điều kiện quy định và thực hiện sứ mệnh","Trước hết, giai cấp tư sản sản sinh ra những người đào huyệt chôn chính nó.",37]],[2,2,"Điền từ thích hợp vào chỗ trống: Ăngghen, công nhân công nghiệp công xưởng là bộ phận tiêu biểu cho ____ công nhân hiện đại.","giai cấp","tôn giáo","nhà nước","tín ngưỡng",["1. Khái niệm và đặc điểm của GCCN","Ăngghen, công nhân công nghiệp công xưởng là bộ phận tiêu biểu cho giai cấp công nhân hiện đại.",32]],[2,2,"Điền từ thích hợp vào chỗ trống: Giai cấp công nhân là con đẻ, sản phẩm của nền ____, có tính xã hội hóa ngày càng cao, là chủ thể của quá trình sản xuất vật chất hiện đại.","đại công nghiệp","toàn cầu hóa","Đảng Cộng sản","trung lưu hóa",["3. Điều kiện quy định và thực hiện sứ mệnh","Giai cấp công nhân là con đẻ, sản phẩm của nền đại công nghiệp, có tính xã hội hóa ngày càng cao, là chủ thể của quá trình sản xuất vật chất hiện đại.",37]],[2,2,"Điền từ thích hợp vào chỗ trống: Chỉ với sự phát triển về số lượng và chất lượng, đặc biệt về chất lượng, ____ mới có thể thực hiện được sứ mệnh lịch sử của giai cấp mình.","giai cấp công nhân","đội ngũ trí thức","giai cấp tư sản","giai cấp nông dân",["3. Điều kiện quy định và thực hiện sứ mệnh","Chỉ với sự phát triển về số lượng và chất lượng, đặc biệt về chất lượng, giai cấp công nhân mới có thể thực hiện được sứ mệnh lịch sử của giai cấp mình.",39]],[2,2,"Điền từ thích hợp vào chỗ trống: Bản thân ____ Việt Nam cũng có những biến đổi từ cơ cấu xã hội - nghề nghiệp, trình độ học vấn và tay nghề bậc thợ, đến đời sống, lối sống, tâm lý, ý thức.","giai cấp công nhân","đội ngũ trí thức","giai cấp nông dân","giai cấp tư sản",["6. Đặc điểm của GCCN Việt Nam","Bản thân giai cấp công nhân Việt Nam cũng có những biến đổi từ cơ cấu xã hội - nghề nghiệp, trình độ học vấn và tay nghề bậc thợ, đến đời sống, lối sống, tâm lý, ý thức.",47]],[2,2,"Điền từ thích hợp vào chỗ trống: Ăngghen chỉ rõ, đó là ____ của những người lao động không có sở hữu tư liệu sản xuất chủ yếu của xã hội.","giai cấp","tín ngưỡng","tôn giáo","dân tộc",["1. Khái niệm và đặc điểm của GCCN","Ăngghen chỉ rõ, đó là giai cấp của những người lao động không có sở hữu tư liệu sản xuất chủ yếu của xã hội.",33]],[2,1,"Điền từ thích hợp vào chỗ trống: Mô tả quá trình phát triển của giai cấp công nhân, ____ và Ph.","C. Mác","Ph.Ăngghen","V.I.Lênin","Hồ Chí Minh",["1. Khái niệm và đặc điểm của GCCN","Mô tả quá trình phát triển của giai cấp công nhân, C. Mác và Ph.",32]],[2,3,"Điền từ thích hợp vào chỗ trống: Thông qua sự phát triển này có thể thấy sự lớn mạnh của ____ cùng với quy mô phát triển của nền sản xuất vật chất hiện đại trên nền tảng của công nghiệp, của kỹ thuật và công nghệ.","giai cấp công nhân","giai cấp nông dân","giai cấp tư sản","đội ngũ trí thức",["3. Điều kiện quy định và thực hiện sứ mệnh","Thông qua sự phát triển này có thể thấy sự lớn mạnh của giai cấp công nhân cùng với quy mô phát triển của nền sản xuất vật chất hiện đại trên nền tảng của công nghiệp, của kỹ thuật và công nghệ.",38]],[2,3,"Điền từ thích hợp vào chỗ trống: Do lao động bằng phương thức công nghiệp ngày càng hiện đại, ____ công nhân là người sản xuất ra của cải vật chất chủ yếu cho xã hội, làm giàu cho xã hội, có vai trò quyết định sự phát triển của xã hội hiện đại.","giai cấp","nhà nước","dân tộc","gia đình",["3. Điều kiện quy định và thực hiện sứ mệnh","Do lao động bằng phương thức công nghiệp ngày càng hiện đại, giai cấp công nhân là người sản xuất ra của cải vật chất chủ yếu cho xã hội, làm giàu cho xã hội, có vai trò quyết định sự phát triển của xã hội hiện đại.",37]],[2,2,"Điền từ thích hợp vào chỗ trống: Các giá trị như lao động, sáng tạo, công bằng, ____, bình đẳng, tự do vẫn là những giá trị được nhân loại thừa nhận và phấn đấu thực hiện.","dân chủ","độc tài","pháp quyền","chuyên chính",["5. Thực hiện sứ mệnh của GCCN trên thế giới hiện nay","Các giá trị như lao động, sáng tạo, công bằng, dân chủ, bình đẳng, tự do vẫn là những giá trị được nhân loại thừa nhận và phấn đấu thực hiện.",44]],[2,3,"Điền từ thích hợp vào chỗ trống: Xây dựng và củng cố ý thức hệ tiên tiến của ____, đó là chủ nghĩa Mác - Lênin, đấu tranh để khắc phục ý thức hệ tư sản và các tàn dư còn sót lại của các hệ tư tưởng cũ.","giai cấp công nhân","giai cấp nông dân","giai cấp tư sản","đội ngũ trí thức",["2. Nội dung sứ mệnh lịch sử của GCCN","Xây dựng và củng cố ý thức hệ tiên tiến của giai cấp công nhân, đó là chủ nghĩa Mác - Lênin, đấu tranh để khắc phục ý thức hệ tư sản và các tàn dư còn sót lại của các hệ tư tưởng cũ.",36]],[2,1,"Điền từ thích hợp vào chỗ trống: ____ - đội tiên phong của giai cấp công nhân ra đời và đảm nhận vai trò lãnh đạo cuộc cách mạng là dấu hiệu về sự trưởng thành vượt bậc của giai cấp công nhân với tư cách là giai cấp cách mạng.","Đảng Cộng sản","sức thất nghiệp","toàn cầu hóa","công nghiệp hóa",["3. Điều kiện quy định và thực hiện sứ mệnh","Đảng Cộng sản - đội tiên phong của giai cấp công nhân ra đời và đảm nhận vai trò lãnh đạo cuộc cách mạng là dấu hiệu về sự trưởng thành vượt bậc của giai cấp công nhân với tư cách là giai cấp cách mạng.",39]],[2,1,"Điền từ thích hợp vào chỗ trống: Xây dựng giai cấp công nhân lớn mạnh gắn liền với xây dựng Đảng trong sạch, vững mạnh về chính trị, tư tưởng, tổ chức và đạo đức; xây dựng tổ chức Công đoàn, Đoàn Thanh niên Cộng sản ____ và các tổ chức chính trị - xã hội khác trong giai cấp công nhân.","Hồ Chí Minh","C.Mác","Ph.Ăngghen","V.I.Lênin",["8. Phương hướng và giải pháp xây dựng GCCN Việt Nam","Xây dựng giai cấp công nhân lớn mạnh gắn liền với xây dựng Đảng trong sạch, vững mạnh về chính trị, tư tưởng, tổ chức và đạo đức; xây dựng tổ chức Công đoàn, Đoàn Thanh niên Cộng sản Hồ Chí Minh và các tổ chức chính trị - xã hội khác trong giai cấp công nhân.",53]],[2,3,"Điền từ thích hợp vào chỗ trống: Không chỉ ở các nước xã hội chủ nghĩa mà ở nhiều nước tư bản chủ nghĩa cuộc đấu tranh của ____ và nhân dân lao động vì những giá trị cao cả đó đã đạt được nhiều tiến bộ xã hội quan trọng.","giai cấp công nhân","đội ngũ trí thức","giai cấp nông dân","giai cấp tư sản",["5. Thực hiện sứ mệnh của GCCN trên thế giới hiện nay","Không chỉ ở các nước xã hội chủ nghĩa mà ở nhiều nước tư bản chủ nghĩa cuộc đấu tranh của giai cấp công nhân và nhân dân lao động vì những giá trị cao cả đó đã đạt được nhiều tiến bộ xã hội quan trọng.",44]],[2,2,"Điền từ thích hợp vào chỗ trống: Đại hội đại biểu toàn quốc lần thứ XIII của Đảng khẳng định: “Giữ vững bản chất ____ công nhân của Đảng, kiên định các nguyên tắc xây dựng của Đảng”.","giai cấp","tôn giáo","tín ngưỡng","dân tộc",["8. Phương hướng và giải pháp xây dựng GCCN Việt Nam","Đại hội đại biểu toàn quốc lần thứ XIII của Đảng khẳng định: “Giữ vững bản chất giai cấp công nhân của Đảng, kiên định các nguyên tắc xây dựng của Đảng”.",51]],[2,2,"Điền từ thích hợp vào chỗ trống: Đảng Cộng sản đại biểu trung thành cho lợi ích của ____, của dân tộc và xã hội.","giai cấp công nhân","giai cấp nông dân","giai cấp tư sản","đội ngũ trí thức",["3. Điều kiện quy định và thực hiện sứ mệnh","Đảng Cộng sản đại biểu trung thành cho lợi ích của giai cấp công nhân, của dân tộc và xã hội.",39]],[2,2,"Điền từ thích hợp vào chỗ trống: Nói về sứ mệnh lịch sử của ____, C.Mác đã viết: “Thực hiện sự nghiệp giải phóng thế giới ấy, - đó là sứ mệnh lịch sử của giai cấp vô sản hiện đại”.","giai cấp công nhân","giai cấp nông dân","giai cấp tư sản","đội ngũ trí thức",["2. Nội dung sứ mệnh lịch sử của GCCN","Nói về sứ mệnh lịch sử của giai cấp công nhân, C.Mác đã viết: “Thực hiện sự nghiệp giải phóng thế giới ấy, - đó là sứ mệnh lịch sử của giai cấp vô sản hiện đại”.",35]],[2,1,"Điền từ thích hợp vào chỗ trống: ____ tư bản chủ nghĩa với chế độ sở hữu tư nhân tư bản chủ nghĩa sản sinh ra tình trạng bóc lột này vẫn tồn tại.","Quan hệ sản xuất","sứ mệnh lịch sử","cách mạng công nghiệp","phong trào công nhân",["4. GCCN hiện nay","Quan hệ sản xuất tư bản chủ nghĩa với chế độ sở hữu tư nhân tư bản chủ nghĩa sản sinh ra tình trạng bóc lột này vẫn tồn tại.",41]],[2,2,"Điền từ thích hợp vào chỗ trống: Cũng giống như thế kỷ XIX, ở các nước ____ hiện nay, công nhân vẫn bị giai cấp tư sản và chủ nghĩa tư bản bóc lột giá trị thặng dư.","tư bản chủ nghĩa","chiếm hữu nô lệ","cộng sản chủ nghĩa","xã hội chủ nghĩa",["4. GCCN hiện nay","Cũng giống như thế kỷ XIX, ở các nước tư bản chủ nghĩa hiện nay, công nhân vẫn bị giai cấp tư sản và chủ nghĩa tư bản bóc lột giá trị thặng dư.",40]],[2,2,"Điền từ thích hợp vào chỗ trống: Quyền định đoạt quá trình sản xuất, quyền quyết định cơ chế phân phối lợi nhuận vẫn thuộc về ____.","giai cấp tư sản","đội ngũ trí thức","giai cấp công nhân","giai cấp nông dân",["4. GCCN hiện nay","Quyền định đoạt quá trình sản xuất, quyền quyết định cơ chế phân phối lợi nhuận vẫn thuộc về giai cấp tư sản.",42]],[2,3,"Điền từ thích hợp vào chỗ trống: Giai cấp công nhân Việt Nam ra đời và phát triển gắn liền với chính sách khai thác ____ của thực dân Pháp ở Việt Nam.","thuộc địa","bóc lột","chính đảng","tiên phong",["6. Đặc điểm của GCCN Việt Nam","Giai cấp công nhân Việt Nam ra đời và phát triển gắn liền với chính sách khai thác thuộc địa của thực dân Pháp ở Việt Nam.",45]],[2,3,"Điền từ thích hợp vào chỗ trống: Là con đẻ của nền sản xuất đại công nghiệp, ____ có những phẩm chất của một giai cấp tiên tiến, giai cấp cách mạng như: tính tổ chức và kỷ luật, tự giác và đoàn kết trong cuộc đấu tranh tự giải phóng mình và giải phóng xã hội.","giai cấp công nhân","giai cấp tư sản","giai cấp nông dân","đội ngũ trí thức",["3. Điều kiện quy định và thực hiện sứ mệnh","Là con đẻ của nền sản xuất đại công nghiệp, giai cấp công nhân có những phẩm chất của một giai cấp tiên tiến, giai cấp cách mạng như: tính tổ chức và kỷ luật, tự giác và đoàn kết trong cuộc đấu tranh tự giải phóng mình và giải phóng xã hội.",38]],[2,3,"Điền từ thích hợp vào chỗ trống: Ăngghen đã không những đưa lại quan niệm khoa học về ____ mà còn làm sáng tỏ những đặc điểm quan trọng của nó với tư cách là một giai cấp cách mạng có sứ mệnh lịch sử thế giới.","giai cấp công nhân","giai cấp nông dân","đội ngũ trí thức","giai cấp tư sản",["1. Khái niệm và đặc điểm của GCCN","Ăngghen đã không những đưa lại quan niệm khoa học về giai cấp công nhân mà còn làm sáng tỏ những đặc điểm quan trọng của nó với tư cách là một giai cấp cách mạng có sứ mệnh lịch sử thế giới.",34]],[2,2,"Điền từ thích hợp vào chỗ trống: Sự sụp đổ của ____ và thắng lợi của giai cấp vô sản đều là tất yếu như nhau 1”.","giai cấp tư sản","giai cấp công nhân","giai cấp nông dân","đội ngũ trí thức",["3. Điều kiện quy định và thực hiện sứ mệnh","Sự sụp đổ của giai cấp tư sản và thắng lợi của giai cấp vô sản đều là tất yếu như nhau 1”.",37]],[2,2,"Điền từ thích hợp vào chỗ trống: Giai cấp công nhân vẫn bị bóc lột nặng nề bởi các chủ thể mới trong ____ như các tập đoàn xuyên quốc gia, nhà nước của các nước tư bản phát triển...","toàn cầu hóa","công nghiệp hóa","hiện đại hóa","đô thị hóa",["4. GCCN hiện nay","Giai cấp công nhân vẫn bị bóc lột nặng nề bởi các chủ thể mới trong toàn cầu hóa như các tập đoàn xuyên quốc gia, nhà nước của các nước tư bản phát triển...",42]],[2,3,"Điền từ thích hợp vào chỗ trống: Đặc biệt quan tâm xây dựng thế hệ công nhân trẻ, có học vấn, chuyên môn và kỹ năng nghề nghiệp cao, ngang tầm khu vực và quốc tế, có lập trường giai cấp và bản lĩnh chính trị vững vàng, trở thành bộ phận nòng cốt của ____.","giai cấp công nhân","giai cấp tư sản","giai cấp nông dân","đội ngũ trí thức",["8. Phương hướng và giải pháp xây dựng GCCN Việt Nam","Đặc biệt quan tâm xây dựng thế hệ công nhân trẻ, có học vấn, chuyên môn và kỹ năng nghề nghiệp cao, ngang tầm khu vực và quốc tế, có lập trường giai cấp và bản lĩnh chính trị vững vàng, trở thành bộ phận nòng cốt của giai cấp công nhân.",52]],[2,2,"Điền từ thích hợp vào chỗ trống: Hoàn toàn không phải vì nghèo khổ mà ____ là một giai cấp cách mạng.","giai cấp công nhân","đội ngũ trí thức","giai cấp nông dân","giai cấp tư sản",["3. Điều kiện quy định và thực hiện sứ mệnh","Hoàn toàn không phải vì nghèo khổ mà giai cấp công nhân là một giai cấp cách mạng.",38]],[2,2,"Điền từ thích hợp vào chỗ trống: Những đặc điểm ấy chính là những phẩm chất cần thiết để ____ có vai trò lãnh đạo cách mạng.","giai cấp công nhân","đội ngũ trí thức","giai cấp tư sản","giai cấp nông dân",["1. Khái niệm và đặc điểm của GCCN","Những đặc điểm ấy chính là những phẩm chất cần thiết để giai cấp công nhân có vai trò lãnh đạo cách mạng.",34]],[2,1,"Điền từ thích hợp vào chỗ trống: Giai cấp công nhân được trang bị lý luận tiên tiến là chủ nghĩa Mác - Lênin, có đội tiền phong là ____ dẫn dắt.","Đảng Cộng sản","công nghiệp hóa","trí tuệ hóa","sức thất nghiệp",["3. Điều kiện quy định và thực hiện sứ mệnh","Giai cấp công nhân được trang bị lý luận tiên tiến là chủ nghĩa Mác - Lênin, có đội tiền phong là Đảng Cộng sản dẫn dắt.",38]],[2,3,"Điền từ thích hợp vào chỗ trống: Trong quan hệ sản xuất ____, “giai cấp vô sản là giai cấp những công nhân làm thuê hiện đại, vì mất các tư liệu sản xuất của bản thân, nên buộc phải bán sức lao động của mình để sống”.","tư bản chủ nghĩa","chiếm hữu nô lệ","cộng sản chủ nghĩa","xã hội chủ nghĩa",["1. Khái niệm và đặc điểm của GCCN","Trong quan hệ sản xuất tư bản chủ nghĩa, “giai cấp vô sản là giai cấp những công nhân làm thuê hiện đại, vì mất các tư liệu sản xuất của bản thân, nên buộc phải bán sức lao động của mình để sống”.",32]],[2,3,"Điền từ thích hợp vào chỗ trống: Phong trào cộng sản và công nhân ở nhiều nước vẫn luôn là lực lượng đi đầu trong các cuộc đấu tranh vì hòa bình, hợp tác và phát triển, vì dân sinh, ____, tiến bộ xã hội và chủ nghĩa xã hội.","dân chủ","độc tài","chuyên chính","pháp quyền",["4. GCCN hiện nay","Phong trào cộng sản và công nhân ở nhiều nước vẫn luôn là lực lượng đi đầu trong các cuộc đấu tranh vì hòa bình, hợp tác và phát triển, vì dân sinh, dân chủ, tiến bộ xã hội và chủ nghĩa xã hội.",41]],[2,3,"Điền từ thích hợp vào chỗ trống: Năm là, xây dựng ____ lớn mạnh là trách nhiệm của cả hệ thống chính trị, của toàn xã hội và sự nỗ lực vươn lên của bản thân mỗi người công nhân, sự tham gia đóng góp tích cực của người sử dụng lao động.","giai cấp công nhân","đội ngũ trí thức","giai cấp tư sản","giai cấp nông dân",["8. Phương hướng và giải pháp xây dựng GCCN Việt Nam","Năm là, xây dựng giai cấp công nhân lớn mạnh là trách nhiệm của cả hệ thống chính trị, của toàn xã hội và sự nỗ lực vươn lên của bản thân mỗi người công nhân, sự tham gia đóng góp tích cực của người sử dụng lao động.",53]],[2,2,"Điền từ thích hợp vào chỗ trống: Tăng cường tuyên truyền, giáo dục chính trị, tư tưởng cho ____.","giai cấp công nhân","giai cấp nông dân","đội ngũ trí thức","giai cấp tư sản",["8. Phương hướng và giải pháp xây dựng GCCN Việt Nam","Tăng cường tuyên truyền, giáo dục chính trị, tư tưởng cho giai cấp công nhân.",51]],[2,2,"Điền từ thích hợp vào chỗ trống: Về mặt hình thức, họ không còn là “vô sản” nữa và có thể được “____” về mức sống, nhưng về thực chất, ở các nước tư bản, do không chiếm được tỷ lệ sở hữu cao nên quá trình sản xuất và phân chia lợi nhuận vẫn bị phụ thuộc vào những cổ đông lớn.","trung lưu hóa","sức thất nghiệp","đại công nghiệp","Đảng Cộng sản",["4. GCCN hiện nay","Về mặt hình thức, họ không còn là “vô sản” nữa và có thể được “trung lưu hóa” về mức sống, nhưng về thực chất, ở các nước tư bản, do không chiếm được tỷ lệ sở hữu cao nên quá trình sản xuất và phân chia lợi nhuận vẫn bị phụ thuộc vào những cổ đông lớn.",42]],[2,2,"Điền từ thích hợp vào chỗ trống: Cũng vì thế, đa số các nước đang phát triển hiện nay đều thực hiện chiến lược ____ nhằm đẩy mạnh tốc độ, chất lượng và quy mô phát triển.","công nghiệp hóa","hiện đại hóa","đô thị hóa","toàn cầu hóa",["4. GCCN hiện nay","Cũng vì thế, đa số các nước đang phát triển hiện nay đều thực hiện chiến lược công nghiệp hóa nhằm đẩy mạnh tốc độ, chất lượng và quy mô phát triển.",40]],[2,3,"Điền từ thích hợp vào chỗ trống: Trong môi trường kinh tế - xã hội đổi mới, trong đà phát triển mạnh mẽ của cuộc Cách mạng công nghiệp lần thứ tư, ____ Việt Nam đứng trước thời cơ phát triển và những thách thức nguy cơ trong phát triển.","giai cấp công nhân","đội ngũ trí thức","giai cấp tư sản","giai cấp nông dân",["6. Đặc điểm của GCCN Việt Nam","Trong môi trường kinh tế - xã hội đổi mới, trong đà phát triển mạnh mẽ của cuộc Cách mạng công nghiệp lần thứ tư, giai cấp công nhân Việt Nam đứng trước thời cơ phát triển và những thách thức nguy cơ trong phát triển.",47]],[2,2,"Điền từ thích hợp vào chỗ trống: Ăngghen đã nêu rõ: “Cùng với sự phát triển của ____, chính cái nền tảng trên đó giai cấp tư sản đã sản xuất và chiếm hữu sản phẩm của nó, đã bị phá sập dưới chân giai cấp tư sản.","đại công nghiệp","trung lưu hóa","Đảng Cộng sản","trí tuệ hóa",["3. Điều kiện quy định và thực hiện sứ mệnh","Ăngghen đã nêu rõ: “Cùng với sự phát triển của đại công nghiệp, chính cái nền tảng trên đó giai cấp tư sản đã sản xuất và chiếm hữu sản phẩm của nó, đã bị phá sập dưới chân giai cấp tư sản.",37]],[2,3,"Điền từ thích hợp vào chỗ trống: Trên thực tế, hầu hết các nước xã hội chủ nghĩa lại ra đời từ phương thức phát triển rút ngắn, bỏ qua chế độ ____ chủ nghĩa.","tư bản","chính đảng","tiên phong","bóc lột",["2. Nội dung sứ mệnh lịch sử của GCCN","Trên thực tế, hầu hết các nước xã hội chủ nghĩa lại ra đời từ phương thức phát triển rút ngắn, bỏ qua chế độ tư bản chủ nghĩa.",35]],[2,2,"Điền từ thích hợp vào chỗ trống: Ở các nước phát triển, sự phát triển của ____ tỷ lệ thuận với sự phát triển kinh tế.","giai cấp công nhân","đội ngũ trí thức","giai cấp nông dân","giai cấp tư sản",["4. GCCN hiện nay","Ở các nước phát triển, sự phát triển của giai cấp công nhân tỷ lệ thuận với sự phát triển kinh tế.",40]],[2,3,"Điền từ thích hợp vào chỗ trống: Điều kiện khách quan này là nhân tố kinh tế quy định giai cấp công nhân là lực lượng phá vỡ ____ tư bản chủ nghĩa, giành chính quyền về tay mình, chuyển từ giai cấp “tự nó” thành giai cấp “vì nó”.","quan hệ sản xuất","kiến trúc thượng tầng","lực lượng sản xuất","cơ sở hạ tầng",["3. Điều kiện quy định và thực hiện sứ mệnh","Điều kiện khách quan này là nhân tố kinh tế quy định giai cấp công nhân là lực lượng phá vỡ quan hệ sản xuất tư bản chủ nghĩa, giành chính quyền về tay mình, chuyển từ giai cấp “tự nó” thành giai cấp “vì nó”.",37]],[2,2,"Điền từ thích hợp vào chỗ trống: Bằng cách đó, ____ công nhân tạo tiền đề vật chất - kỹ thuật cho sự ra đời của xã hội mới.","giai cấp","tôn giáo","nhà nước","dân tộc",["2. Nội dung sứ mệnh lịch sử của GCCN","Bằng cách đó, giai cấp công nhân tạo tiền đề vật chất - kỹ thuật cho sự ra đời của xã hội mới.",35]],[2,2,"Điền từ thích hợp vào chỗ trống: Một bộ phận công nhân đã tham gia vào sở hữu một lượng ____ của xã hội thông qua chế độ cổ phần hóa.","tư liệu sản xuất","sứ mệnh lịch sử","phong trào yêu nước","giá trị thặng dư",["4. GCCN hiện nay","Một bộ phận công nhân đã tham gia vào sở hữu một lượng tư liệu sản xuất của xã hội thông qua chế độ cổ phần hóa.",42]],[2,2,"Điền từ thích hợp vào chỗ trống: Trên thực tế, các giá trị mà nhân loại hướng tới đều tương đồng với các giá trị lý tưởng, mục tiêu của ____.","giai cấp công nhân","đội ngũ trí thức","giai cấp tư sản","giai cấp nông dân",["5. Thực hiện sứ mệnh của GCCN trên thế giới hiện nay","Trên thực tế, các giá trị mà nhân loại hướng tới đều tương đồng với các giá trị lý tưởng, mục tiêu của giai cấp công nhân.",44]],[2,3,"Điền từ thích hợp vào chỗ trống: Là giai cấp đại diện tiêu biểu cho phương thức sản xuất tiên tiến, chất lượng của ____ còn phải thể hiện ở năng lực và trình độ làm chủ khoa học kỹ thuật và công nghệ hiện đại, nhất là trong điều kiện hiện nay.","giai cấp công nhân","giai cấp tư sản","giai cấp nông dân","đội ngũ trí thức",["3. Điều kiện quy định và thực hiện sứ mệnh","Là giai cấp đại diện tiêu biểu cho phương thức sản xuất tiên tiến, chất lượng của giai cấp công nhân còn phải thể hiện ở năng lực và trình độ làm chủ khoa học kỹ thuật và công nghệ hiện đại, nhất là trong điều kiện hiện nay.",39]],[3,1,"Điền từ thích hợp vào chỗ trống: ____ khẳng định: “Giữa xã hội tư bản chủ nghĩa và xã hội cộng sản chủ nghĩa là một thời kỳ cải biến cách mạng từ xã hội nọ sang xã hội kia.","C. Mác","Ph.Ăngghen","V.I.Lênin","Hồ Chí Minh",["4. Tính tất yếu khách quan của thời kỳ quá độ","C. Mác khẳng định: “Giữa xã hội tư bản chủ nghĩa và xã hội cộng sản chủ nghĩa là một thời kỳ cải biến cách mạng từ xã hội nọ sang xã hội kia.",66]],[3,3,"Điền từ thích hợp vào chỗ trống: Quá độ lên chủ nghĩa xã hội bỏ qua chế độ ____ là sự lựa chọn duy nhất đúng, khoa học, phản ánh đúng quy luật phát triển khách quan của cách mạng Việt Nam trong thời đại ngày nay.","tư bản chủ nghĩa","phong kiến","chiếm hữu nô lệ","cộng sản chủ nghĩa",["6. Quá độ ở Việt Nam: bỏ qua chế độ TBCN","Quá độ lên chủ nghĩa xã hội bỏ qua chế độ tư bản chủ nghĩa là sự lựa chọn duy nhất đúng, khoa học, phản ánh đúng quy luật phát triển khách quan của cách mạng Việt Nam trong thời đại ngày nay.",70]],[3,3,"Điền từ thích hợp vào chỗ trống: Mục tiêu cao nhất của chủ nghĩa xã hội là giải phóng con người trên cơ sở điều kiện kinh tế - xã hội phát triển, mà xét đến cùng là trình độ phát triển cao của ____.","lực lượng sản xuất","quan hệ sản xuất","cơ sở hạ tầng","kiến trúc thượng tầng",["3. Những đặc trưng bản chất của CNXH","Mục tiêu cao nhất của chủ nghĩa xã hội là giải phóng con người trên cơ sở điều kiện kinh tế - xã hội phát triển, mà xét đến cùng là trình độ phát triển cao của lực lượng sản xuất.",60]],[3,1,"Điền từ thích hợp vào chỗ trống: ____ cho rằng: “Từ chủ nghĩa tư bản, nhân loại chỉ có thể tiến thẳng lên chủ nghĩa xã hội, nghĩa là lên chế độ công hữu về các tư liệu sản xuất và chế độ phân phối sản phẩm theo lao động của mỗi người”.","V.I. Lênin","C.Mác","Ph.Ăngghen","Hồ Chí Minh",["3. Những đặc trưng bản chất của CNXH","V.I. Lênin cho rằng: “Từ chủ nghĩa tư bản, nhân loại chỉ có thể tiến thẳng lên chủ nghĩa xã hội, nghĩa là lên chế độ công hữu về các tư liệu sản xuất và chế độ phân phối sản phẩm theo lao động của mỗi người”.",60]],[3,3,"Điền từ thích hợp vào chỗ trống: Chủ nghĩa xã hội là một chế độ chính trị ____, nhà nước xã hội chủ nghĩa với hệ thông pháp luật và hệ thống tổ chức ngày càng hoàn thiện sẽ quản lý xã hội ngày càng hiệu quả.","dân chủ","chuyên chính","độc tài","pháp quyền",["3. Những đặc trưng bản chất của CNXH","Chủ nghĩa xã hội là một chế độ chính trị dân chủ, nhà nước xã hội chủ nghĩa với hệ thông pháp luật và hệ thống tổ chức ngày càng hoàn thiện sẽ quản lý xã hội ngày càng hiệu quả.",62]],[3,2,"Điền từ thích hợp vào chỗ trống: Sau 35 năm đổi mới, đất nước ta đã đạt được những thành tựu to lớn, có ý nghĩa lịch sử trên con đường xây dựng chủ nghĩa xã hội và bảo vệ Tổ quốc ____.","xã hội chủ nghĩa","chiếm hữu nô lệ","tư bản chủ nghĩa","phong kiến",["7. Đặc trưng CNXH và phương hướng xây dựng ở Việt Nam","Sau 35 năm đổi mới, đất nước ta đã đạt được những thành tựu to lớn, có ý nghĩa lịch sử trên con đường xây dựng chủ nghĩa xã hội và bảo vệ Tổ quốc xã hội chủ nghĩa.",75]],[3,3,"Điền từ thích hợp vào chỗ trống: Chính quyền đó chính là ____ kiểu mới thực hiện dân chủ cho tuyệt đại đa số nhân dân và trấn áp bằng vũ lực bọn bóc lột, bọn áp bức nhân dân, thực chất của sự biến đổi của chế độ dân chủ trong thời kỳ quá độ từ chủ nghĩa tư bản lên chủ nghĩa cộng sản 3.","nhà nước","gia đình","dân tộc","tôn giáo",["3. Những đặc trưng bản chất của CNXH","Chính quyền đó chính là nhà nước kiểu mới thực hiện dân chủ cho tuyệt đại đa số nhân dân và trấn áp bằng vũ lực bọn bóc lột, bọn áp bức nhân dân, thực chất của sự biến đổi của chế độ dân chủ trong thời kỳ quá độ từ chủ nghĩa tư bản lên chủ nghĩa cộng sản 3.",62]],[3,3,"Điền từ thích hợp vào chỗ trống: Những đặc trưng cơ bản của giai đoạn đầu, phản ánh bản chất và tính ưu việt của chủ nghĩa xã hội từng bước được bộc lộ đầy đủ cùng với quá trình xây dựng xã hội ____.","xã hội chủ nghĩa","phong kiến","chiếm hữu nô lệ","cộng sản chủ nghĩa",["3. Những đặc trưng bản chất của CNXH","Những đặc trưng cơ bản của giai đoạn đầu, phản ánh bản chất và tính ưu việt của chủ nghĩa xã hội từng bước được bộc lộ đầy đủ cùng với quá trình xây dựng xã hội xã hội chủ nghĩa.",58]],[3,3,"Điền từ thích hợp vào chỗ trống: Đại hội IV (____), nhận thức của Đảng ta về chủ nghĩa xã hội và con đường phát triển của cách mạng nước ta mới dừng ở mức độ định hướng.","1976","1978","1971","1977",["7. Đặc trưng CNXH và phương hướng xây dựng ở Việt Nam","Đại hội IV (1976), nhận thức của Đảng ta về chủ nghĩa xã hội và con đường phát triển của cách mạng nước ta mới dừng ở mức độ định hướng.",72]],[3,2,"Điền từ thích hợp vào chỗ trống: ____ là chế độ xã hội có nền kinh tế phát triển cao, với lực lượng sản xuất hiện đại, quan hệ sản xuất dựa trên chế độ công hữu về tư liệu sản xuất, được tổ chức, quản lý có hiệu quả, năng suất lao động cao và phân phối chủ yếu theo lao động.","Chủ nghĩa xã hội","cơ sở hạ tầng","thời kỳ quá độ","nhà nước pháp quyền",["3. Những đặc trưng bản chất của CNXH","Chủ nghĩa xã hội là chế độ xã hội có nền kinh tế phát triển cao, với lực lượng sản xuất hiện đại, quan hệ sản xuất dựa trên chế độ công hữu về tư liệu sản xuất, được tổ chức, quản lý  bản chất của CNXH","Ăngghen đã chỉ rõ: “Bước thứ nhất trong cuộc cách mạng công nhân là giai cấp vô sản biến thành giai cấp thống trị, là giành lấy dân chủ”.",62]],[3,3,"Điền từ thích hợp vào chỗ trống: Sự phát triển của lực lượng sản xuất và sự trưởng thành thực sự của ____ công nhân là tiền đề, điều kiện cho sự ra đời của hình thái kinh tế - xã hội cộng sản chủ nghĩa.","giai cấp","dân tộc","nhà nước","tôn giáo",["2. Điều kiện ra đời của CNXH","Sự phát triển của lực lượng sản xuất và sự trưởng thành thực sự của giai cấp công nhân là tiền đề, điều kiện cho sự ra đời của hình thái kinh tế - xã hội cộng sản chủ nghĩa.",58]],[3,1,"Điền từ thích hợp vào chỗ trống: Tương ứng với nước Nga, ____ cho rằng thời kỳ quá độ tồn tại 5 thành phần kinh tế: Kinh tế gia trưởng; kinh tế hàng hóa nhỏ; kinh tế tư bản; kinh tế tư bản nhà nước; kinh tế xã hội chủ nghĩa.","V.I. Lênin","C.Mác","Ph.Ăngghen","Hồ Chí Minh",["5. Đặc điểm của thời kỳ quá độ","Tương ứng với nước Nga, V.I. Lênin cho rằng thời kỳ quá độ tồn tại 5 thành phần kinh tế: Kinh tế gia trưởng; kinh tế hàng hóa nhỏ; kinh tế tư bản; kinh tế tư bản nhà nước; kinh tế xã hội chủ nghĩa.",68]],[3,3,"Điền từ thích hợp vào chỗ trống: V.I. Lênin cũng khẳng định mục đích cao cả của chủ nghĩa xã hội cần đạt đến là xóa bỏ sự phân chia xã hội thành ____, biến tất cả thành viên trong xã hội thành người lao động, tiêu diệt cơ sở của mọi tình trạng người bóc lột người.","giai cấp","nhà nước","tôn giáo","gia đình",["3. Những đặc trưng bản chất của CNXH","V.I. Lênin cũng khẳng định mục đích cao cả của chủ nghĩa xã hội cần đạt đến là xóa bỏ sự phân chia xã hội thành giai cấp, biến tất cả thành viên trong xã hội thành người lao động, tiêu diệt cơ sở của mọi tình trạng người bóc lột người.",60]],[3,1,"Điền từ thích hợp vào chỗ trống: Học thuyết hình thái kinh tế - xã hội của chủ nghĩa Mác - Lênin đã chỉ ra tính tất yếu sự thay thế hình thái kinh tế - xã hội tư bản chủ nghĩa bằng hình thái kinh tế - xã hội ____, đó là quá trình lịch sử - tự nh ủ nghĩa tư bản, không có thắng lợi đó thì không thể tiêu diệt được ách áp bức ____ và sự bất bình đẳng”.","dân tộc","gia đình","tín ngưỡng","tôn giáo",["3. Những đặc trưng bản chất của CNXH","Bởi vì, chỉ có sự gắn bó như thế mới bảo đảm cho thắng lợi đối với chủ nghĩa tư bản, không có thắng lợi đó thì không thể tiêu diệt được ách áp bức dân tộc và sự bất bình đẳng”.",65]],[3,2,"Điền từ thích hợp vào chỗ trống: Nền sản xuất vật chất và đời sống xã hội đang trong quá trình quốc tế hóa sâu sắc, ảnh hưởng lớn tới nhịp độ phát triển lịch sử và cuộc sống các ____.","dân tộc","tôn giáo","giai cấp","nhà nước",["6. Quá độ ở Việt Nam: bỏ qua chế độ TBCN","Nền sản xuất vật chất và đời sống xã hội đang trong quá trình quốc tế hóa sâu sắc, ảnh hưởng lớn tới nhịp độ phát triển lịch sử và cuộc sống các dân tộc.",70]],[3,2,"Điền từ thích hợp vào chỗ trống: Các nước với chế độ xã hội và trình độ phát triển khác nhau cùng tồn tại, vừa hợp tác vừa đấu tranh, cạnh tranh gay gắt vì lợi ích quốc gia, ____.","dân tộc","gia đình","tín ngưỡng","giai cấp",["6. Quá độ ở Việt Nam: bỏ qua chế độ TBCN","Các nước với chế độ xã hội và trình độ phát triển khác nhau cùng tồn tại, vừa hợp tác vừa đấu tranh, cạnh tranh gay gắt vì lợi ích quốc gia, dân tộc.",70]],[3,3,"Điền từ thích hợp vào chỗ trống: Chủ nghĩa xã hội, với bản chất tốt đẹp do con người, vì con người luôn là bảo đảm cho các ____ bình đẳng, đoàn kết và hợp tác hữu nghị; đồng thời có quan hệ với nhân dân tất cả các nước trên thế giới.","dân tộc","giai cấp","tín ngưỡng","nhà nước",["3. Những đặc trưng bản chất của CNXH","Chủ nghĩa xã hội, với bản chất tốt đẹp do con người, vì con người luôn là bảo đảm cho các dân tộc bình đẳng, đoàn kết và hợp tác hữu nghị; đồng thời có quan hệ với nhân dân tất cả các nước trên thế giới.",64]],[3,3,"Điền từ thích hợp vào chỗ trống: Sự thay thế này được thực hiện thông qua cách mạng ____ xuất phát từ hai tiền đề vật chất quan trọng nhất là sự phát triển của lực lượng sản xuất và sự trưởng thành của giai cấp công nhân.","xã hội chủ nghĩa","cộng sản chủ nghĩa","chiếm hữu nô lệ","phong kiến",["1. CNXH, giai đoạn đầu của hình thái KT-XH cộng sản chủ nghĩa","Sự thay thế này được thực hiện thông qua cách mạng xã hội chủ nghĩa xuất phát từ hai tiền đề vật chất quan trọng nhất là sự phát triển của lực lượng sản xuất và sự trưởng thành của giai cấp công nhân.",55]],[3,2,"Điền từ thích hợp vào chỗ trống: Ăngghen khi nghiên cứu lịch sử phát triển của xã hội loài người, nhất là lịch sử xã hội tư bản, đã xây dựng nên học thuyết về ____.","hình thái kinh tế - xã hội","quá độ gián tiếp","công hữu","thời kỳ quá độ",["1. CNXH, giai đoạn đầu của hình thái KT-XH cộng sản chủ nghĩa","Ăngghen khi nghiên cứu lịch sử phát triển của xã hội loài người, nhất là lịch sử xã hội tư bản, đã xây dựng nên học thuyết về hình thái kinh tế - xã hội.",54]],[3,2,"Điền từ thích hợp vào chỗ trống: Khi phân tích hình thái kinh tế - xã hội ____, C. Mác và Ph.","cộng sản chủ nghĩa","phong kiến","chiếm hữu nô lệ","xã hội chủ nghĩa",["1. CNXH, giai đoạn đầu của hình thái KT-XH cộng sản chủ nghĩa","Khi phân tích hình thái kinh tế - xã hội cộng sản chủ nghĩa, C. Mác và Ph.",55]],[3,2,"Điền từ thích hợp vào chỗ trống: Trong ____, văn hóa là nền tảng tinh thần của xã hội, mục tiêu, động lực của phát triển xã hội, trọng tâm là phát triển kinh tế; văn hóa đã hun đúc nên tâm hồn, khí phách, bản lĩnh con người, biến con người thành con người chân, thiện, mỹ.","chủ nghĩa xã hội","chuyên chính vô sản","nhà nước pháp quyền","thời kỳ quá độ",["3. Những đặc trưng bản chất của CNXH","Trong chủ nghĩa xã hội, văn hóa là nền tảng tinh thần của xã hội, mục tiêu, động lực của phát triển xã hội, trọng tâm là phát triển kinh tế; văn hóa đã hun đúc nên tâm hồn, khí phách, bản lĩnh con người, biến con người thành con người chân, thiện, mỹ.",63]],[3,3,"Điền từ thích hợp vào chỗ trống: Hơn nữa, cùng với sự phát triển mạnh mẽ của nền đại công nghiệp cơ khí là sự trưởng thành vượt bậc cả về số lượng và chất lượng của ____, con đẻ của nền ng bản chất của CNXH","Đương nhiên, để đạt được mục tiêu tổng quát đó, C. Mác và Ph.",59]],[4,3,"Điền từ thích hợp vào chỗ trống: Quyền ____ của nhân dân được thực hành một cách rộng rãi; “nhân dân có quyền bầu và bãi miễn những đại biểu không xứng đáng”; đồng thời tăng cường thực hiện sự nghiêm minh của pháp luật.","dân chủ","chuyên chính","pháp quyền","độc tài",["6. Nhà nước pháp quyền XHCN ở Việt Nam","Quyền dân chủ của nhân dân được thực hành một cách rộng rãi; “nhân dân có quyền bầu và bãi miễn những đại biểu không xứng đáng”; đồng thời tăng cường thực hiện sự nghiêm minh của pháp luật.",102]],[4,3,"Điền từ thích hợp vào chỗ trống: Về kinh tế, bản chất của ____ xã hội chủ nghĩa chịu sự quy định của cơ sở kinh tế của xã hội xã hội chủ nghĩa, đó là chế độ sở hữu xã hội về tư liệu sản xuất chủ yếu, do đó, không còn tồn tại quan hệ sản xuất bóc lột.","nhà nước","tôn giáo","gia đình","giai cấp",["3. Nhà nước XHCN: ra đời, bản chất, chức năng","Về kinh tế, bản chất của nhà nước xã hội chủ nghĩa chịu sự quy định của cơ sở kinh tế của xã hội xã hội chủ nghĩa, đó là chế độ sở hữu xã hội về tư liệu sản xuất chủ yếu, do đó, không còn tồn tại quan hệ sản xuất bóc lột.",92]],[4,2,"Điền từ thích hợp vào chỗ trống: Quyền được tham gia rộng rãi vào công việc quản lý ____ của nhân dân chính là nội dung dân chủ trên lĩnh vực chính trị.","nhà nước","dân tộc","giai cấp","gia đình",["2. Dân chủ xã hội chủ nghĩa","Quyền được tham gia rộng rãi vào công việc quản lý nhà nước của nhân dân chính là nội dung dân chủ trên lĩnh vực chính trị.",88]],[4,3,"Điền từ thích hợp vào chỗ trống: Căn cứ vào phạm vi tác động của quyền lực nhà nước, chức năng của nhà nước được chia thành chức năng đối nội và ____.","chức năng đối ngoại","dân chủ trực tiếp","Mặt trận Tổ quốc","nhà nước pháp quyền",["3. Nhà nước XHCN: ra đời, bản chất, chức năng","Căn cứ vào phạm vi tác động của quyền lực nhà nước, chức năng của nhà nước được chia thành chức năng đối nội và chức năng đối ngoại.",93]],[4,3,"Điền từ thích
