 hợp vào chỗ trống: Bản chất tư tưởng - văn hóa - xã hội: Nền dân chủ ____ lấy hệ tư tưởng Mác - Lênin - hệ tư tưởng của giai cấp công nhân, làm chủ đạo đối với mọi hình thái ý thức xã hội khác trong xã hội mới.","xã hội chủ nghĩa","cộng sản chủ nghĩa","chiếm hữu nô lệ","tư bản chủ nghĩa",["2. Dân chủ xã hội chủ nghĩa","Bản chất tư tưởng - văn hóa - xã hội: Nền dân chủ xã hội chủ nghĩa lấy hệ tư tưởng Mác - Lênin - hệ tư tưởng của giai cấp công nhân, làm chủ đạo đối với mọi hình thái ý thức xã hội khác trong xã hội mới.",89]],[4,2,"Điền từ thích hợp vào chỗ trống: Ngược lại, nếu các nguyên tắc của nền dân chủ xã hội chủ nghĩa bị vi phạm, thì việc xây dựng ____ xã hội chủ nghĩa cũng sẽ không thực hiện được.","nhà nước","giai cấp","gia đình","tôn giáo",["4. Quan hệ giữa dân chủ XHCN và nhà nước XHCN","Ngược lại, nếu các nguyên tắc của nền dân chủ xã hội chủ nghĩa bị vi phạm, thì việc xây dựng nhà nước xã hội chủ nghĩa cũng sẽ không thực hiện được.",95]],[4,2,"Điền từ thích hợp vào chỗ trống: Hình thức dân chủ trực tiếp là hình thức thông qua đó, nhân dân bằng hành động trực tiếp của mình thực hiện quyền làm chủ ____ và xã hội.","nhà nước","tôn giáo","giai cấp","gia đình",["5. Dân chủ XHCN ở Việt Nam","Hình thức dân chủ trực tiếp là hình thức thông qua đó, nhân dân bằng hành động trực tiếp của mình thực hiện quyền làm chủ nhà nước và xã hội.",99]],[4,2,"Điền từ thích hợp vào chỗ trống: Dân chủ là động lực để xây dựng chủ nghĩa xã hội (phát huy sức mạnh của nhân dân, của toàn ____).","dân tộc","tín ngưỡng","tôn giáo","gia đình",["5. Dân chủ XHCN ở Việt Nam","Dân chủ là động lực để xây dựng chủ nghĩa xã hội (phát huy sức mạnh của nhân dân, của toàn dân tộc).",98]],[4,2,"Điền từ thích hợp vào chỗ trống: Các nhà tư tưởng Hy Lạp cổ đại đã dùng cụm từ “demoskratos” để nói đến ____, trong đó “demos” là nhân dân (danh từ) và “kratos” là cai trị (động từ).","dân chủ","độc tài","chuyên chính","pháp quyền",["1. Dân chủ và sự ra đời, phát triển của dân chủ","Các nhà tư tưởng Hy Lạp cổ đại đã dùng cụm từ “demoskratos” để nói đến dân chủ, trong đó “demos” là nhân dân (danh từ) và “kratos” là cai trị (động từ).",80]],[4,3,"Điền từ thích hợp vào chỗ trống: Đại hội VI của Đảng (năm ____) đề ra đường lối đổi mới toàn diện đất nước, trong đó nhấn mạnh phát huy dân chủ để tạo ra một động lực mạnh mẽ cho phát triển đất nước.","1986","1996","1988","1981",["5. Dân chủ XHCN ở Việt Nam","Đại hội VI của Đảng (năm 1986) đề ra đường lối đổi mới toàn diện đất nước, trong đó nhấn mạnh phát huy dân chủ để tạo ra một động lực mạnh mẽ cho phát triển đất nước.",97]],[4,2,"Điền từ thích hợp vào chỗ trống: Sự ra đời của nền dân chủ ____ đánh dấu bước phát triển mới về chất của dân chủ.","xã hội chủ nghĩa","chiếm hữu nô lệ","cộng sản chủ nghĩa","phong kiến",["2. Dân chủ xã hội chủ nghĩa","Sự ra đời của nền dân chủ xã hội chủ nghĩa đánh dấu bước phát triển mới về chất của dân chủ.",85]],[4,2,"Điền từ thích hợp vào chỗ trống: Xây dựng và từng bước hoàn thiện nền dân chủ ____, bảo đảm dân chủ được thực hiện trong thực tế cuộc sống ở mỗi cấp, trên tất cả các lĩnh vực.","xã hội chủ nghĩa","phong kiến","cộng sản chủ nghĩa","chiếm hữu nô lệ",["5. Dân chủ XHCN ở Việt Nam","Xây dựng và từng bước hoàn thiện nền dân chủ xã hội chủ nghĩa, bảo đảm dân chủ được thực hiện trong thực tế cuộc sống ở mỗi cấp, trên tất cả các lĩnh vực.",97]],[4,3,"Điền từ thích hợp vào chỗ trống: Cơ sở kinh tế của bạo lực cách mạng đó, cái bảo đảm sức sống và thắng lợi của nó chính là việc ____ vô sản đưa ra được và thực hiện được kiểu tổ chức lao động xã hội cao hơn so với chủ nghĩa tư bản.","giai cấp","tôn giáo","dân tộc","tín ngưỡng",["3. Nhà nước XHCN: ra đời, bản chất, chức năng","Cơ sở kinh tế của bạo lực cách mạng đó, cái bảo đảm sức sống và thắng lợi của nó chính là việc giai cấp vô sản đưa ra được và thực hiện được kiểu tổ chức lao động xã hội cao hơn so với chủ nghĩa tư bản.",94]],[4,1,"Điền từ thích hợp vào chỗ trống: ____ ngày càng được thể hiện trong tất cả các mối quan hệ xã hội, trở thành quy chế, cách thức làm việc của mọi tổ chức trong xã hội.","Dân chủ","Hiến pháp","Quốc hội","nhà nước",["5. Dân chủ XHCN ở Việt Nam","Dân chủ ngày càng được thể hiện trong tất cả các mối quan hệ xã hội, trở thành quy chế, cách thức làm việc của mọi tổ chức trong xã hội.",99]],[4,2,"Điền từ thích hợp vào chỗ trống: Dưới góc độ này, ____ là một thành tựu văn hóa, một quá trình sáng tạo văn hóa, thể hiện khát vọng tự do được sáng tạo và phát triển của con người.","dân chủ","pháp quyền","chuyên chính","độc tài",["2. Dân chủ xã hội chủ nghĩa","Dưới góc độ này, dân chủ là một thành tựu văn hóa, một quá trình sáng tạo văn hóa, thể hiện khát vọng tự do được sáng tạo và phát triển của con người.",90]],[4,2,"Điền từ thích hợp vào chỗ trống: Trong tất cả các hoạt động của xã hội, ____ được đặt ở vị trí tối thượng để điều chỉnh các quan hệ xã hội.","pháp luật","bầu cử","quyền lực","dân chủ",["6. Nhà nước pháp quyền XHCN ở Việt Nam","Trong tất cả các hoạt động của xã hội, pháp luật được đặt ở vị trí tối thượng để điều chỉnh các quan hệ xã hội.",102]],[4,3,"Điền từ thích hợp vào chỗ trống: Nguyên tắc cơ bản của nền dân chủ xã hội chủ nghĩa là không ngừng mở rộng dân chủ, nâng cao mức độ giải phóng cho những người lao động, thu hút họ tham gia tự giác vào công việc quản lý ____, quản lý xã hội.","nhà nước","dân tộc","giai cấp","tôn giáo",["2. Dân chủ xã hội chủ nghĩa","Nguyên tắc cơ bản của nền dân chủ xã hội chủ nghĩa là không ngừng mở rộng dân chủ, nâng cao mức độ giải phóng cho những người lao động, thu hút họ tham gia tự giác vào công việc quản lý nhà nước, quản lý xã hội.",85]],[4,2,"Điền từ thích hợp vào chỗ trống: Đảng ta khẳng định: “Mọi đường lối, chính sách của Đảng và ____ của Nhà nước đều vì lợi ích của nhân dân, có sự tham gia ý kiến của nhân dân”.","pháp luật","Quốc hội","quyền lực","dân chủ",["5. Dân chủ XHCN ở Việt Nam","Đảng ta khẳng định: “Mọi đường lối, chính sách của Đảng và pháp luật của Nhà nước đều vì lợi ích của nhân dân, có sự tham gia ý kiến của nhân dân”.",99]],[4,2,"Điền từ thích hợp vào chỗ trống: Xuất phát từ bản chất của nhà nước ____, việc thực hiện các chức năng của nhà nước cũng có sự khác biệt so với các nhà nước trước đó.","xã hội chủ nghĩa","chiếm hữu nô lệ","cộng sản chủ nghĩa","phong kiến",["3. Nhà nước XHCN: ra đời, bản chất, chức năng","Xuất phát từ bản chất của nhà nước xã hội chủ nghĩa, việc thực hiện các chức năng của nhà nước cũng có sự khác biệt so với các nhà nước trước đó.",93]],[4,2,"Điền từ thích hợp vào chỗ trống: Bố là, nâng cao vai trò của các tổ chức chính trị - xã hội trong xây dựng nền ____ xã hội chủ nghĩa.","dân chủ","độc tài","pháp quyền","chuyên chính",["7. Phát huy dân chủ XHCN, xây dựng nhà nước pháp quyền","Bố là, nâng cao vai trò của các tổ chức chính trị - xã hội trong xây dựng nền dân chủ xã hội chủ nghĩa.",104]],[4,3,"Điền từ thích hợp vào chỗ trống: ____ nhà nước ta là thống nhất, có sự phân công, phối hợp và kiểm soát giữa các cơ quan nhà nước trong việc thực hiện các quyền lập pháp, hành pháp và tư pháp.","Quyền lực","Quốc hội","bầu cử","dân chủ",["5. Dân chủ XHCN ở Việt Nam","Quyền lực nhà nước ta là thống nhất, có sự phân công, phối hợp và kiểm soát giữa các cơ quan nhà nước trong việc thực hiện các quyền lập pháp, hành pháp và tư pháp.",99]],[4,2,"Điền từ thích hợp vào chỗ trống: Quốc hội là cơ quan quyền lực ____ cao nhất hoạt động theo nhiệm kỳ 5 năm.","nhà nước","giai cấp","gia đình","tín ngưỡng",["5. Dân chủ XHCN ở Việt Nam","Quốc hội là cơ quan quyền lực nhà nước cao nhất hoạt động theo nhiệm kỳ 5 năm.",105]],[4,2,"Điền từ thích hợp vào chỗ trống: Phòng, chống tham nhũng, lãng phí và thực hành tiết kiệm là nhiệm vụ cấp bách, lâu dài của quá trình xây dựng Nhà nước ____ xã hội chủ nghĩa ở Việt Nam.","pháp quyền","chuyên chính","dân chủ","độc tài",["7. Phát huy dân chủ XHCN, xây dựng nhà nước pháp quyền","Phòng, chống tham nhũng, lãng phí và thực hành tiết kiệm là nhiệm vụ cấp bách, lâu dài của quá trình xây dựng Nhà nước pháp quyền xã hội chủ nghĩa ở Việt Nam.",105]],[4,3,"Điền từ thích hợp vào chỗ trống: Đặc trưng cơ bản của nền dân chủ ____ là thực hiện quyền lực của nhân dân - tức là xây dựng nhà nước dân chủ thực sự, dân làm chủ nhà nước và xã hội, bảo vệ quyền lợi cho đại đa số nhân dân.","xã hội chủ nghĩa","cộng sản chủ nghĩa","tư bản chủ nghĩa","phong kiến",["1. Dân chủ và sự ra đời, phát triển của dân chủ","Đặc trưng cơ bản của nền dân chủ xã hội chủ nghĩa là thực hiện quyền lực của nhân dân - tức là xây dựng nhà nước dân chủ thực sự, dân làm chủ nhà nước và xã hội, bảo vệ quyền lợi cho đại đa số nhân dân.",84]],[4,1,"Điền từ thích hợp vào chỗ trống: Điều này đã được ____ khẳng định: “NƯỚC TA LÀ NƯỚC DÂN CHỦ.","Hồ Chí Minh","C.Mác","Ph.Ăngghen","V.I.Lênin",["5. Dân chủ XHCN ở Việt Nam","Điều này đã được Hồ Chí Minh khẳng định: “NƯỚC TA LÀ NƯỚC DÂN CHỦ.",97]],[4,2,"Điền từ thích hợp vào chỗ trống: Dân chủ là bản chất của chế độ ____ (do nhân dân làm chủ, quyền lực thuộc về nhân dân).","xã hội chủ nghĩa","tư bản chủ nghĩa","chiếm hữu nô lệ","cộng sản chủ nghĩa",["5. Dân chủ XHCN ở Việt Nam","Dân chủ là bản chất của chế độ xã hội chủ nghĩa (do nhân dân làm chủ, quyền lực thuộc về nhân dân).",98]],[4,2,"Điền từ thích hợp vào chỗ trống: ____ có mối quan hệ thường xuyên và chặt chẽ với nhân dân, tôn trọng và lắng nghe ý kiến của nhân dân, chịu sự giám sát của nhân dân.","Nhà nước","Hiến pháp","pháp luật","quyền lực",["6. Nhà nước pháp quyền XHCN ở Việt Nam","Nhà nước có mối quan hệ thường xuyên và chặt chẽ với nhân dân, tôn trọng và lắng nghe ý kiến của nhân dân, chịu sự giám sát của nhân dân.",101]],[4,3,"Điền từ thích hợp vào chỗ trống: Quá trình phát triển của nền dân chủ ____ bắt đầu từ thấp đến cao, từ chưa hoàn thiện đến hoàn thiện, trong đó, có sự kế thừa những giá trị của nền dân chủ trước đó, đồng thời bổ sung và làm sâu sắc thêm những giá tr của nền dân chủ mới.","xã hội chủ nghĩa","chiếm hữu nô lệ","phong kiến","cộng sản chủ nghĩa",["2. Dân chủ xã hội chủ nghĩa","Quá trình phát triển của nền dân chủ xã hội chủ nghĩa bắt đầu từ thấp đến cao, từ chưa hoàn thiện đến hoàn thiện, trong đó, có sự kế thừa những giá trị của nền dân chủ trước đó, đồng thời bổ sung và làm sâu sắc thêm những giá tr của nền dân chủ mới.",85]],[4,2,"Điền từ thích hợp vào chỗ trống: Xét về bản chất chính trị, dân chủ xã hội chủ nghĩa vừa có bản chất ____, vừa có tính nhân dân rộng rãi, tính dân tộc sâu sắc.","giai cấp công nhân","giai cấp nông dân","giai cấp tư sản","đội ngũ trí thức",["2. Dân chủ xã hội chủ nghĩa","Xét về bản chất chính trị, dân chủ xã hội chủ nghĩa vừa có bản chất giai cấp công nhân, vừa có tính nhân dân rộng rãi, tính dân tộc sâu sắc.",88]],[4,2,"Điền từ thích hợp vào chỗ trống: Nhà nước ____ xã hội chủ nghĩa ở Việt Nam mang bản chất giai cấp công nhân, đồng thời cũng gắn bó chặt chẽ với dân tộc, với nhân dân.","pháp quyền","dân chủ","chuyên chính","độc tài",["7. Phát huy dân chủ XHCN, xây dựng nhà nước pháp quyền","Nhà nước pháp quyền xã hội chủ nghĩa ở Việt Nam mang bản chất giai cấp công nhân, đồng thời cũng gắn bó chặt chẽ với dân tộc, với nhân dân.",104]],[4,3,"Điền từ thích hợp vào chỗ trống: Tính ưu việt về mặt bản chất của nhà nước xã hội chủ nghĩa được thể hiện trên các phương diện: Về chính trị, nhà nước xã hội chủ nghĩa mang bản chất của ____, giai cấp có lợi ích phù hợp với lợi ích chung của quần chúng nhân dân lao động.","giai cấp công nhân","giai cấp nông dân","đội ngũ trí thức","giai cấp tư sản",["3. Nhà nước XHCN: ra đời, bản chất, chức năng","Tính ưu việt về mặt bản chất của nhà nước xã hội chủ nghĩa được thể hiện trên các phương diện: Về chính trị, nhà nước xã hội chủ nghĩa mang bản chất của giai cấp công nhân, giai cấp có lợi ích phù hợp với lợi ích chung của quần chúng nhân dân lao động.",92]],[4,2,"Điền từ thích hợp vào chỗ trống: Nội dung trên của khái niệm ____ về cơ bản vẫn giữ nguyên cho đến ngày nay.","dân chủ","pháp quyền","độc tài","chuyên chính",["1. Dân chủ và sự ra đời, phát triển của dân chủ","Nội dung trên của khái niệm dân chủ về cơ bản vẫn giữ nguyên cho đến ngày nay.",80]],[4,1,"Điền từ thích hợp vào chỗ trống: Theo ____, mặc dù trong giai đoạn đầu của chủ nghĩa cộng sản, “Cơ quan đặc biệt, bộ máy trấn áp đặc biệt là “nhà nước” vẫn còn cần thiết, nhưng nó đã là nhà nước quá độ, mà không còn là nhà nước theo đúng nghĩa của nó nữa”.","V.I. Lênin","C.Mác","Ph.Ăngghen","Hồ Chí Minh",["3. Nhà nước XHCN: ra đời, bản chất, chức năng","Theo V.I. Lênin, mặc dù trong giai đoạn đầu của chủ nghĩa cộng sản, “Cơ quan đặc biệt, bộ máy trấn áp đặc biệt là “nhà nước” vẫn còn cần thiết, nhưng nó đã là nhà nước quá độ, mà không còn là nhà nước theo đúng nghĩa của nó nữa”.",94]],[4,3,"Điền từ thích hợp vào chỗ trống: Trên cơ sở những quan niệm dân chủ nêu trên, nhất là tư tưởng dân chủ của Hồ Chí Minh, Đảng Cộng sản Việt Nam chủ trương xây dựng chế độ dân chủ ____, mở rộng và phát huy quyền làm chủ của nhân dân.","xã hội chủ nghĩa","cộng sản chủ nghĩa","tư bản chủ nghĩa","phong kiến",["1. Dân chủ và sự ra đời, phát triển của dân chủ","Trên cơ sở những quan niệm dân chủ nêu trên, nhất là tư tưởng dân chủ của Hồ Chí Minh, Đảng Cộng sản Việt Nam chủ trương xây dựng chế độ dân chủ xã hội chủ nghĩa, mở rộng và phát huy quyền làm chủ của nhân dân.",82]],[4,2,"Điền từ thích hợp vào chỗ trống: Bản chất của dân chủ xã hội chủ nghĩa cũng như mối quan hệ giữa dân chủ xã hội chủ nghĩa và ____ pháp quyền xã hội chủ nghĩa chưa được xác định rõ ràng.","nhà nước","tôn giáo","gia đình","giai cấp",["5. Dân chủ XHCN ở Việt Nam","Bản chất của dân chủ xã hội chủ nghĩa cũng như mối quan hệ giữa dân chủ xã hội chủ nghĩa và nhà nước pháp quyền xã hội chủ nghĩa chưa được xác định rõ ràng.",96]],[4,3,"Điền từ thích hợp vào chỗ trống: Với chủ trương: “Xây dựng Nhà nước ____ Việt Nam của dân, do dân, vì dân”, Đảng ta đã xác định: Nhà nước quản lý xã hội bằng pháp luật, mọi cơ quan, tổ chức, cán bộ, công chức, mọi công dân có nghĩa vụ chấp hành Hiến pháp và pháp luật.","pháp quyền","dân chủ","chuyên chính","độc tài",["6. Nhà nước pháp quyền XHCN ở Việt Nam","Với chủ trương: “Xây dựng Nhà nước pháp quyền Việt Nam của dân, do dân, vì dân”, Đảng ta đã xác định: Nhà nước quản lý xã hội bằng pháp luật, mọi cơ quan, tổ chức, cán bộ, công chức, mọi công dân có nghĩa vụ chấp hành Hiến pháp và pháp luật.",101]],[4,1,"Điền từ thích hợp vào chỗ trống: ____ với tư cách một hình thức tổ chức thiết chế chính trị, một hình thức hay hình thái nhà nước, nó là một phạm trù lịch sử, ra đời và phát triển gắn liền với nhà nước và mất đi khi nhà nước tiêu vong.","Dân chủ","pháp luật","Hiến pháp","Quốc hội",["1. Dân chủ và sự ra đời, phát triển của dân chủ","Dân chủ với tư cách một hình thức tổ chức thiết chế chính trị, một hình thức hay hình thái nhà nước, nó là một phạm trù lịch sử, ra đời và phát triển gắn liền với nhà nước và mất đi khi nhà nước tiêu vong.",81]],[4,2,"Điền từ thích hợp vào chỗ trống: Đồng thời khẳng định: “Dân chủ ____ là bản chất của chế độ ta, vừa là mục tiêu, vừa là động lực của sự phát triển đất nước”.","xã hội chủ nghĩa","chiếm hữu nô lệ","cộng sản chủ nghĩa","phong kiến",["5. Dân chủ XHCN ở Việt Nam","Đồng thời khẳng định: “Dân chủ xã hội chủ nghĩa là bản chất của chế độ ta, vừa là mục tiêu, vừa là động lực của sự phát triển đất nước”.",97]],[4,2,"Điền từ thích hợp vào chỗ trống: Kể từ khi khai sinh ra nước Việt Nam ____ Cộng hòa cho đến nay, nhân dân thực sự trở thành người làm chủ, tự xây dựng, tổ chức quản lý xã hội.","Dân chủ","bầu cử","pháp luật","Hiến pháp",["5. Dân chủ XHCN ở Việt Nam","Kể từ khi khai sinh ra nước Việt Nam Dân chủ Cộng hòa cho đến nay, nhân dân thực sự trở thành người làm chủ, tự xây dựng, tổ chức quản lý xã hội.",100]],[4,2,"Điền từ thích hợp vào chỗ trống: Quyền được tham gia rộng rãi vào công việc quản lý ____ chính là nội dung dân chủ trên lĩnh vực chính trị.","nhà nước","dân tộc","tôn giáo","giai cấp",["2. Dân chủ xã hội chủ nghĩa","Quyền được tham gia rộng rãi vào công việc quản lý nhà nước chính là nội dung dân chủ trên lĩnh vực chính trị.",88]],[4,3,"Điền từ thích hợp vào chỗ trống: Khi trình độ của ____ phát triển dẫn tới sự ra đời của chế độ tư hữu và sau đó là giai cấp đã làm cho hình thức “dân chủ nguyên thủy” tan rã, nền dân chủ chủ nô ra đời.","lực lượng sản xuất","cơ sở hạ tầng","kiến trúc thượng tầng","quan hệ sản xuất",["1. Dân chủ và sự ra đời, phát triển của dân chủ","Khi trình độ của lực lượng sản xuất phát triển dẫn tới sự ra đời của chế độ tư hữu và sau đó là giai cấp đã làm cho hình thức “dân chủ nguyên thủy” tan rã, nền dân chủ chủ nô ra đời.",83]],[4,2,"Điền từ thích hợp vào chỗ trống: Việc chăm lo cho lợi ích của đại đa số nhân dân lao động trở thành mục tiêu hàng đầu của nhà nước ____.","xã hội chủ nghĩa","cộng sản chủ nghĩa","phong kiến","chiếm hữu nô lệ",["3. Nhà nước XHCN: ra đời, bản chất, chức năng","Việc chăm lo cho lợi ích của đại đa số nhân dân lao động trở thành mục tiêu hàng đầu của nhà nước xã hội chủ nghĩa.",93]],[4,2,"Điền từ thích hợp vào chỗ trống: Thực tiễn cho thấy, bản chất tốt đẹp và tính ưu việt của nền ____ xã hội chủ nghĩa ở Việt Nam càng ngày càng thể hiện giá trị lấy dân làm gốc.","dân chủ","chuyên chính","pháp quyền","độc tài",["5. Dân chủ XHCN ở Việt Nam","Thực tiễn cho thấy, bản chất tốt đẹp và tính ưu việt của nền dân chủ xã hội chủ nghĩa ở Việt Nam càng ngày càng thể hiện giá trị lấy dân làm gốc.",100]],[4,2,"Điền từ thích hợp vào chỗ trống: Trong giai đoạn hiện nay, cách tiếp cận và những đặc trưng về nhà nước ____ vẫn có những cách hiểu khác nhau.","pháp quyền","độc tài","chuyên chính","dân chủ",["6. Nhà nước pháp quyền XHCN ở Việt Nam","Trong giai đoạn hiện nay, cách tiếp cận và những đặc trưng về nhà nước pháp quyền vẫn có những cách hiểu khác nhau.",100]],[4,2,"Điền từ thích hợp vào chỗ trống: Cuộc cách mạng ____ khác với các cuộc cách mạng xã hội trước đây là ở chỗ nó là cuộc cách mạng của số đông, vì lợi ích của số đông nhân dân.","xã hội chủ nghĩa","chiếm hữu nô lệ","phong kiến","tư bản chủ nghĩa",["2. Dân chủ xã hội chủ nghĩa","Cuộc cách mạng xã hội chủ nghĩa khác với các cuộc cách mạng xã hội trước đây là ở chỗ nó là cuộc cách mạng của số đông, vì lợi ích của số đông nhân dân.",88]],[4,2,"Điền từ thích hợp vào chỗ trống: Trong chế độ cộng sản nguyên thủy đã xuất hiện hình thức manh nha của ____ mà Ph.","dân chủ","chuyên chính","độc tài","pháp quyền",["1. Dân chủ và sự ra đời, phát triển của dân chủ","Trong chế độ cộng sản nguyên thủy đã xuất hiện hình thức manh nha của dân chủ mà Ph.",83]],[4,1,"Điền từ thích hợp vào chỗ trống: Ý thức làm chủ của nhân dân, trách nhiệm công dân của người dân trong xã hội ngày càng được đề cao trong ____ và cuộc sống.","pháp luật","nhà nước","dân chủ","Quốc hội",["5. Dân chủ XHCN ở Việt Nam","Ý thức làm chủ của nhân dân, trách nhiệm công dân của người dân trong xã hội ngày càng được đề cao trong pháp luật và cuộc sống.",99]],[4,1,"Điền từ thích hợp vào chỗ trống: ____ khẳng định: “Bất cứ một nhà nước nào cũng đều có nghĩa là dùng bạo lực; nhưng toàn bộ sự khác nhau là ở chỗ dùng bạo lực đối với những người bị bóc lột hay đối với kẻ đi bóc lột...”.","V.I. Lênin","C.Mác","Ph.Ăngghen","Hồ Chí Minh",["3. Nhà nước XHCN: ra đời, bản chất, chức năng","V.I. Lênin khẳng định: “Bất cứ một nhà nước nào cũng đều có nghĩa là dùng bạo lực; nhưng toàn bộ sự khác nhau là ở chỗ dùng bạo lực đối với những người bị bóc lột hay đối với kẻ đi bóc lột...”.",94]],[4,2,"Điền từ thích hợp vào chỗ trống: Nguyên tắc này kết hợp với nguyên tắc tập trung để hình thành nguyên tắc tập trung ____ trong tổ chức và quản lý xã hội.","dân chủ","độc tài","chuyên chính","pháp quyền",["1. Dân chủ và sự ra đời, phát triển của dân chủ","Nguyên tắc này kết hợp với nguyên tắc tập trung để hình thành nguyên tắc tập trung dân chủ trong tổ chức và quản lý xã hội.",81]],[4,2,"Điền từ thích hợp vào chỗ trống: Qua mỗi kỳ đại hội của Đảng thòi kỳ đổi mới, ____ ngày càng được nhận thức, phát triển và hoàn thiện đúng đắn, phù hợp hơn với điều kiện cụ thể của nước ta.","dân chủ","chuyên chính","pháp quyền","độc tài",["5. Dân chủ XHCN ở Việt Nam","Qua mỗi kỳ đại hội của Đảng thòi kỳ đổi mới, dân chủ ngày càng được nhận thức, phát triển và hoàn thiện đúng đắn, phù hợp hơn với điều kiện cụ thể của nước ta.",97]],[4,2,"Điền từ thích hợp vào chỗ trống: Đẩy mạnh xã hội hóa các ngành dịch vụ công phù hợp với cơ chế thị trường định hướng ____.","xã hội chủ nghĩa","phong kiến","cộng sản chủ nghĩa","tư bản chủ nghĩa",["7. Phát huy dân chủ XHCN, xây dựng nhà nước pháp quyền","Đẩy mạnh xã hội hóa các ngành dịch vụ công phù hợp với cơ chế thị trường định hướng xã hội chủ nghĩa.",105]],[4,3,"Điền từ thích hợp vào chỗ trống: Trong hoạt động của nhà nước ____, các cơ quan của nhà nước được phân quyền rõ ràng và được mọi người chấp nhận trên nguyên tắc bình đẳng của các thế lực, giai cấp và tầng lớp trong xã hội.","pháp quyền","dân chủ","độc tài","chuyên chính",["6. Nhà nước pháp quyền XHCN ở Việt Nam","Trong hoạt động của nhà nước pháp quyền, các cơ quan của nhà nước được phân quyền rõ ràng và được mọi người chấp nhận trên nguyên tắc bình đẳng của các thế lực, giai cấp và tầng lớp trong xã hội.",100]],[4,2,"Điền từ thích hợp vào chỗ trống: Trong nền dân chủ ____ có sự kết hợp hài hòa về lợi ích giữa cá nhân, lợi ích tập thể và lợi ích của toàn xã hội.","xã hội chủ nghĩa","chiếm hữu nô lệ","cộng sản chủ nghĩa","tư bản chủ nghĩa",["2. Dân chủ xã hội chủ nghĩa","Trong nền dân chủ xã hội chủ nghĩa có sự kết hợp hài hòa về lợi ích giữa cá nhân, lợi ích tập thể và lợi ích của toàn xã hội.",90]],[4,3,"Điền từ thích hợp vào chỗ trống: Nền dân chủ xã hội chủ nghĩa do Đảng Cộng sản lãnh đạo - yếu tố quan trọng để đảm bảo quyền lực thực sự thuộc về nhân dân, bởi vì, Đảng Cộng sản đại biểu cho trí tuệ, lợi ích của ____, nhân dân lao động và toàn dân tộc.","giai cấp công nhân","đội ngũ trí thức","giai cấp tư sản","giai cấp nông dân",["2. Dân chủ xã hội chủ nghĩa","Nền dân chủ xã hội chủ nghĩa do Đảng Cộng sản lãnh đạo - yếu tố quan trọng để đảm bảo quyền lực thực sự thuộc về nhân dân, bởi vì, Đảng Cộng sản đại biểu cho trí tuệ, lợi ích của giai cấp công nhân, nhân dân lao động và toàn dân tộc.",87]],[4,3,"Điền từ thích hợp vào chỗ trống: Trong hệ thống chính trị ____, nhà nước là thiết chế có chức năng trực tiếp nhất trong việc thể chế hóa và tổ chức thực hiện những yêu cầu dân chủ chân chính của nhân dân.","xã hội chủ nghĩa","tư bản chủ nghĩa","phong kiến","cộng sản chủ nghĩa",["4. Quan hệ giữa dân chủ XHCN và nhà nước XHCN","Trong hệ thống chính trị xã hội chủ nghĩa, nhà nước là thiết chế có chức năng trực tiếp nhất trong việc thể chế hóa và tổ chức thực hiện những yêu cầu dân chủ chân chính của nhân dân.",96]],[4,2,"Điền từ thích hợp vào chỗ trống: Nền ____ chủ nô được tổ chức thành nhà nước với đặc trưng là dân tham gia bầu ra nhà nước.","dân chủ","độc tài","pháp quyền","chuyên chính",["1. Dân chủ và sự ra đời, phát triển của dân chủ","Nền dân chủ chủ nô được tổ chức thành nhà nước với đặc trưng là dân tham gia bầu ra nhà nước.",83]],[4,3,"Điền từ thích hợp vào chỗ trống: Thực tiễn xây dựng đất nước cho thấy, ____ xã hội chủ nghĩa được thể hiện ở việc bảo đảm và phát huy quyền làm chủ của nhân dân theo hướng ngày càng mở rộng và hoạt động có hiệu quả.","dân chủ","độc tài","chuyên chính","pháp quyền",["5. Dân chủ XHCN ở Việt Nam","Thực tiễn xây dựng đất nước cho thấy, dân chủ xã hội chủ nghĩa được thể hiện ở việc bảo đảm và phát huy quyền làm chủ của nhân dân theo hướng ngày càng mở rộng và hoạt động có hiệu quả.",99]],[4,3,"Điền từ thích hợp vào chỗ trống: Từ những cách tiếp cận trên, có thể hiểu: Dân chủ là một giá trị xã hội phản ánh những quyền cơ bản của con người; là một hình thức tổ chức ____ của giai cấp cầm quyền; có quá trình ra đời, phát triển cùng với lịch sử xã hội nhân loại.","nhà nước","quyền lực","Quốc hội","Hiến pháp",["1. Dân chủ và sự ra đời, phát triển của dân chủ","Từ những cách tiếp cận trên, có thể hiểu: Dân chủ là một giá trị xã hội phản ánh những quyền cơ bản của con người; là một hình thức tổ chức nhà nước của giai cấp cầm quyền; có quá trình ra đời, phát triển cùng với lịch sử xã hội nhân loại.",83]],[4,3,"Điền từ thích hợp vào chỗ trống: Bản chất kinh tế của nền ____ xã hội chủ nghĩa dù khác về bản chất kinh tế của các chế độ tư hữu, áp bức, bóc lột, bất công, nhưng cũng như toàn bộ nền kinh tế xã hội chủ nghĩa, nó không hình thành từ “hư vô” theo mong muốn của bất kỳ ai.","dân chủ","chuyên chính","pháp quyền","độc tài",["2. Dân chủ xã hội chủ nghĩa","Bản chất kinh tế của nền dân chủ xã hội chủ nghĩa dù khác về bản chất kinh tế của các chế độ tư hữu, áp bức, bóc lột, bất công, nhưng cũng như toàn bộ nền kinh tế xã hội chủ nghĩa, nó không hình thành từ “hư vô” theo mong muốn của bất kỳ ai.",89]],[4,2,"Điền từ thích hợp vào chỗ trống: Nhà nước ____ “không phải chỉ là bạo lực đối với bọn bóc lột, và cũng không phải chủ yếu là bạo lực.","xã hội chủ nghĩa","phong kiến","cộng sản chủ nghĩa","chiếm hữu nô lệ",["3. Nhà nước XHCN: ra đời, bản chất, chức năng","Nhà nước xã hội chủ nghĩa “không phải chỉ là bạo lực đối với bọn bóc lột, và cũng không phải chủ yếu là bạo lực.",94]],[4,3,"Điền từ thích hợp vào chỗ trống: Điểm khác biệt cơ bản giữa cách hiểu về ____ thời cổ đại và hiện nay là ở tính chất trực tiếp của mối quan hệ sở hữu quyền lực công cộng và cách hiểu về nội hàm của khái niệm nhân dân.","dân chủ","pháp quyền","độc tài","chuyên chính",["1. Dân chủ và sự ra đời, phát triển của dân chủ","Điểm khác biệt cơ bản giữa cách hiểu về dân chủ thời cổ đại và hiện nay là ở tính chất trực tiếp của mối quan hệ sở hữu quyền lực công cộng và cách hiểu về nội hàm của khái niệm nhân dân.",80]],[4,3,"Điền từ thích hợp vào chỗ trống: ____ đi đôi với kỷ luật, kỷ cương, phải được thể chế hóa bằng pháp luật và được pháp luật bảo đảm”.","Dân chủ","Quốc hội","bầu cử","Hiến pháp",["1. Dân chủ và sự ra đời, phát triển của dân chủ","Dân chủ đi đôi với kỷ luật, kỷ cương, phải được thể chế hóa bằng pháp luật và được pháp luật bảo đảm”.",83]],[4,3,"Điền từ thích hợp vào chỗ trống: Dân chủ gắn với ____ (phải đi đôi với kỷ luật, kỷ cương).","pháp luật","Quốc hội","nhà nước","quyền lực",["5. Dân chủ XHCN ở Việt Nam","Dân chủ gắn với pháp luật (phải đi đôi với kỷ luật, kỷ cương).",98]],[4,3,"Điền từ thích hợp vào chỗ trống: Theo chủ nghĩa Mác - Lênin, giai cấp vô sản không thể hoàn thành cuộc cách mạng ____ nếu họ không được chuẩn bị để tiến tới cuộc cách mạng đó thông qua cuộc đấu tranh cho dân chủ.","xã hội chủ nghĩa","tư bản chủ nghĩa","chiếm hữu nô lệ","phong kiến",["2. Dân chủ xã hội chủ nghĩa","Theo chủ nghĩa Mác - Lênin, giai cấp vô sản không thể hoàn thành cuộc cách mạng xã hội chủ nghĩa nếu họ không được chuẩn bị để tiến tới cuộc cách mạng đó thông qua cuộc đấu tranh cho dân chủ.",85]],[4,2,"Điền từ thích hợp vào chỗ trống: Rằng, chủ nghĩa xã hội không thể duy trì và thắng lợi, nếu không thực hiện đầy đủ ____.","dân chủ","chuyên chính","pháp quyền","độc tài",["2. Dân chủ xã hội chủ nghĩa","Rằng, chủ nghĩa xã hội không thể duy trì và thắng lợi, nếu không thực hiện đầy đủ dân chủ.",85]],[4,3,"Điền từ thích hợp vào chỗ trống: Quá trình đó làm cho dân chủ trở thành một thói quen, một tập quán trong sinh hoạt xã hội... để đến lúc nó không còn tồn tại như một thể chế ____, một chế độ, tức là mất đi tính chính trị của nó.","nhà nước","tôn giáo","tín ngưỡng","giai cấp",["2. Dân chủ xã hội chủ nghĩa","Quá trình đó làm cho dân chủ trở thành một thói quen, một tập quán trong sinh hoạt xã hội... để đến lúc nó không còn tồn tại như một thể chế nhà nước, một chế độ, tức là mất đi tính chính trị của nó.",86]],[4,1,"Điền từ thích hợp vào chỗ trống: ____ còn nhấn mạnh rằng: Dân chủ xã hội chủ nghĩa là chế độ dân chủ của đại đa số dân cư, của những người lao động bị bóc lột, là chế độ mà nhân dân ngày càng tham gia nhiều vào công việc nhà nước.","V.I. Lênin","C.Mác","Ph.Ăngghen","Hồ Chí Minh",["2. Dân chủ xã hội chủ nghĩa","V.I. Lênin còn nhấn mạnh rằng: Dân chủ xã hội chủ nghĩa là chế độ dân chủ của đại đa số dân cư, của những người lao động bị bóc lột, là chế độ mà nhân dân ngày càng tham gia nhiều vào công việc nhà nước.",88]],[4,1,"Điền từ thích hợp vào chỗ trống: Hình thức dân chủ gián tiếp là hình thức ____, được thực hiện do nhân dân “ủy quyền”, giao quyền lực của mình cho tổ chức mà nhân dân trực tiếp bầu ra.","dân chủ đại diện","chức năng đối ngoại","chức năng đối nội","chuyên chính vô sản",["5. Dân chủ XHCN ở Việt Nam","Hình thức dân chủ gián tiếp là hình thức dân chủ đại diện, được thực hiện do nhân dân “ủy quyền”, giao quyền lực của mình cho tổ chức mà nhân dân trực tiếp bầu ra.",98]],[4,3,"Điền từ thích hợp vào chỗ trống: Cùng với đó là những tiêu cực trong đời sống xã hội chưa được khắc phục triệt để... làm ảnh hưởng đến bản chất tốt đẹp của chế độ ____ nước ta, làm suy giảm động lực phát triển của đất nước.","dân chủ","chuyên chính","pháp quyền","độc tài",["5. Dân chủ XHCN ở Việt Nam","Cùng với đó là những tiêu cực trong đời sống xã hội chưa được khắc phục triệt để... làm ảnh hưởng đến bản chất tốt đẹp của chế độ dân chủ nước ta, làm suy giảm động lực phát triển của đất nước.",100]],[4,2,"Điền từ thích hợp vào chỗ trống: Cải tạo xã hội cũ, xây dựng thành công xã hội mới là nội dung chủ yếu và mục đích cuối cùng của ____ xã hội chủ nghĩa.","nhà nước","tôn giáo","tín ngưỡng","giai cấp",["3. Nhà nước XHCN: ra đời, bản chất, chức năng","Cải tạo xã hội cũ, xây dựng thành công xã hội mới là nội dung chủ yếu và mục đích cuối cùng của nhà nước xã hội chủ nghĩa.",94]],[4,3,"Điền từ thích hợp vào chỗ trống: Cùng với sự tan rã của chế độ chiếm hữu nô lệ, lịch sử xã hội loài người bước vào thời kỳ đen tối với sự thống trị của ____ chuyên chế phong kiến, chế độ dân chủ chủ nô đã bị xóa bỏ và thay vào đó là chế độ độc tài chuyên chế phong kiến.","nhà nước","tôn giáo","dân tộc","gia đình",["1. Dân chủ và sự ra đời, phát triển của dân chủ","Cùng với sự tan rã của chế độ chiếm hữu nô lệ, lịch sử xã hội loài người bước vào thời kỳ đen tối với sự thống trị của nhà nước chuyên chế phong kiến, chế độ dân chủ chủ nô đã bị xóa bỏ và thay vào đó là chế độ độc tài chuyên chế phong kiến.",84]],[4,3,"Điền từ thích hợp vào chỗ trống: ____ gắn liền với kỷ luật, kỷ cương và phải được thể chế hóa bằng pháp luật, được pháp luật bảo đảm...”.","Dân chủ","Quốc hội","Hiến pháp","nhà nước",["5. Dân chủ XHCN ở Việt Nam","Dân chủ gắn liền với kỷ luật, kỷ cương và phải được thể chế hóa bằng pháp luật, được pháp luật bảo đảm...”.",97]],[4,2,"Điền từ thích hợp vào chỗ trống: Nền ____ xã hội chủ nghĩa ra sức động viên, thu hút mọi tiềm năng sáng tạo, tính tích cực xã hội của nhân dân trong sự nghiệp xây dựng xã hội mới.","dân chủ","pháp quyền","chuyên chính","độc tài",["2. Dân chủ xã hội chủ nghĩa","Nền dân chủ xã hội chủ nghĩa ra sức động viên, thu hút mọi tiềm năng sáng tạo, tính tích cực xã hội của nhân dân trong sự nghiệp xây dựng xã hội mới.",90]],[4,2,"Điền từ thích hợp vào chỗ trống: Có như vậy, Đảng mới đảm bảo sự lãnh đạo trong sự nghiệp xây dựng chủ nghĩa xã hội và xây dựng nền dân chủ ____.","xã hội chủ nghĩa","chiếm hữu nô lệ","cộng sản chủ nghĩa","phong kiến",["7. Phát huy dân chủ XHCN, xây dựng nhà nước pháp quyền","Có như vậy, Đảng mới đảm bảo sự lãnh đạo trong sự nghiệp xây dựng chủ nghĩa xã hội và xây dựng nền dân chủ xã hội chủ nghĩa.",103]],[4,2,"Điền từ thích hợp vào chỗ trống: Quyền làm chủ của nhân dân là tất cả ____ đều thuộc về nhân dân, dân là gốc, là chủ, dân làm chủ.","quyền lực","bầu cử","Quốc hội","nhà nước",["5. Dân chủ XHCN ở Việt Nam","Quyền làm chủ của nhân dân là tất cả quyền lực đều thuộc về nhân dân, dân là gốc, là chủ, dân làm chủ.",97]],[4,2,"Điền từ thích hợp vào chỗ trống: Người khẳng định: “Chế độ ta là chế độ ____, tức là nhân dân là người chủ, mà Chính phủ là người đày tớ trung thành của nhân dân”.","dân chủ","độc tài","pháp quyền","chuyên chính",["1. Dân chủ và sự ra đời, phát triển của dân chủ","Người khẳng định: “Chế độ ta là chế độ dân chủ, tức là nhân dân là người chủ, mà Chính phủ là người đày tớ trung thành của nhân dân”.",82]],[4,3,"Điền từ thích hợp vào chỗ trống: Quá trình phát triển của nền dân chủ ____ là từ thấp tới cao, từ chưa hoàn thiện đến hoàn thiện; có sự kế thừa một cách chọn lọc giá trị của các nền dân chủ trước đó, trước hết là nền dân chủ tư sản.","xã hội chủ nghĩa","cộng sản chủ nghĩa","chiếm hữu nô lệ","phong kiến",["2. Dân chủ xã hội chủ nghĩa","Quá trình phát triển của nền dân chủ xã hội chủ nghĩa là từ thấp tới cao, từ chưa hoàn thiện đến hoàn thiện; có sự kế thừa một cách chọn lọc giá trị của các nền dân chủ trước đó, trước hết là nền dân chủ tư sản.",85]],[4,1,"Điền từ thích hợp vào chỗ trống: Sự lãnh đạo của giai cấp công nhân thông qua Đảng Cộng sản đối với toàn xã hội về mọi mặt - ____ gọi là sự thống trị chính trị.","V.I. Lênin","C.Mác","Ph.Ăngghen","Hồ Chí Minh",["2. Dân chủ xã hội chủ nghĩa","Sự lãnh đạo của giai cấp công nhân thông qua Đảng Cộng sản đối với toàn xã hội về mọi mặt - V.I. Lênin gọi là sự thống trị chính trị.",88]],[4,3,"Điền từ thích hợp vào chỗ trống: Nhà nước pháp quyền ____ ở Việt Nam mang bản chất giai cấp công nhân, phục vụ lợi ích cho nhân dân; nhà nước là công cụ chủ yếu để Đảng Cộng sản Việt Nam định hướng đi lên chủ nghĩa xã hội.","xã hội chủ nghĩa","cộng sản chủ nghĩa","tư bản chủ nghĩa","phong kiến",["6. Nhà nước pháp quyền XHCN ở Việt Nam","Nhà nước pháp quyền xã hội chủ nghĩa ở Việt Nam mang bản chất giai cấp công nhân, phục vụ lợi ích cho nhân dân; nhà nước là công cụ chủ yếu để Đảng Cộng sản Việt Nam định hướng đi lên chủ nghĩa xã hội.",102]],[4,3,"Điền từ thích hợp vào chỗ trống: Tăng cường công tác giám sát, phản biện xã hội là yếu tố đảm bảo xây dựng nền ____ xã hội chủ nghĩa ở nước ta, ảnh hưởng tới đời sống tâm lý của nhân dân khi nhìn nhận đánh giá các chủ trương, đường lối của Đảng, chính sách, pháp luật của Nhà nước.","dân chủ","độc tài","pháp quyền","chuyên chính",["7. Phát huy dân chủ XHCN, xây dựng nhà nước pháp quyền","Tăng cường công tác giám sát, phản biện xã hội là yếu tố đảm bảo xây dựng nền dân chủ xã hội chủ nghĩa ở nước ta, ảnh hưởng tới đời sống tâm lý của nhân dân khi nhìn nhận đánh giá các chủ trương, đường lối của Đảng, chính sách, pháp luật của Nhà nước.",104]],[5,2,"Điền từ thích hợp vào chỗ trống: ____ - lực lượng đi đầu của quá trình này sẽ có những biến đổi nhanh cả về số lượng, chất lượng và có sự thay đổi đa dạng về cơ cấu.","Giai cấp công nhân","tư liệu sản xuất","cơ cấu xã hội","đội ngũ trí thức",["3. Cơ cấu xã hội - giai cấp ở Việt Nam","Giai cấp công nhân - lực lượng đi đầu của quá trình này sẽ có những biến đổi nhanh cả về số lượng, chất lượng và có sự thay đổi đa dạng về cơ cấu.",116]],[5,3,"Điền từ thích hợp vào chỗ trống: Trong thời kỳ mới, cơ cấu kinh tế tất yếu có những biến đổi và những thay đổi đó cũng tất yếu dẫn đến những thay đổi trong cơ cấu xã hội theo hướng phục vụ thiết thực lợi ích của ____ và nhân dân lao động do Đảng Cộng sản lãnh đạo.","giai cấp công nhân","giai cấp nông dân","đội ngũ trí thức","giai cấp tư sản",["2. Biến đổi có tính quy luật của cơ cấu xã hội - giai cấp","Trong thời kỳ mới, cơ cấu kinh tế tất yếu có những biến đổi và những thay đổi đó cũng tất yếu dẫn đến những thay đổi trong cơ cấu xã hội theo hướng phục vụ thiết thực lợi ích của giai cấp công nhân và nhân dân lao động do Đảng Cộng sản lãnh đạo.",109]],[5,3,"Điền từ thích hợp vào chỗ trống: Khẳng định vai trò của trí thức trong khối liên minh, V.I. Lênin viết: “Trước sự liên minh của các đại biểu khoa học, ____ vô sản và giới kỹ thuật, không một thế lực đen tối nào đứng vững được”.","giai cấp","dân tộc","tôn giáo","gia đình",["2. Biến đổi có tính quy luật của cơ cấu xã hội - giai cấp","Khẳng định vai trò của trí thức trong khối liên minh, V.I. Lênin viết: “Trước sự liên minh của các đại biểu khoa học, giai cấp vô sản và giới kỹ thuật, không một thế lực đen tối nào đứng vững được”.",114]],[5,1,"Điền từ thích hợp vào chỗ trống: Hỗ trợ, khuyến khích nông dân học nghề, chuyển dịch cơ cấu lao động, tiếp nhận và ứng dụng tiến bộ khoa học công nghệ, tạo điều kiện thuận lợi để nông dân chuyển sang làm công nghiệp và ____.","dịch vụ","thành thị","liên minh","nông thôn",["4. Liên minh giai cấp, tầng lớp","Hỗ trợ, khuyến khích nông dân học nghề, chuyển dịch cơ cấu lao động, tiếp nhận và ứng dụng tiến bộ khoa học công nghệ, tạo điều kiện thuận lợi để nông dân chuyển sang làm công nghiệp và dịch vụ.",123]],[5,3,"Điền từ thích hợp vào chỗ trống: Cơ cấu kinh tế trong thời kỳ quá độ tuy vận động theo cơ chế thị trường, song có sự quản lý của Nhà nước pháp quyền ____ nhằm xây dựng thành công chủ nghĩa xã hội.","xã hội chủ nghĩa","chiếm hữu nô lệ","tư bản chủ nghĩa","phong kiến",["2. Biến đổi có tính quy luật của cơ cấu xã hội - giai cấp","Cơ cấu kinh tế trong thời kỳ quá độ tuy vận động theo cơ chế thị trường, song có sự quản lý của Nhà nước pháp quyền xã hội chủ nghĩa nhằm xây dựng thành công chủ nghĩa xã hội.",109]],[5,3,"Điền từ thích hợp vào chỗ trống: Nội dung này cần thực hiện nhằm thỏa mãn các nhu cầu, lợi ích kinh tế thiết thân của ____, giai cấp nông dân, đội ngũ trí thức và các tầng lớp khác trong xã hội, nhằm tạo cơ sở vật chất - kỹ thuật cần thiết cho chủ nghĩa xã hội.","giai cấp công nhân","cơ cấu xã hội","tư liệu sản xuất","cơ cấu kinh tế",["4. Liên minh giai cấp, tầng lớp","Nội dung này cần thực hiện nhằm thỏa mãn các nhu cầu, lợi ích kinh tế thiết thân của giai cấp công nhân, giai cấp nông dân, đội ngũ trí thức và các tầng lớp khác trong xã hội, nhằm tạo cơ sở vật chất - kỹ thuật cần thiết cho chủ nghĩa xã hội.",119]],[5,3,"Điền từ thích hợp vào chỗ trống: Nâng cao nhận thức về tầm quan trọng của khối liên minh, của việc phát huy vai trò của mọi thành phần trong cơ cấu xã hội - ____, từ đó xây dựng chủ trương, chính sách đúng đắn, phù hợp với từng đối tượng để tạo động lực và tạo sự đồng thuận xã hội.","giai cấp","dân tộc","gia đình","tín ngưỡng",["4. Liên minh giai cấp, tầng lớp","Nâng cao nhận thức về tầm quan trọng của khối liên minh, của việc phát huy vai trò của mọi thành phần trong cơ cấu xã hội - giai cấp, từ đó xây dựng chủ trương, chính sách đúng đắn, phù hợp với từng đối tượng để tạo động lực và tạo sự đồng thuận xã hội.",124]],[5,2,"Điền từ thích hợp vào chỗ trống: ____ muốn biến đổi theo hướng tích cực phải dựa trên cơ sở tăng trưởng và phát triển kinh tế nhanh bền vững.","Cơ cấu xã hội","giai cấp nông dân","thành phần kinh tế","đội ngũ trí thức",["4. Liên minh giai cấp, tầng lớp","Cơ cấu xã hội muốn biến đổi theo hướng tích cực phải dựa trên cơ sở tăng trưởng và phát triển kinh tế nhanh bền vững.",122]],[5,2,"Điền từ thích hợp vào chỗ trống: Chính cái kết cấu kinh tế đa dạng, phức tạp này dẫn đến những biến đổi đa dạng, phức tạp trong ____ mà biểu hiện của nó là trong thời kỳ quá độ lên chủ nghĩa xã hội còn tồn tại các giai cấp, tầng lớp xã hội khác nhau.","cơ cấu xã hội - giai cấp","đồng minh","khoa học và công nghệ","dịch vụ",["2. Biến đổi có tính quy luật của cơ cấu xã hội - giai cấp","Chính cái kết cấu kinh tế đa dạng, phức tạp này dẫn đến những biến đổi đa dạng, phức tạp trong cơ cấu xã hội - giai cấp mà biểu hiện của nó là trong thời kỳ quá độ lên chủ nghĩa xã hội còn tồn tại các giai cấp, tầng lớp xã hội khác nhau.",111]],[5,3,"Điền từ thích hợp vào chỗ trống: Khi bước vào thời kỳ quá độ lên chủ nghĩa xã hội, V.I. Lênin chỉ rõ nội dung cơ bản nhất của thời kỳ này là: chính trị đã chuyển trọng tâm sang chính trị trong lĩnh vực kinh tế, đấu tranh ____ mang những nội dung và hình thức mới.","giai cấp","dân tộc","tín ngưỡng","gia đình",["4. Liên minh giai cấp, tầng lớp","Khi bước vào thời kỳ quá độ lên chủ nghĩa xã hội, V.I. Lênin chỉ rõ nội dung cơ bản nhất của thời kỳ này là: chính trị đã chuyển trọng tâm sang chính trị trong lĩnh vực kinh tế, đấu tranh giai cấp mang những nội dung và hình thức mới.",119]],[5,3,"Điền từ thích hợp vào chỗ trống: Bốn là, hoàn thiện thể chế kinh tế thị trường định hướng ____, đẩy mạnh phát triển khoa học và công nghệ, tạo môi trường và điều kiện thuận lợi để phát huy vai trò của các chủ thể trong khối liên minh.","xã hội chủ nghĩa","chiếm hữu nô lệ","cộng sản chủ nghĩa","phong kiến",["4. Liên minh giai cấp, tầng lớp","Bốn là, hoàn thiện thể chế kinh tế thị trường định hướng xã hội chủ nghĩa, đẩy mạnh phát triển khoa học và công nghệ, tạo môi trường và điều kiện thuận lợi để phát huy vai trò của các chủ thể trong khối liên minh.",125]],[5,3,"Điền từ thích hợp vào chỗ trống: Nội dung văn hóa, xã hội của liên minh ____, tầng lớp đòi hỏi phải đảm bảo “gắn tăng trưởng kinh tế với phát triển văn hóa, phát triển, xây dựng con người và thực hiện tiến bộ, công bằng xã hội 3”.","giai cấp","tín ngưỡng","gia đình","dân tộc",["4. Liên minh giai cấp, tầng lớp","Nội dung văn hóa, xã hội của liên minh giai cấp, tầng lớp đòi hỏi phải đảm bảo “gắn tăng trưởng kinh tế với phát triển văn hóa, phát triển, xây dựng con người và thực hiện tiến bộ, công bằng xã hội 3”.",121]],[5,1,"Điền từ thích hợp vào chỗ trống: Ông xem đây là một hình thức ____ đặc biệt không chỉ trong giai đoạn giành chính quyền, mà phải được đảm bảo trong suốt quá trình xây dựng chủ nghĩa xã hội.","liên minh","dịch vụ","doanh nhân","tầng lớp",["2. Biến đổi có tính quy luật của cơ cấu xã hội - giai cấp","Ông xem đây là một hình thức liên minh đặc biệt không chỉ trong giai đoạn giành chính quyền, mà phải được đảm bảo trong suốt quá trình xây dựng chủ nghĩa xã hội.",113]],[5,3,"Điền từ thích hợp vào chỗ trống: Văn hóa thực sự trở thành nền tảng tinh thần vững chắc của xã hội, là sức mạnh nội sinh quan trọng bảo đảm sự phát triển bền vững và bảo vệ vững chắc Tổ quốc vì mục tiêu “dân giàu, nước mạnh, ____, công bằng, văn minh”.","dân chủ","pháp quyền","độc tài","chuyên chính",["4. Liên minh giai cấp, tầng lớp","Văn hóa thực sự trở thành nền tảng tinh thần vững chắc của xã hội, là sức mạnh nội sinh quan trọng bảo đảm sự phát triển bền vững và bảo vệ vững chắc Tổ quốc vì mục tiêu “dân giàu, nước mạnh, dân chủ, công bằng, văn minh”.",121]],[5,3,"Điền từ thích hợp vào chỗ trống: Trong thời kỳ quá độ lên chủ nghĩa xã hội, giai cấp công nhân, giai cấp nông dân và tầng lớp lao động khác vừa là ____ cơ bản, vừa là lực lượng chính trị - xã hội to lớn.","lực lượng sản xuất","quan hệ sản xuất","kiến trúc thượng tầng","cơ sở hạ tầng",["2. Biến đổi có tính quy luật của cơ cấu xã hội - giai cấp","Trong thời kỳ quá độ lên chủ nghĩa xã hội, giai cấp công nhân, giai cấp nông dân và tầng lớp lao động khác vừa là lực lượng sản xuất cơ bản, vừa là lực lượng chính trị - xã hội to lớn.",113]],[5,2,"Điền từ thích hợp vào chỗ trống: Xây dựng và hoàn thiện thể chế kinh tế thị trường định hướng xã hội chủ nghĩa nhằm bảo đảm hài hòa lợi ích giữa các ____, tầng lớp xã hội.","giai cấp","tôn giáo","tín ngưỡng","gia đình",["4. Liên minh giai cấp, tầng lớp","Xây dựng và hoàn thiện thể chế kinh tế thị trường định hướng xã hội chủ nghĩa nhằm bảo đảm hài hòa lợi ích giữa các giai cấp, tầng lớp xã hội.",125]],[5,1,"Điền từ thích hợp vào chỗ trống: Trên thực tế, trong bước đầu của thời kỳ quá độ lên chủ nghĩa xã hội, ____ đã chủ trương mở rộng khối liên minh giữa giai cấp công nhân với giai cấp nông dân và các tầng lớp xã hội khác.","V.I. Lênin","C.Mác","Ph.Ăngghen","Hồ Chí Minh",["2. Biến đổi có tính quy luật của cơ cấu xã hội - giai cấp","Trên thực tế, trong bước đầu của thời kỳ quá độ lên chủ nghĩa xã hội, V.I. Lênin đã chủ trương mở rộng khối liên minh giữa giai cấp công nhân với giai cấp nông dân và các tầng lớp xã hội khác.",113]],[5,3,"Điền từ thích hợp vào chỗ trống: Đoàn Thanh niên Cộng sản Hồ Chí Minh, Hội Liên hiệp Thanh niên Việt Nam cần chủ động hướng dẫn các hình thức hoạt động, các phong trào thi đua yêu nước, phát huy tài năng sáng tạo của tuổi trẻ vì sự nghiệp xây dựng và bảo vệ Tổ quốc ____.","xã hội chủ nghĩa","cộng sản chủ nghĩa","phong kiến","chiếm hữu nô lệ",["4. Liên minh giai cấp, tầng lớp","Đoàn Thanh niên Cộng sản Hồ Chí Minh, Hội Liên hiệp Thanh niên Việt Nam cần chủ động hướng dẫn các hình thức hoạt động, các phong trào thi đua yêu nước, phát huy tài năng sáng tạo của tuổi trẻ vì sự nghiệp xây dựng và bảo vệ Tổ quốc xã hội chủ nghĩa.",126]],[5,2,"Điền từ thích hợp vào chỗ trống: Sự biến đổi phức tạp, đa dạng của ____ Việt Nam diễn ra trong nội bộ từng giai cấp, tầng lớp cơ bản của xã hội; thậm chí có sự chuyển hóa lẫn nhau giữa các giai cấp, tầng lớp, đồng thời xuất hiện những tầng lớp xã hội mới.","cơ cấu xã hội - giai cấp","công nghiệp hóa","Đảng Cộng sản","đồng minh",["3. Cơ cấu xã hội - giai cấp ở Việt Nam","Sự biến đổi phức tạp, đa dạng của cơ cấu xã hội - giai cấp Việt Nam diễn ra trong nội bộ từng giai cấp, tầng lớp cơ bản của xã hội; thậm chí có sự chuyển hóa lẫn nhau giữa các giai cấp, tầng lớp, đồng thời xuất hiện những tầng lớp xã hội mới.",115]],[5,2,"Điền từ thích hợp vào chỗ trống: Cần có sự quan tâm thích đáng và phù hợp đối với mỗi ____, tầng lớp trong xã hội.","giai cấp","gia đình","nhà nước","tôn giáo",["4. Liên minh giai cấp, tầng lớp","Cần có sự quan tâm thích đáng và phù hợp đối với mỗi giai cấp, tầng lớp trong xã hội.",123]],[5,2,"Điền từ thích hợp vào chỗ trống: Các loại hình ____ khác không có được những mối quan hệ quan trọng và quyết định này.","cơ cấu xã hội","thành phần kinh tế","giai cấp công nhân","đội ngũ trí thức",["1. Khái niệm và vị trí của cơ cấu xã hội - giai cấp","Các loại hình cơ cấu xã hội khác không có được những mối quan hệ quan trọng và quyết định này.",108]],[5,1,"Điền từ thích hợp vào chỗ trống: Mặc dù ____ giữ vị trí quan trọng, song không vì thế mà tuyệt đôi hóa nó, xem nhẹ các loại hình cơ cấu xã hội khác, từ đó có thể dẫn đến tùy tiện, muốn xóa bỏ nhanh chóng các giai cấp, tầng lớp xã hội một cách giản đơn theo ý muốn chủ quan.","cơ cấu xã hội - giai cấp","đội ngũ trí thức","khoa học và công nghệ","doanh nhân",["1. Khái niệm và vị trí của cơ cấu xã hội - giai cấp","Mặc dù cơ cấu xã hội - giai cấp giữ vị trí quan trọng, song không vì thế mà tuyệt đôi hóa nó, xem nhẹ các loại hình cơ cấu xã hội khác, từ đó có thể dẫn đến tùy tiện, muốn xóa bỏ nhanh chóng các giai cấp, tầng lớp xã hội một cách giản đơn theo ý muốn chủ quan.",109]],[5,2,"Điền từ thích hợp vào chỗ trống: Tạo ra cơ hội công bằng cho mọi thành phần xã hội để tiếp cận đến sự phát triển về sở hữu ____, về giáo dục, y tế, các chính sách an sinh xã hội, v.v..","tư liệu sản xuất","cơ cấu kinh tế","đội ngũ trí thức","giai cấp công nhân",["4. Liên minh giai cấp, tầng lớp","Tạo ra cơ hội công bằng cho mọi thành phần xã hội để tiếp cận đến sự phát triển về sở hữu tư liệu sản xuất, về giáo dục, y tế, các chính sách an sinh xã hội, v.v..",122]],[5,2,"Điền từ thích hợp vào chỗ trống: Điều này có ảnh hưởng nhất định đến sự đoàn kết, thống nhất của khối ____.","liên minh","tầng lớp","dịch vụ","thành thị",["2. Biến đổi có tính quy luật của cơ cấu xã hội - giai cấp","Điều này có ảnh hưởng nhất định đến sự đoàn kết, thống nhất của khối liên minh.",114]],[5,3,"Điền từ thích hợp vào chỗ trống: Động viên các lực lượng trong khối liên minh gương mẫu chấp hành đường lối chính trị của Đảng; pháp luật và chính sách của Nhà nước; sẵn sàng tham gia chiến đấu bảo vệ những thành quả cách mạng, bảo vệ chế độ ____.","xã hội chủ nghĩa","tư bản chủ nghĩa","cộng sản chủ nghĩa","phong kiến",["4. Liên minh giai cấp, tầng lớp","Động viên các lực lượng trong khối liên minh gương mẫu chấp hành đường lối chính trị của Đảng; pháp luật và chính sách của Nhà nước; sẵn sàng tham gia chiến đấu bảo vệ những thành quả cách mạng, bảo vệ chế độ xã hội chủ nghĩa.",121]],[5,1,"Điền từ thích hợp vào chỗ trống: Tôn vinh những ____ có nhiều đóng góp cho sự nghiệp phát triển đất nước.","doanh nhân","dịch vụ","nông nghiệp","nông thôn",["4. Liên minh giai cấp, tầng lớp","Tôn vinh những doanh nhân có nhiều đóng góp cho sự nghiệp phát triển đất nước.",124]],[5,3,"Điền từ thích hợp vào chỗ trống: Hiện nay, cùng với yêu cầu đẩy mạnh công nghiệp hóa, hiện đại hóa gắn với phát triển kinh tế tri thức trong điều kiện khoa học - công nghệ và Cách mạng công nghiệp lần thứ tư đang phát triển mạnh mẽ thì vai trò của ____ càng trở nên quan trọng.","đội ngũ trí thức","giai cấp công nhân","giai cấp tư sản","giai cấp nông dân",["3. Cơ cấu xã hội - giai cấp ở Việt Nam","Hiện nay, cùng với yêu cầu đẩy mạnh công nghiệp hóa, hiện đại hóa gắn với phát triển kinh tế tri thức trong điều kiện khoa học - công nghệ và Cách mạng công nghiệp lần thứ tư đang phát triển mạnh mẽ thì vai trò của đội ngũ trí thức càng trở nên quan trọng.",117]],[5,1,"Điền từ thích hợp vào chỗ trống: Tăng cường khối đại đoàn kết toàn dân tộc trên nền tảng liên minh ____ với giai cấp nông dân và đội ngũ trí thức do Đảng lãnh đạo”.","giai cấp công nhân","tư liệu sản xuất","cơ cấu kinh tế","cơ cấu xã hội",["4. Liên minh giai cấp, tầng lớp","Tăng cường khối đại đoàn kết toàn dân tộc trên nền tảng liên minh giai cấp công nhân với giai cấp nông dân và đội ngũ trí thức do Đảng lãnh đạo”.",118]],[5,2,"Điền từ thích hợp vào chỗ trống: Để thực hiện tốt giải pháp này, vai trò của ____, của đội ngũ doanh nhân là rất quan trọng.","đội ngũ trí thức","giai cấp tư sản","giai cấp công nhân","giai cấp nông dân",["4. Liên minh giai cấp, tầng lớp","Để thực hiện tốt giải pháp này, vai trò của đội ngũ trí thức, của đội ngũ doanh nhân là rất quan trọng.",125]],[5,2,"Điền từ thích hợp vào chỗ trống: Mỗi lĩnh vực của nền kinh tế chỉ phát triển khi được gắn bó chặt chẽ, hỗ trợ cho nhau để cùng phát triển và tạo thành nền ____ quốc dân thống nhất.","cơ cấu kinh tế","tư liệu sản xuất","giai cấp công nhân","giai cấp nông dân",["2. Biến đổi có tính quy luật của cơ cấu xã hội - giai cấp","Mỗi lĩnh vực của nền kinh tế chỉ phát triển khi được gắn bó chặt chẽ, hỗ trợ cho nhau để cùng phát triển và tạo thành nền cơ cấu kinh tế quốc dân thống nhất.",114]],[5,2,"Điền từ thích hợp vào chỗ trống: Một bộ phận công nhân thu nhập thấp, giác ngộ ý thức chính trị ____ chưa cao và còn nhiều khó khăn về mọi mặt vẫn tồn tại.","giai cấp","nhà nước","tín ngưỡng","tôn giáo",["3. Cơ cấu xã hội - giai cấp ở Việt Nam","Một bộ phận công nhân thu nhập thấp, giác ngộ ý thức chính trị giai cấp chưa cao và còn nhiều khó khăn về mọi mặt vẫn tồn tại.",116]],[5,3,"Điền từ thích hợp vào chỗ trống: Trong ____ nông dân xuất hiện những chủ trang trại lớn, đồng thời vẫn còn những nông dân mất ruộng đất, nông dân đỉ làm thuê... sự phân hóa giàu nghèo trong nội bộ nông dân cũng ngày càng rõ.","giai cấp","tín ngưỡng","dân tộc","gia đình",["3. Cơ cấu xã hội - giai cấp ở Việt Nam","Trong giai cấp nông dân xuất hiện những chủ trang trại lớn, đồng thời vẫn còn những nông dân mất ruộng đất, nông dân đỉ làm thuê... sự phân hóa giàu nghèo trong nội bộ nông dân cũng ngày càng rõ.",117]],[5,3,"Điền từ thích hợp vào chỗ trống: Cơ cấu xã hội – giai cấp trong thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam Sau thắng lợi của cuộc cách mạng dân tộc ____ nhân dân, đánh đuổi thực dân đế quốc và thống nhất đất nước, cả nước bước vào thời kỳ quá độ lên chủ nghĩa xã hội.","dân chủ","độc tài","chuyên chính","pháp quyền",["3. Cơ cấu xã hội - giai cấp ở Việt Nam","Cơ cấu xã hội – giai cấp trong thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam Sau thắng lợi của cuộc cách mạng dân tộc dân chủ nhân dân, đánh đuổi thực dân đế quốc và thống nhất đất nước, cả nước bước vào thời kỳ quá độ lên chủ nghĩa xã hội.",115]],[5,3,"Điền từ thích hợp vào chỗ trống: Sau thắng lợi của cuộc cách mạng ____, dưới sự lãnh đạo của Đảng Cộng sản, giai cấp công nhân cùng toàn thể các giai cấp, tầng lớp xã hội, các nhóm xã hội bước vào thời kỳ quá độ lên chủ nghĩa xã hội.","xã hội chủ nghĩa","tư bản chủ nghĩa","chiếm hữu nô lệ","cộng sản chủ nghĩa",["2. Biến đổi có tính quy luật của cơ cấu xã hội - giai cấp","Sau thắng lợi của cuộc cách mạng xã hội chủ nghĩa, dưới sự lãnh đạo của Đảng Cộng sản, giai cấp công nhân cùng toàn thể các giai cấp, tầng lớp xã hội, các nhóm xã hội bước vào thời kỳ quá độ lên chủ nghĩa xã hội.",109]],[5,3,"Điền từ thích hợp vào chỗ trống: Xây dựng ____ vững mạnh là trực tiếp nâng tầm trí tuệ của dân tộc, sức mạnh của đất nước, nâng cao năng lực lãnh đạo của Đảng và chất lượng hoạt động của hệ thống chính trị.","đội ngũ trí thức","giai cấp công nhân","giai cấp tư sản","giai cấp nông dân",["3. Cơ cấu xã hội - giai cấp ở Việt Nam","Xây dựng đội ngũ trí thức vững mạnh là trực tiếp nâng tầm trí tuệ của dân tộc, sức mạnh của đất nước, nâng cao năng lực lãnh đạo của Đảng và chất lượng hoạt động của hệ thống chính trị.",117]],[5,1,"Điền từ thích hợp vào chỗ trống: Các ông đã chỉ ra rằng, nhiều cuộc đấu tranh của giai cấp công nhân ở những nước này thất bại chủ yếu là do giai cấp công nhân “đơn độc” vì đã không tổ chức liên minh với “người bạn đồng minh tự nhiên” của mình là ____.","giai cấp nông dân","thành phần kinh tế","cơ cấu xã hội","đội ngũ trí thức",["2. Biến đổi có tính quy luật của cơ cấu xã hội - giai cấp","Các ông đã chỉ ra rằng, nhiều cuộc đấu tranh của giai cấp công nhân ở những nước này thất bại chủ yếu là do giai cấp công nhân “đơn độc” vì đã không tổ chức liên minh với “người bạn đồng minh tự nhiên” của mình là giai cấp nông dân.",112]],[5,2,"Điền từ thích hợp vào chỗ trống: Xây dựng nền văn hóa và con người Việt Nam phát triển toàn diện, hướng đến chân - thiện - mỹ, thấm nhuần tinh thần dân tộc, nhân văn, ____ và khoa học.","dân chủ","chuyên chính","độc tài","pháp quyền",["4. Liên minh giai cấp, tầng lớp","Xây dựng nền văn hóa và con người Việt Nam phát triển toàn diện, hướng đến chân - thiện - mỹ, thấm nhuần tinh thần dân tộc, nhân văn, dân chủ và khoa học.",121]],[5,2,"Điền từ thích hợp vào chỗ trống: Từ Đại hội VI (1986), dưới sự lãnh đạo của Đảng, Việt Nam chuyển mạnh sang cơ chế thị trường với việc xây dựng nền kinh tế nhiều thành phần định hướng ____.","xã hội chủ nghĩa","tư bản chủ nghĩa","chiếm hữu nô lệ","phong kiến",["3. Cơ cấu xã hội - giai cấp ở Việt Nam","Từ Đại hội VI (1986), dưới sự lãnh đạo của Đảng, Việt Nam chuyển mạnh sang cơ chế thị trường với việc xây dựng nền kinh tế nhiều thành phần định hướng xã hội chủ nghĩa.",115]],[5,2,"Điền từ thích hợp vào chỗ trống: Tiếp tục hoàn thiện thể chế, phát triển kinh tế thị trường định hướng ____...”.","xã hội chủ nghĩa","tư bản chủ nghĩa","phong kiến","chiếm hữu nô lệ",["4. Liên minh giai cấp, tầng lớp","Tiếp tục hoàn thiện thể chế, phát triển kinh tế thị trường định hướng xã hội chủ nghĩa...”.",119]],[5,3,"Điền từ thích hợp vào chỗ trống: Có cơ chế, chính sách đảm bảo quyền lợi của đội ngũ ____.","doanh nhân","tầng lớp","dịch vụ","đồng minh",["4. Liên minh giai cấp, tầng lớp","Có cơ chế, chính sách đảm bảo quyền lợi của đội ngũ doanh nhân.",124]],[5,2,"Điền từ thích hợp vào chỗ trống: Đối với ____, xây dựng đội ngũ ngày càng lớn mạnh, chất lượng cao.","đội ngũ trí thức","giai cấp tư sản","giai cấp nông dân","giai cấp công nhân",["4. Liên minh giai cấp, tầng lớp","Đối với đội ngũ trí thức, xây dựng đội ngũ ngày càng lớn mạnh, chất lượng cao.",123]],[5,2,"Điền từ thích hợp vào chỗ trống: Tiếp tục đổi mới và nâng cao chất lượng hoạt động của Mặt trận Tổ quốc với việc tăng cường khối liên minh ____, tầng lớp và xây dựng khối đại đoàn kết toàn dân.","giai cấp","gia đình","dân tộc","nhà nước",["4. Liên minh giai cấp, tầng lớp","Tiếp tục đổi mới và nâng cao chất lượng hoạt động của Mặt trận Tổ quốc với việc tăng cường khối liên minh giai cấp, tầng lớp và xây dựng khối đại đoàn kết toàn dân.",125]],[5,3,"Điền từ thích hợp vào chỗ trống: Trong thời kỳ quá độ lên chủ nghĩa xã hội, nhiệm vụ trung tâm là phát triển kinh tế, tiến hành ____, hiện đại hóa.","công nghiệp hóa","đồng minh","thành thị","đội ngũ trí thức",["3. Cơ cấu xã hội - giai cấp ở Việt Nam","Trong thời kỳ quá độ lên chủ nghĩa xã hội, nhiệm vụ trung tâm là phát triển kinh tế, tiến hành công nghiệp hóa, hiện đại hóa.",116]],[5,3,"Điền từ thích hợp vào chỗ trống: Trong cơ cấu xã hội - giai cấp ấy, ____, lực lượng tiêu biểu cho phương thức sản xuất mới giữ vai trò chủ đạo, tiên phong trong quá trình công nghiệp hóa, hiện đại hóa đất nước, cải tạo xã hội cũ, xây dựng xã hội mới.","giai cấp công nhân","giai cấp nông dân","giai cấp tư sản","đội ngũ trí thức",["2. Biến đổi có tính quy luật của cơ cấu xã hội - giai cấp","Trong cơ cấu xã hội - giai cấp ấy, giai cấp công nhân, lực lượng tiêu biểu cho phương thức sản xuất mới giữ vai trò chủ đạo, tiên phong trong quá trình công nghiệp hóa, hiện đại hóa đất nước, cải tạo xã hội cũ, xây dựng xã hội mới.",112]],[5,3,"Điền từ thích hợp vào chỗ trống: Ăngghen đã nêu ra nhiều lý luận nền tảng định hướng cho cuộc đấu tranh của ____ đi đến thắng lợi, trong đó lý luận về liên minh công, nông và các tầng lớp lao động khác đã được các ông khái quát thành vấn đề mang tính nguyên tắc.","giai cấp công nhân","giai cấp nông dân","giai cấp tư sản","đội ngũ trí thức",["2. Biến đổi có tính quy luật của cơ cấu xã hội - giai cấp","Ăngghen đã nêu ra nhiều lý luận nền tảng định hướng cho cuộc đấu tranh của giai cấp công nhân đi đến thắng lợi, trong đó lý luận về liên minh công, nông và các tầng lớp lao động khác đã được các ông khái quát thành vấn đề mang tính nguyên tắc.",112]],[5,2,"Điền từ thích hợp vào chỗ trống: Nâng cao vai trò lãnh đạo của Đảng Cộng sản Việt Nam đối với tăng cường liên minh ____, tầng lớp và mở rộng khối đại đoàn kết toàn dân, phát triển bền vững đất nước.","giai cấp","tín ngưỡng","gia đình","dân tộc",["4. Liên minh giai cấp, tầng lớp","Nâng cao vai trò lãnh đạo của Đảng Cộng sản Việt Nam đối với tăng cường liên minh giai cấp, tầng lớp và mở rộng khối đại đoàn kết toàn dân, phát triển bền vững đất nước.",125]],[5,2,"Điền từ thích hợp vào chỗ trống: Trong thời kỳ quá độ lên chủ nghĩa xã hội, ____ là tổng thể các giai cấp, tầng lớp, các nhóm xã hội có mối quan hệ hợp tác và gắn bó chặt chẽ với nhau.","cơ cấu xã hội - giai cấp","tư liệu sản xuất","thành phần kinh tế","nông nghiệp",["1. Khái niệm và vị trí của cơ cấu xã hội - giai cấp","Trong thời kỳ quá độ lên chủ nghĩa xã hội, cơ cấu xã hội - giai cấp là tổng thể các giai cấp, tầng lớp, các nhóm xã hội có mối quan hệ hợp tác và gắn bó chặt chẽ với nhau.",108]],[5,2,"Điền từ thích hợp vào chỗ trống: Một bộ phận nông dân chuyển sang lao động trong các khu công nghiệp hoặc ____ có tính chất công nghiệp và trở thành công nhân.","dịch vụ","nông thôn","nông nghiệp","liên minh",["3. Cơ cấu xã hội - giai cấp ở Việt Nam","Một bộ phận nông dân chuyển sang lao động trong các khu công nghiệp hoặc dịch vụ có tính chất công nghiệp và trở thành công nhân.",117]],[5,2,"Điền từ thích hợp vào chỗ trống: Mọi chính sách, pháp luật của Nhà nước phải nhằm phục vụ, bảo vệ và vì lợi ích căn bản chính đáng của các ____, tầng lớp trong xã hội.","giai cấp","tín ngưỡng","dân tộc","gia đình",["4. Liên minh giai cấp, tầng lớp","Mọi chính sách, pháp luật của Nhà nước phải nhằm phục vụ, bảo vệ và vì lợi ích căn bản chính đáng của các giai cấp, tầng lớp trong xã hội.",125]],[5,1,"Điền từ thích hợp vào chỗ trống: Trong thời kỳ quá độ lên chủ nghĩa xã hội ở nước ta, cơ cấu xã hội – giai cấp cũng vận động, biến đổi theo đúng quy luật: đó là sự biến đổi của ____ bị chi phối bởi những biến đổi trong cơ cấu kinh tế.","cơ cấu xã hội - giai cấp","nông nghiệp","nông thôn","đồng minh",["3. Cơ cấu xã hội - giai cấp ở Việt Nam","Trong thời kỳ quá độ lên chủ nghĩa xã hội ở nước ta, cơ cấu xã hội – giai cấp cũng vận động, biến đổi theo đúng quy luật: đó là sự biến đổi của cơ cấu xã hội - giai cấp bị chi phối bởi những biến đổi trong cơ cấu kinh tế.",115]],[5,2,"Điền từ thích hợp vào chỗ trống: Sự đa dạng của ____ công nhân không chỉ phát triển theo thành phần kinh tế mà còn phát triển theo ngành nghề.","giai cấp","gia đình","nhà nước","dân tộc",["3. Cơ cấu xã hội - giai cấp ở Việt Nam","Sự đa dạng của giai cấp công nhân không chỉ phát triển theo thành phần kinh tế mà còn phát triển theo ngành nghề.",116]],[5,2,"Điền từ thích hợp vào chỗ trống: Đối với ____ nông dân, xây dựng và phát huy vai trò chủ thể của họ trong quá trình phát triển nông nghiệp, xây dựng nông thôn mới.","giai cấp","tín ngưỡng","dân tộc","tôn giáo",["4. Liên minh giai cấp, tầng lớp","Đối với giai cấp nông dân, xây dựng và phát huy vai trò chủ thể của họ trong quá trình phát triển nông nghiệp, xây dựng nông thôn mới.",123]],[5,3,"Điền từ thích hợp vào chỗ trống: Tại Đại hội đại biểu toàn quốc lần thứ XII, Đảng ta tiếp tục khẳng định: “Đại đoàn kết toàn ____ là đường lối chiến lược của cách mạng Việt Nam, là động lực và nguồn lực to lớn trong xây dựng và bảo vệ Tổ quốc.","dân tộc","tín ngưỡng","giai cấp","nhà nước",["4. Liên minh giai cấp, tầng lớp","Tại Đại hội đại biểu toàn quốc lần thứ XII, Đảng ta tiếp tục khẳng định: “Đại đoàn kết toàn dân tộc là đường lối chiến lược của cách mạng Việt Nam, là động lực và nguồn lực to lớn trong xây dựng và bảo vệ Tổ quốc.",118]],[5,3,"Điền từ thích hợp vào chỗ trống: Trong một hệ thống sản xuất nhất định, cơ cấu xã hội - ____ thường xuyên biến đổi do tác động của nhiều yếu tố, đặc biệt là những thay đổi về phương thức sản xuất, về cơ cấu ngành nghề, thành phần kinh tế, cơ cấu kinh tế... Ph.","giai cấp","dân tộc","tín ngưỡng","nhà nước",["2. Biến đổi có tính quy luật của cơ cấu xã hội - giai cấp","Trong một hệ thống sản xuất nhất định, cơ cấu xã hội - giai cấp thường xuyên biến đổi do tác động của nhiều yếu tố, đặc biệt là những thay đổi về phương thức sản xuất, về cơ cấu ngành nghề, thành phần kinh tế, cơ cấu kinh tế... Ph.",109]],[5,2,"Điền từ thích hợp vào chỗ trống: Quan tâm thích đáng và phù hợp với mỗi ____, tầng lớp trong xã hội, đặc biệt là với tầng lớp yếu thế của xã hội.","giai cấp","gia đình","nhà nước","tín ngưỡng",["4. Liên minh giai cấp, tầng lớp","Quan tâm thích đáng và phù hợp với mỗi giai cấp, tầng lớp trong xã hội, đặc biệt là với tầng lớp yếu thế của xã hội.",122]],[5,1,"Điền từ thích hợp vào chỗ trống: Ăngghen chỉ rõ: “Trong mọi thời đại lịch sử, sản xuất kinh tế và ____ - cơ cấu này tất yếu phải do sản xuất kinh tế mà ra, - cả hai cái đó cấu thành cơ sở của lịch sử chính trị và lịch sử tư tưởng của thời đại ấy...”.","cơ cấu xã hội","giai cấp công nhân","tư liệu sản xuất","thành phần kinh tế",["2. Biến đổi có tính quy luật của cơ cấu xã hội - giai cấp","Ăngghen chỉ rõ: “Trong mọi thời đại lịch sử, sản xuất kinh tế và cơ cấu xã hội - cơ cấu này tất yếu phải do sản xuất kinh tế mà ra, - cả hai cái đó cấu thành cơ sở của lịch sử chính trị và lịch sử tư tưởng của thời đại ấy...”.",109]],[5,2,"Điền từ thích hợp vào chỗ trống: Chính những biến đổi trong cơ cấu kinh tế này đã và đang từng bước tăng cường khối liên minh giữa ____ với giai cấp nông dân, đội ngũ trí thức và các tầng lớp xã hội khác.","giai cấp công nhân","tư liệu sản xuất","thành phần kinh tế","cơ cấu xã hội",["2. Biến đổi có tính quy luật của cơ cấu xã hội - giai cấp","Chính những biến đổi trong cơ cấu kinh tế này đã và đang từng bước tăng cường khối liên minh giữa giai cấp công nhân với giai cấp nông dân, đội ngũ trí thức và các tầng lớp xã hội khác.",114]],[5,3,"Điền từ thích hợp vào chỗ trống: Mức độ liên minh, xích lại gần nhau giữa các ____, tầng lớp trong xã hội tùy thuộc vào các điều kiện kinh tế - xã hội của đất nước trong từng giai đoạn của thời kỳ quá độ.","giai cấp","dân tộc","nhà nước","tín ngưỡng",["2. Biến đổi có tính quy luật của cơ cấu xã hội - giai cấp","Mức độ liên minh, xích lại gần nhau giữa các giai cấp, tầng lớp trong xã hội tùy thuộc vào các điều kiện kinh tế - xã hội của đất nước trong từng giai đoạn của thời kỳ quá độ.",111]],[6,2,"Điền từ thích hợp vào chỗ trống: Trong các giai đoạn lịch sử, tín đồ các ____ cùng với các tầng lớp nhân dân làm nên những thắng lợi to lớn, vẻ vang của dân tộc và có ước vọng sống “tốt đời, đẹp đạo”.","tôn giáo","liên hiệp","tín ngưỡng","bình đẳng",["5. Tôn giáo ở Việt Nam, chính sách của Đảng và Nhà nước","Trong các giai đoạn lịch sử, tín đồ các tôn giáo cùng với các tầng lớp nhân dân làm nên những thắng lợi to lớn, vẻ vang của dân tộc và có ước vọng sống “tốt đời, đẹp đạo”.",147]],[6,2,"Điền từ thích hợp vào chỗ trống: Tranh thủ, vận động chức sắc, chức việc, nhà tu hành và tín đồ các ____ xây dựng cuộc sống “tốt đời, đẹp đạo”.","tôn giáo","tín ngưỡng","nhà nước","gia đình",["7. Định hướng giải quyết quan hệ dân tộc, tôn giáo","Tranh thủ, vận động chức sắc, chức việc, nhà tu hành và tín đồ các tôn giáo xây dựng cuộc sống “tốt đời, đẹp đạo”.",155]],[6,2,"Điền từ thích hợp vào chỗ trống: Hiện nay, ____ xu hướng nêu trên diễn ra khá phức tạp trên phạm vi quốc tế và trong từng quốc gia, thậm chí nó bị lợi dụng vào mục đích chính trị nhằm thực hiện chiến lược “diễn biến hòa bình”.","hai","sáu","ba","bốn",["2. CN Mác - Lênin về vấn đề dân tộc","Hiện nay, hai xu hướng nêu trên diễn ra khá phức tạp trên phạm vi quốc tế và trong từng quốc gia, thậm chí nó bị lợi dụng vào mục đích chính trị nhằm thực hiện chiến lược “diễn biến hòa bình”.",132]],[6,3,"Điền từ thích hợp vào chỗ trống: Nhà nước ____ không can thiệp và không cho bất cứ ai can thiệp, xâm phạm đến quyền tự do tín ngưỡng, quyền lựa chọn theo hay không theo tôn giáo của nhân dân.","xã hội chủ nghĩa","cộng sản chủ nghĩa","tư bản chủ nghĩa","chiếm hữu nô lệ",["4. Quan điểm CN Mác - Lênin về tôn giáo","Nhà nước xã hội chủ nghĩa không can thiệp và không cho bất cứ ai can thiệp, xâm phạm đến quyền tự do tín ngưỡng, quyền lựa chọn theo hay không theo tôn giáo của nhân dân.",144]],[6,3,"Điền từ thích hợp vào chỗ trống: Muốn thực hiện ____ dân tộc thì phải từng bước giảm, tiến tới xoá bỏ khoảng cách phát triển giữa các dân tộc về kinh tế, văn hóa, xã hội.","bình đẳng","bộ lạc","giáo hội","tín ngưỡng",["3. Dân tộc và quan hệ dân tộc ở Việt Nam","Muốn thực hiện bình đẳng dân tộc thì phải từng bước giảm, tiến tới xoá bỏ khoảng cách phát triển giữa các dân tộc về kinh tế, văn hóa, xã hội.",136]],[6,3,"Điền từ thích hợp vào chỗ trống: Luật tín ngưỡng, tôn giáo năm ____ quy định: “Tập hợp đồng bào theo tín ngưỡng, tôn giáo và đồng bào không theo tín ngưỡng, tôn giáo xây dựng khối đại đoàn kết toàn dân tộc, xây dựng và bảo vệ Tổ quốc”.","2016","2026","2014","2011",["7. Định hướng giải quyết quan hệ dân tộc, tôn giáo","Luật tín ngưỡng, tôn giáo năm 2016 quy định: “Tập hợp đồng bào theo tín ngưỡng, tôn giáo và đồng bào không theo tín ngưỡng, tôn giáo xây dựng khối đại đoàn kết toàn dân tộc, xây dựng và bảo vệ Tổ quốc”.",154]],[6,2,"Điền từ thích hợp vào chỗ trống: Các ____ hoạt động trong khuôn khổ pháp luật, bình đẳng trước pháp luật.","tôn giáo","nhà nước","tín ngưỡng","gia đình",["5. Tôn giáo ở Việt Nam, chính sách của Đảng và Nhà nước","Các tôn giáo hoạt động trong khuôn khổ pháp luật, bình đẳng trước pháp luật.",148]],[6,3,"Điền từ thích hợp vào chỗ trống: Thực chất nguồn gốc nhận thức của ____ chính là sự tuyệt đối hóa, sự cường điệu mặt chủ thể của nhận thức con người, biến cái nội dung khách quan thành cái siêu nhiên, thần thánh.","tôn giáo","dân tộc","gia đình","tín ngưỡng",["4. Quan điểm CN Mác - Lênin về tôn giáo","Thực chất nguồn gốc nhận thức của tôn giáo chính là sự tuyệt đối hóa, sự cường điệu mặt chủ thể của nhận thức con người, biến cái nội dung khách quan thành cái siêu nhiên, thần thánh.",142]],[6,3,"Điền từ thích hợp vào chỗ trống: ____ là hệ thống những niềm tin, sự ngưỡng mộ, cũng như cách thức thể hiện niềm tin của con người trước các sự vật, hiện tượng, lực lượng có tính thần thánh, linh thiêng để cầu mong sự che chở, giúp đỡ.","Tín ngưỡng","đồng bào","liên hiệp","quốc gia",["4. Quan điểm CN Mác - Lênin về tôn giáo","Tín ngưỡng là hệ thống những niềm tin, sự ngưỡng mộ, cũng như cách thức thể hiện niềm tin của con người trước các sự vật, hiện tượng, lực lượng có tính thần thánh, linh thiêng để cầu mong sự che chở, giúp đỡ.",141]],[6,2,"Điền từ thích hợp vào chỗ trống: Các ____ ở Việt Nam có sự đa dạng về nguồn gốc và truyền thống lịch sử.","tôn giáo","tín ngưỡng","dân tộc","gia đình",["5. Tôn giáo ở Việt Nam, chính sách của Đảng và Nhà nước","Các tôn giáo ở Việt Nam có sự đa dạng về nguồn gốc và truyền thống lịch sử.",146]],[6,2,"Điền từ thích hợp vào chỗ trống: Ở những thời kỳ lịch sử khác nhau, vai trò, tác động của từng ____ đối với đời sống xã hội không giống nhau.","tôn giáo","tín ngưỡng","gia đình","nhà nước",["4. Quan điểm CN Mác - Lênin về tôn giáo","Ở những thời kỳ lịch sử khác nhau, vai trò, tác động của từng tôn giáo đối với đời sống xã hội không giống nhau.",146]],[6,1,"Điền từ thích hợp vào chỗ trống: Tính chất chính trị của ____ chỉ xuất hiện khi xã hội đã phân chia giai cấp, có sự khác biệt, sự đối kháng về lợi ích giai cấp.","tôn giáo","ngôn ngữ","bình đẳng","thị tộc",["4. Quan điểm CN Mác - Lênin về tôn giáo","Tính chất chính trị của tôn giáo chỉ xuất hiện khi xã hội đã phân chia giai cấp, có sự khác biệt, sự đối kháng về lợi ích giai cấp.",143]],[6,2,"Điền từ thích hợp vào chỗ trống: Trong thời đại ngày nay, ____ xu hướng khách quan nêu trên có những biểu hiện rất đa dạng, phong phú.","hai","bảy","ba","năm",["2. CN Mác - Lênin về vấn đề dân tộc","Trong thời đại ngày nay, hai xu hướng khách quan nêu trên có những biểu hiện rất đa dạng, phong phú.",132]],[6,2,"Điền từ thích hợp vào chỗ trống: Thậm chí cả những tình cảm tích cực như tình yêu, lòng biết ơn, lòng kính trọng đối với những người có công với nước, với dân cũng dễ dẫn con người đến với ____ (ví dụ: thờ các anh hùng dân tộc, thờ các thành hoàng làng...).","tôn giáo","lãnh thổ","tộc người","bình đẳng",["4. Quan điểm CN Mác - Lênin về tôn giáo","Thậm chí cả những tình cảm tích cực như tình yêu, lòng biết ơn, lòng kính trọng đối với những người có công với nước, với dân cũng dễ dẫn con người đến với tôn giáo (ví dụ: thờ các anh hùng dân tộc, thờ các thành hoàng làng...).",142]],[6,2,"Điền từ thích hợp vào chỗ trống: Ví dụ, dân tộc Ấn Độ, dân tộc Trung Hoa, dân tộc Việt Nam, v.v.. Theo nghĩa rộng, dân tộc có một số đặc trưng cơ bản sau: Thú nhất, có chung một vùng ____ ổn định.","lãnh thổ","ngôn ngữ","miền núi","tôn giáo",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Ví dụ, dân tộc Ấn Độ, dân tộc Trung Hoa, dân tộc Việt Nam, v.v.. Theo nghĩa rộng, dân tộc có một số đặc trưng cơ bản sau: Thú nhất, có chung một vùng lãnh thổ ổn định.",128]],[6,2,"Điền từ thích hợp vào chỗ trống: Tăng cường quan hệ quân dân, tạo thế trận quốc phòng toàn dân trong vùng đồng bào ____ sinh sống.","dân tộc","giai cấp","gia đình","tín ngưỡng",["3. Dân tộc và quan hệ dân tộc ở Việt Nam","Tăng cường quan hệ quân dân, tạo thế trận quốc phòng toàn dân trong vùng đồng bào dân tộc sinh sống.",139]],[6,2,"Điền từ thích hợp vào chỗ trống: Chủ nghĩa Mác - Lênin cho rằng, ____ là một hình thái ý thức xã hội phản ánh hư ảo hiện thực khách quan.","tôn giáo","giai cấp","dân tộc","tín ngưỡng",["4. Quan điểm CN Mác - Lênin về tôn giáo","Chủ nghĩa Mác - Lênin cho rằng, tôn giáo là một hình thái ý thức xã hội phản ánh hư ảo hiện thực khách quan.",140]],[6,3,"Điền từ thích hợp vào chỗ trống: Trong một quốc gia có nhiều dân tộc, quyền ____ dân tộc phải được thể hiện trên cơ sở pháp lý, nhưng quan trọng hơn là phải được thực hiện trên thực tế.","bình đẳng","bộ tộc","lãnh thổ","bộ lạc",["2. CN Mác - Lênin về vấn đề dân tộc","Trong một quốc gia có nhiều dân tộc, quyền bình đẳng dân tộc phải được thể hiện trên cơ sở pháp lý, nhưng quan trọng hơn là phải được thực hiện trên thực tế.",133]],[6,1,"Điền từ thích hợp vào chỗ trống: ____ là niềm tin của con người vào các lực lượng siêu nhiên, thần thánh đến mức độ mê muội, cuồng tín, dẫn đến những hành vi cực đoan, sai lệch quá mức, trái với các giá trị văn hóa, đạo đức, pháp luật, gây tổn hại cho cá nhân, xã hội và cộng đồng.","Mê tín dị đoan","thiểu số","quốc gia","thần linh",["4. Quan điểm CN Mác - Lênin về tôn giáo","Mê tín dị đoan là niềm tin của con người vào các lực lượng siêu nhiên, thần thánh đến mức độ mê muội, cuồng tín, dẫn đến những hành vi cực đoan, sai lệch quá mức, trái với các giá trị văn hóa, đạo đức, pháp luật, gây tổn hại cho cá nhân, xã hội và cộng đồng.",141]],[6,2,"Điền từ thích hợp vào chỗ trống: Do vậy, việc giải quyết tốt mối quan hệ này là nhằm đảm bảo cho con người những quyền cơ bản về kinh tế, chính trị, văn hóa, xã hội và ____, tôn giáo.","tín ngưỡng","bình đẳng","tộc người","ngôn ngữ",["7. Định hướng giải quyết quan hệ dân tộc, tôn giáo","Do vậy, việc giải quyết tốt mối quan hệ này là nhằm đảm bảo cho con người những quyền cơ bản về kinh tế, chính trị, văn hóa, xã hội và tín ngưỡng, tôn giáo.",155]],[6,2,"Điền từ thích hợp vào chỗ trống: Chẳng hạn, Việt Nam là quốc gia có 54 ____, tức 54 cộng đồng tộc người.","dân tộc","giai cấp","tín ngưỡng","nhà nước",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Chẳng hạn, Việt Nam là quốc gia có 54 dân tộc, tức 54 cộng đồng tộc người.",130]],[6,2,"Điền từ thích hợp vào chỗ trống: Với nghĩa này, khái niệm ____ dùng để chỉ một quốc gia, nghĩa là toàn bộ nhân dân của một nước.","dân tộc","gia đình","nhà nước","tín ngưỡng",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Với nghĩa này, khái niệm dân tộc dùng để chỉ một quốc gia, nghĩa là toàn bộ nhân dân của một nước.",128]],[6,1,"Điền từ thích hợp vào chỗ trống: Văn hóa bao gồm văn hóa vật thể và văn hóa phi vật thể ở mỗi tộc người, phản ánh truyền thống, lối sống, phong tục, tập quán, ____, tôn giáo của tộc người đó.","tín ngưỡng","liên hiệp","giáo hội","bình đẳng",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Văn hóa bao gồm văn hóa vật thể và văn hóa phi vật thể ở mỗi tộc người, phản ánh truyền thống, lối sống, phong tục, tập quán, tín ngưỡng, tôn giáo của tộc người đó.",130]],[6,3,"Điền từ thích hợp vào chỗ trống: Các thành viên cũng như các cộng đồng ____ trong một dân tộc đều chịu sự quản lý, điều khiển của một nhà nước độc lập.","tộc người","ngôn ngữ","tôn giáo","giáo hội",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Các thành viên cũng như các cộng đồng tộc người trong một dân tộc đều chịu sự quản lý, điều khiển của một nhà nước độc lập.",129]],[6,2,"Điền từ thích hợp vào chỗ trống: Đoàn kết, ____ công nhân các dân tộc là cơ sở vững chắc để đoàn kết các tầng lớp nhân dân lao động thuộc các dân tộc trong cuộc đấu tranh chống chủ nghĩa đế quốc vì độc lập dân tộc và tiến bộ xã hội.","liên hiệp","giáo hội","chia rẽ","thiểu số",["2. CN Mác - Lênin về vấn đề dân tộc","Đoàn kết, liên hiệp công nhân các dân tộc là cơ sở vững chắc để đoàn kết các tầng lớp nhân dân lao động thuộc các dân tộc trong cuộc đấu tranh chống chủ nghĩa đế quốc vì độc lập dân tộc và tiến bộ xã hội.",134]],[6,2,"Điền từ thích hợp vào chỗ trống: Đặc biệt trong giai đoạn hiện nay, Nhà nước Việt Nam đã thiết lập quan hệ ngoại giao với gần 200 ____ và vùng lãnh thổ trên toàn thế giới.","quốc gia","tôn giáo","dân tộc","bộ lạc",["5. Tôn giáo ở Việt Nam, chính sách của Đảng và Nhà nước","Đặc biệt trong giai đoạn hiện nay, Nhà nước Việt Nam đã thiết lập quan hệ ngoại giao với gần 200 quốc gia và vùng lãnh thổ trên toàn thế giới.",147]],[6,1,"Điền từ thích hợp vào chỗ trống: Trong phạm vi một quốc gia: Xu hướng thứ nhất thể hiện trong sự nỗ lực của từng dân tộc (____) để đi tới sự tự do, bình đẳng và phồn vinh của dân tộc mình.","tộc người","thiểu số","liên hiệp","chia rẽ",["2. CN Mác - Lênin về vấn đề dân tộc","Trong phạm vi một quốc gia: Xu hướng thứ nhất thể hiện trong sự nỗ lực của từng dân tộc (tộc người) để đi tới sự tự do, bình đẳng và phồn vinh của dân tộc mình.",132]],[6,2,"Điền từ thích hợp vào chỗ trống: Sự thống nhất đó, suy cho cùng là do các ____ đều có chung một lịch sử dựng nước và giữ nước, đều sớm hình thành ý thức về một quốc gia độc lập, thống nhất.","dân tộc","tôn giáo","gia đình","nhà nước",["3. Dân tộc và quan hệ dân tộc ở Việt Nam","Sự thống nhất đó, suy cho cùng là do các dân tộc đều có chung một lịch sử dựng nước và giữ nước, đều sớm hình thành ý thức về một quốc gia độc lập, thống nhất.",136]],[6,2,"Điền từ thích hợp vào chỗ trống: Thực hiện tốt chiến lược phát triển kinh tế - xã hội ở ____, vùng sâu, vùng xa, vùng biên giới, vùng căn cứ địa cách mạng.","miền núi","bình đẳng","tộc người","ngôn ngữ",["3. Dân tộc và quan hệ dân tộc ở Việt Nam","Thực hiện tốt chiến lược phát triển kinh tế - xã hội ở miền núi, vùng sâu, vùng xa, vùng biên giới, vùng căn cứ địa cách mạng.",139]],[6,2,"Điền từ thích hợp vào chỗ trống: Vận mệnh của cộng đồng ____ gắn bó với việc xác lập và bảo vệ lãnh thổ quốc gia.","tộc người","thiểu số","bình đẳng","chia rẽ",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Vận mệnh của cộng đồng tộc người gắn bó với việc xác lập và bảo vệ lãnh thổ quốc gia.",128]],[6,1,"Điền từ thích hợp vào chỗ trống: Quyền ____ giữa các dân tộc là cơ sở để thực hiện quyền dân tộc tự quyết và xây dựng mối quan hệ hữu nghị, hợp tác giữa các dân tộc.","bình đẳng","chia rẽ","thị tộc","tín ngưỡng",["2. CN Mác - Lênin về vấn đề dân tộc","Quyền bình đẳng giữa các dân tộc là cơ sở để thực hiện quyền dân tộc tự quyết và xây dựng mối quan hệ hữu nghị, hợp tác giữa các dân tộc.",133]],[6,1,"Điền từ thích hợp vào chỗ trống: Mọi công dân không phân biệt ____, tôn giáo đều có quyền và nghĩa vụ xây dựng, bảo vệ Tổ quốc.","tín ngưỡng","bình đẳng","chia rẽ","liên hiệp",["5. Tôn giáo ở Việt Nam, chính sách của Đảng và Nhà nước","Mọi công dân không phân biệt tín ngưỡng, tôn giáo đều có quyền và nghĩa vụ xây dựng, bảo vệ Tổ quốc.",148]],[6,1,"Điền từ thích hợp vào chỗ trống: ____ dân tộc bao gồm quyền tách ra thành lập một quốc gia dân tộc độc lập, đồng thời có quyền tự nguyện liên hiệp với dân tộc khác trên cơ sở bình đẳng.","Quyền tự quyết","bộ tộc","thế giới quan","tín ngưỡng",["2. CN Mác - Lênin về vấn đề dân tộc","Quyền tự quyết dân tộc bao gồm quyền tách ra thành lập một quốc gia dân tộc độc lập, đồng thời có quyền tự nguyện liên hiệp với dân tộc khác trên cơ sở bình đẳng.",133]],[6,2,"Điền từ thích hợp vào chỗ trống: Hình thức tổ chức, tính chất của nhà nước do chế độ chính trị của ____ quyết định.","dân tộc","miền núi","lãnh thổ","ngôn ngữ",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Hình thức tổ chức, tính chất của nhà nước do chế độ chính trị của dân tộc quyết định.",null]],[6,3,"Điền từ thích hợp vào chỗ trống: Trong phạm vi quốc tế: Xu hướng thứ nhất thể hiện trong phong trào giải phóng ____ nhằm chống lại chủ nghĩa đế quốc và chống chính sách thực dân đô hộ dưới mọi hình thức, phá bỏ mọi áp bức bóc lột của chủ nghĩa đế quốc.","dân tộc","tôn giáo","tín ngưỡng","giai cấp",["2. CN Mác - Lênin về vấn đề dân tộc","Trong phạm vi quốc tế: Xu hướng thứ nhất thể hiện trong phong trào giải phóng dân tộc nhằm chống lại chủ nghĩa đế quốc và chống chính sách thực dân đô hộ dưới mọi hình thức, phá bỏ mọi áp bức bóc lột của chủ nghĩa đế quốc.",132]],[6,2,"Điền từ thích hợp vào chỗ trống: Kiên quyết đấu tranh, xử lý các tổ chức, các đối tượng có các hoạt động vi phạm pháp luật truyền đạo trái phép, hoặc lợi dụng vấn đề dân tộc, tôn giáo và nhân quyền để kích động quần chúng, ____ tình đoàn kết dân tộc, đoàn kết tôn giáo.","chia rẽ","thiểu số","giáo hội","quốc gia",["7. Định hướng giải quyết quan hệ dân tộc, tôn giáo","Kiên quyết đấu tranh, xử lý các tổ chức, các đối tượng có các hoạt động vi phạm pháp luật truyền đạo trái phép, hoặc lợi dụng vấn đề dân tộc, tôn giáo và nhân quyền để kích động quần chúng, chia rẽ tình đoàn kết dân tộc, đoàn kết tôn giáo.",155]],[6,2,"Điền từ thích hợp vào chỗ trống: Trong mọi trường hợp, ____ xu hướng đó luôn có sự tác động qua lại với nhau, hỗ trợ cho nhau, mọi sự vi phạm mối quan hệ biện chứng này đều dẫn tới những hậu quả tiêu cực, khó lường.","hai","sáu","ba","bốn",["2. CN Mác - Lênin về vấn đề dân tộc","Trong mọi trường hợp, hai xu hướng đó luôn có sự tác động qua lại với nhau, hỗ trợ cho nhau, mọi sự vi phạm mối quan hệ biện chứng này đều dẫn tới những hậu quả tiêu cực, khó lường.",132]],[6,2,"Điền từ thích hợp vào chỗ trống: Ở phương Tây, ____ xuất hiện khi phương thức sản xuất tư bản chủ nghĩa được xác lập thay thế phương thức sản xuất phong kiến.","dân tộc","gia đình","tín ngưỡng","giai cấp",["1. Khái niệm, đặc trưng cơ bản của dân tộc","Ở phương Tây, dân tộc xuất hiện khi phương thức sản xuất tư bản chủ nghĩa được xác lập thay thế phương thức sản xuất phong kiến.",127]],[6,2,"Điền từ thích hợp vào chỗ trống: Việc theo đạo, truyền đạo cũng như mọi hoạt động tôn giáo khác đều phải tuân thủ Hiến pháp và pháp luật; không được lợi dụng tôn giáo để tuyên truyền tà đạo, hoạt động ____, không được ép buộc người dân theo đạo.","mê tín dị đoan","thị tộc","ngôn ngữ","thế giới quan",["5. Tôn giáo ở Việt Nam, chính sách của Đảng và Nhà nước","Việc theo đạo, truyền đạo cũng như mọi hoạt động tôn giáo khác đều phải tuân thủ Hiến pháp và pháp luật; không được lợi dụng tôn giáo để tuyên truyền tà đạo, hoạt động m
